# Preview of a pull request on its own URL, before it's merged and goes live (docs/DEVELOPERS.md, "Previews").
# Uploads the PR's code to the separate wishlist-preview Worker (env.preview in wrangler.jsonc), which has its own
# empty D1 database, no custom domains and no hourly notifications. The live Worker and database are never touched.
# Each PR gets a stable URL, https://pr-<number>-wishlist-preview.<your-subdomain>.workers.dev, posted as a PR comment.
# Needs two repository secrets (the same ones the backup workflow uses): CLOUDFLARE_API_TOKEN (Account > Workers
# Scripts > Edit and Account > D1 > Edit) and CLOUDFLARE_ACCOUNT_ID. Until both are set, it skips with a warning.
# Pushes made with a token that can't start workflows (like Claude's) don't run it: use Actions > preview >
# Run workflow and pick the branch.
name: preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preview:
    # Forks never get the secrets, and their code shouldn't run with them anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No preview: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to turn previews on."
          fi
      - name: Never preview main
        if: steps.ready.outputs.ok == 'true' && env.BRANCH == 'main'
        run: |
          echo "::error::main is the live app. Pick a feature branch."
          exit 1
      - name: Find the pull request
        id: pr
        if: steps.ready.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            let number = context.payload.pull_request?.number;
            if (!number) {
              const { data } = await github.rest.pulls.list({ ...context.repo, state: "open", head: `${context.repo.owner}:${process.env.BRANCH}` });
              number = data[0]?.number;
            }
            // Preview aliases: lowercase letters, digits and dashes.
            const slug = process.env.BRANCH.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30).replace(/-+$/, "");
            core.setOutput("number", number ? String(number) : "");
            core.setOutput("alias", number ? `pr-${number}` : `br-${slug}`);
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.ready.outputs.ok == 'true'
      - name: Point the preview at the wishlist-preview database
        if: steps.ready.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="wishlist-preview");process.stdout.write(db?db.uuid:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create wishlist-preview
            id=$(find_id)
          fi
          live=$(node -e 'const s=require("fs").readFileSync("wrangler.jsonc","utf8");console.log(s.match(/"database_name": "wishlist", "database_id": "([^"]+)"/)[1])')
          if [ -z "$id" ] || [ "$id" = "$live" ]; then
            echo "::error::Couldn't find a separate wishlist-preview database."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc
      - name: Apply migrations to the preview database
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply wishlist-preview --env preview --remote
      - name: Create the preview Worker the first time
        if: steps.ready.outputs.ok == 'true'
        run: |
          if ! npx wrangler deployments list --env preview > /dev/null 2>&1; then
            npx wrangler deploy --env preview
          fi
      - name: Upload the preview
        id: upload
        if: steps.ready.outputs.ok == 'true'
        env:
          ALIAS: ${{ steps.pr.outputs.alias }}
        run: |
          npx wrangler versions upload --env preview --preview-alias "$ALIAS" --message "$BRANCH ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -o 'Version Preview Alias URL: https://[^ ]*' upload.log | sed 's/.*: //')
          if [ -z "$url" ]; then
            echo "::error::Uploaded, but Cloudflare gave no preview URL. Check that workers.dev is turned on for wishlist-preview."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the URL on the pull request
        if: steps.ready.outputs.ok == 'true' && steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
          NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const marker = "<!-- hints-preview -->";
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nUpdated for ${context.sha.slice(0, 7)}. Uses the separate preview database (starts empty), never the live one.`;
            const issue_number = Number(process.env.NUMBER);
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number, per_page: 100 });
            const old = data.find((c) => c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number, body });
