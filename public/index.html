<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist</title>
<meta name="description" content="Family wish lists: share what you'd like, mark what you're getting, keep private gift notes.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4A0E22" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B0D18" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/theme.js"></script>
<script>try { var ts = localStorage.getItem("wishlist-text"); if (ts) document.documentElement.dataset.text = ts; } catch (e) {}</script>
<style>
  /* Warm and a little handmade: cream paper, a wine header band, burgundy for actions, gold for
     top picks, pine for "you're getting this". Fraunces for titles and big numbers, Figtree for the rest.
     Big tap targets and plain words so it works for every age. Motion marks real moments only. */
  :root {
    --bg: #FAF6F1; --card: #FFFFFF; --panel: #F3ECE4; --ink: #2A1E22; --muted: #6B5E62; --faint: #A3979A;
    --line: #EADFD4; --brand: #7A1B36; --brand-ink: #FFFFFF; --soft: #F7E6EA; --soft-ink: #7A1B36;
    --hero: #4A0E22; --hero-ink: #FFF8F2; --hero-muted: #E8C3CD;
    --gold: #D9A94A; --gold-ink: #7A5410; --gold-soft: #FBF1DC;
    --ok: #2F6B4F; --ok-soft: #E8F2EC; --warn: #A15C07; --warn-soft: #FDF3E2; --warn-bar: #C98A2E;
    --err-bg: #FCECEA; --err: #A32A22;
    --t0: #F7E6EA; --t0-ink: #7A1B36; --t1: #E6EFE9; --t1-ink: #2F6B4F; --t2: #FBF1DC; --t2-ink: #7A5410; --t3: #E8EAF4; --t3-ink: #33407A;
    --shadow: 0 1px 2px rgba(74, 14, 34, .06), 0 8px 20px rgba(74, 14, 34, .06);
    --r: 18px;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --sans: Figtree, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --spring: cubic-bezier(.3, 1.4, .5, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
      --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
      --hero: #2B0D18; --hero-ink: #FFF1F4; --hero-muted: #D9A7B5; --gold: #E0B75E; --gold-ink: #F1D08A; --gold-soft: #3A2F1C;
      --ok: #8FD0B4; --ok-soft: #1E3029; --warn: #F2C27A; --warn-soft: #3A2C17; --warn-bar: #D9A04A; --err-bg: #3A1F1D; --err: #F2BDB7;
      --t0: #3A2129; --t0-ink: #F0B5C4; --t1: #1E3029; --t1-ink: #8FD0B4; --t2: #3A2F1C; --t2-ink: #F1D08A; --t3: #252A3D; --t3-ink: #B4BDF0;
      --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
    --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
    --hero: #2B0D18; --hero-ink: #FFF1F4; --hero-muted: #D9A7B5; --gold: #E0B75E; --gold-ink: #F1D08A; --gold-soft: #3A2F1C;
    --ok: #8FD0B4; --ok-soft: #1E3029; --warn: #F2C27A; --warn-soft: #3A2C17; --warn-bar: #D9A04A; --err-bg: #3A1F1D; --err: #F2BDB7;
    --t0: #3A2129; --t0-ink: #F0B5C4; --t1: #1E3029; --t1-ink: #8FD0B4; --t2: #3A2F1C; --t2-ink: #F1D08A; --t3: #252A3D; --t3-ink: #B4BDF0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

  /* Text size setting (Settings > Text size). */
  :root[data-text="lg"] :is(main, .hero, dialog.sheet, nav.tabs, .toast) { zoom: 1.12; }
  :root[data-text="xl"] :is(main, .hero, dialog.sheet, .toast) { zoom: 1.25; }
  :root[data-text="xl"] nav.tabs { zoom: 1.12; }

  /* The theme button lives in Settings now. theme.js still applies the saved choice. */
  .theme-toggle { display: none !important; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font: inherit; color: var(--ink); }
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  main { max-width: 560px; margin: 0 auto;
    padding-block: 20px calc(env(safe-area-inset-bottom, 0px) + 120px);
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

  /* Wine header band */
  .hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink);
    padding: calc(env(safe-area-inset-top, 0px) + 26px) max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
  .hero-in { position: relative; max-width: 560px; margin: 0 auto; }
  .doodle { position: absolute; right: -28px; top: -14px; width: 240px; height: 170px; color: var(--hero-muted); opacity: .22; pointer-events: none; }
  @media (min-width: 720px) { .doodle { right: 4%; } }
  .kicker { margin: 0; color: var(--hero-muted); font-size: 15px; font-weight: 600; }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -.01em; margin: 4px 0 0; }
  .squiggle { display: block; margin-top: 6px; color: var(--gold); }
  .hero .back { color: var(--hero-muted); margin: -10px 0 6px -6px; padding: 0 8px 0 4px; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .hero-row .avatar { border: 2px solid var(--hero-muted); }
  .hero-row h1 { margin: 0; }
  .hero-row .who-name { flex: 1; min-width: 0; }
  .realname { display: block; color: var(--hero-muted); font-size: 14px; margin-top: 2px; }
  .lockline { display: inline-flex; align-items: center; gap: 5px; color: var(--hero-muted); font-size: 14px; font-weight: 600; margin-top: 8px; }
  .hero-meter { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; }
  .hero-meter .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .16); overflow: hidden; }
  .hero-meter .bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transform-origin: left; animation: fill 1s var(--spring) .2s both; }
  .hero-meter b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .hero-edit { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 11px; border-radius: 999px;
    border: 1.5px solid color-mix(in srgb, var(--hero-muted) 55%, transparent); background: transparent; color: var(--hero-ink); font-weight: 700; font-size: 15px; }
  .hero-edit:active { transform: scale(.96); }
  .hero-edit:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 380px) { .hero-edit span { display: none; } .hero-edit { padding: 0; width: 40px; justify-content: center; } }
  .hero-btn { margin-top: 16px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--hero-muted) 55%, transparent);
    background: transparent; color: var(--hero-ink); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .hero-stat { margin-top: 18px; }
  .big-num { display: block; font-family: var(--serif); font-size: 58px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero-sub { margin: 2px 0 0; color: var(--hero-muted); font-size: 15px; }
  .welcome-logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }

  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    display: grid; place-items: center; flex: none; padding: 0; }
  .press, .btn, .iconbtn, .member, .chip, .star-btn, .seg button { transition: transform .14s var(--spring); }
  :is(.press, .btn, .iconbtn, .member, .chip, .star-btn):active, .row[role="button"]:active { transform: scale(.97); }
  :is(.iconbtn, .btn, .tab, .row, .member, .add, .chip, .star-btn, .pcard-head, .seg button, .hero-btn, .back):focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .count-line { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
  .label { margin: 30px 0 4px; font-size: 18px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .label + .subtle { margin-top: 0; }
  .subtle { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .footnote { text-align: center; color: var(--muted); font-size: 14px; margin: 24px 0 0; }
  .spacer { flex: 1; }

  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; min-height: 48px; padding: 10px 18px; font-weight: 700; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.wide { width: 100%; }
  .btn.small { min-height: 44px; padding: 7px 14px; font-size: 15px; border-radius: 12px; }
  .btn.quiet { border-color: transparent; background: none; color: var(--brand); min-height: 44px; }
  .btn.danger { color: var(--err); }
  .btn[disabled] { opacity: .55; pointer-events: none; }
  .add { width: 100%; border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 16px; min-height: 54px; padding: 14px;
    font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 25%, transparent); }
  .add.soft { background: transparent; color: var(--brand); box-shadow: none; min-height: 52px; font-size: 16px; border: 1.5px dashed color-mix(in srgb, var(--brand) 35%, var(--line)); }

  .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 12px; }

  /* Wish cards */
  .row { position: relative; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: var(--r); padding: 14px; display: block; box-shadow: var(--shadow);
    transition: background-color .35s ease, box-shadow .35s ease, transform .14s var(--spring); }
  .row-top { display: flex; align-items: flex-start; gap: 14px; }
  .tile { width: 60px; height: 60px; border-radius: 14px; flex: none; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; font-weight: 600;
    background: var(--t0); color: var(--t0-ink); }
  .tile svg { width: 30px; height: 30px; }
  .tile.photo { background: #FFFFFF; padding: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .tile.photo img { width: 100%; height: 100%; object-fit: contain; border-radius: 9px; display: block; }
  .tile.fresh img { animation: fade .45s ease both; }
  .fillmsg img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
  .fillmsg.has-img { display: flex; align-items: center; gap: 10px; }
  .tile.t1 { background: var(--t1); color: var(--t1-ink); } .tile.t2 { background: var(--t2); color: var(--t2-ink); } .tile.t3 { background: var(--t3); color: var(--t3-ink); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-head { display: flex; align-items: flex-start; gap: 10px; }
  .row-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .row-price { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--soft-ink); white-space: nowrap; }
  .row-notes { color: var(--muted); font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row-foot:empty { display: none; }
  .open { font-size: 14px; font-weight: 700; color: var(--brand); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
  .from { font-size: 14px; color: var(--muted); }
  .from a { color: inherit; }
  .price-tag { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 9px; border-radius: 6px 14px 14px 6px;
    background: var(--soft); color: var(--soft-ink); font-family: var(--serif); font-size: 15px; font-weight: 600; transform: rotate(-3deg); transform-origin: 10px 50%; }
  .price-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--card); }
  .anyprice { font-size: 14px; color: var(--muted); }
  .hid-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--panel);
    border-radius: 999px; padding: 3px 10px; margin-top: 6px; width: fit-content; }
  .fam { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .fam:first-of-type { border-top: 0; padding-top: 0; }
  .fam .who { flex: 1; min-width: 0; }
  .fam strong { display: block; color: var(--ink); font-size: 17px; overflow-wrap: anywhere; }
  .fam small { color: var(--muted); font-size: 14px; }
  .fam .code-sm { font-weight: 800; letter-spacing: .1em; color: var(--ink); }
  .fam-label { justify-content: space-between; }
  .star-btn { position: relative; min-height: 44px; border: 0; border-radius: 999px; padding: 0 13px; background: var(--panel); color: var(--muted);
    font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .star-btn svg { transform: rotate(-6deg); }
  .star-btn svg path { fill: none; stroke: currentColor; }
  .star-btn[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold-ink); }
  .star-btn[aria-pressed="true"] svg path { fill: var(--gold); stroke: var(--gold-ink); }
  .star-btn.pop svg { animation: pop .5s ease both; }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); pointer-events: none; animation: spark .55s ease-out both; }
  .toppick { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; color: var(--gold-ink); }
  .toppick svg { transform: rotate(-6deg); }
  .toppick path { fill: var(--gold); stroke: var(--gold-ink); }

  /* Someone else's list */
  .row.mine { background: var(--ok-soft); box-shadow: none; }
  .row.taken { background: var(--panel); box-shadow: none; }
  .row.taken .tile { filter: grayscale(1); opacity: .6; }
  .row.taken .row-title { color: var(--muted); }
  .mine-line { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 700; font-size: 15px; }
  .chk { width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: var(--card); display: grid; place-items: center; flex: none; }
  .chk.new { animation: checkpop .45s var(--spring) both; }
  .taken-line { color: var(--muted); font-size: 14px; font-weight: 600; }
  .burst { position: absolute; left: 40px; bottom: 30px; width: 0; height: 0; pointer-events: none; }
  .bit { position: absolute; left: 0; top: 0; width: 9px; height: 5px; border-radius: 2px; animation: burst .85s cubic-bezier(.15, .7, .4, 1) both; }
  .chips { display: flex; gap: 8px; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .chip { display: inline-flex; align-items: center; gap: 7px; flex: none; }
  .chip svg { opacity: .8; }
  .chip-n { font-size: 13px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: inline-grid; place-items: center;
    background: var(--panel); color: var(--muted); }
  .chip[aria-pressed="true"] .chip-n { background: color-mix(in srgb, var(--brand-ink) 22%, transparent); color: var(--brand-ink); }

  /* Someone's list: summary, filters, wish cards */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border-radius: 16px; padding: 12px 12px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
  .stat b { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .stat b.sm { font-size: 16px; line-height: 1.25; white-space: normal; padding: 2px 0 3px; }
  .stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat.ok { background: var(--ok-soft); box-shadow: none; } .stat.ok b { color: var(--ok); }
  .stat.gold { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent), var(--shadow); }
  .toolbar { margin-bottom: 16px; }
  .toolbar .chips { margin: 0 -18px 10px; padding: 2px 18px; }
  .toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toggle { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--brand); margin: 0; }
  .sort { position: relative; display: inline-flex; align-items: center; }
  .sort select { appearance: none; -webkit-appearance: none; min-height: 44px; padding: 0 38px 0 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); font-weight: 700; font-size: 15px; cursor: pointer; }
  .sort .chev-d { position: absolute; right: 10px; pointer-events: none; color: var(--muted); }
  .showing { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .linkbtn { border: 0; background: none; padding: 0 0 0 6px; color: var(--brand); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
  .nomatch { text-align: center; background: var(--card); border-radius: var(--r); padding: 24px 18px; box-shadow: var(--shadow); }
  .nomatch p { margin: 4px 0 14px; color: var(--muted); }

  .wish { padding: 16px; }
  .wish .tile { width: 92px; height: 92px; border-radius: 16px; }
  .wish .tile svg { width: 40px; height: 40px; }
  .wish .tile.photo { padding: 7px; }
  .wish .row-main { gap: 4px; }
  .wish .row-title { font-size: 18px; }
  .wish-price { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.2; color: var(--soft-ink); font-variant-numeric: tabular-nums; }
  .wish-price.none { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--faint); }
  .wish-price.fresh { animation: fade .45s ease both; }
  .wish-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .wish-meta a { color: inherit; }
  .wish-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
  .cat-tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--ink); }
  .cat-tag svg { color: var(--brand); }
  .from .cat-tag { margin-right: 2px; }
  .wish-note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--panel); font-size: 15px; line-height: 1.45; color: var(--ink);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .wish-note span { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .wish .row-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .wish.mine .row-foot, .wish.taken .row-foot { border-top-color: transparent; padding-top: 0; }
  .wish.is-top { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent), var(--shadow); }
  .top-ribbon { position: absolute; top: -9px; right: 14px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px 0 7px; border-radius: 12px;
    background: var(--gold); color: #3B2A06; font-size: 13px; font-weight: 800; box-shadow: 0 2px 6px rgba(74, 14, 34, .15); }

  /* People */
  .member { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--card); border: 0; border-radius: var(--r);
    padding: 16px; text-align: left; box-shadow: var(--shadow); min-height: 76px; }
  .avatar { position: relative; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 20px; flex: none; color: #fff; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .avatar.huge { width: 88px; height: 88px; font-size: 36px; }
  .photo-row { display: flex; align-items: center; gap: 16px; }
  .photo-row .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .avatar.big { width: 56px; height: 56px; font-size: 24px; }
  .member .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .member strong { display: block; font-size: 18px; }
  .member small { color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
  .mini { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .mini .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; }
  .mini .bar i { display: block; height: 100%; border-radius: 3px; background: var(--brand); transform-origin: left; animation: fill .9s var(--spring) .3s both; }
  .mini.over .bar i { background: var(--warn-bar); }
  .mini.over span { color: var(--warn); font-weight: 700; }
  .chev { color: var(--faint); flex: none; transition: transform .2s ease; }
  .member:hover .chev { transform: translateX(3px); }
  .invite { display: flex; align-items: center; gap: 12px; }
  .code { font-size: 26px; font-weight: 800; letter-spacing: .14em; }

  .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--brand); font-weight: 700; font-size: 16px;
    padding: 8px 0; margin: -8px 0 10px; min-height: 44px; }

  /* Empty states */
  .empty { text-align: center; padding: 18px 10px 6px; }
  .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.25; margin: 10px auto 6px; max-width: 300px; }
  .empty p { color: var(--muted); margin: 0 auto 18px; max-width: 320px; }
  .empty .stack { text-align: left; }
  .giftbox { width: 140px; height: 132px; border: 0; background: none; padding: 0; position: relative; display: block; margin: 0 auto; }
  .giftbox svg { display: block; width: 140px; height: 124px; animation: bob 2.8s ease-in-out infinite; }
  .giftbox .shadow { position: absolute; left: 38px; right: 38px; bottom: 0; height: 8px; border-radius: 50%; background: var(--line); animation: shadow 2.8s ease-in-out infinite; }
  .giftbox .lid { transform-origin: 20px 46px; }
  .giftbox.opened svg { animation: none; }
  .giftbox.opened .lid { animation: lid .55s var(--spring) both; }
  .giftbox .box { fill: var(--soft); stroke: var(--brand); } .giftbox .lidfill { fill: color-mix(in srgb, var(--soft) 60%, var(--card)); stroke: var(--brand); }
  .giftbox .ribbon { fill: var(--brand); } .giftbox .bow { fill: var(--gold); stroke: var(--brand); }

  /* Forms */
  label.field { display: block; margin-bottom: 16px; }
  label.field > span { display: block; font-size: 16px; font-weight: 700; margin-bottom: 7px; }
  label.field > span em { font-style: normal; font-weight: 500; color: var(--faint); }
  .input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 15px; font-size: 17px; min-height: 54px; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  textarea.input { min-height: 90px; resize: vertical; }
  .input.code-in { font-size: 28px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; text-align: center; }
  .input.pin-in { font-size: 28px; font-weight: 800; letter-spacing: .6em; text-align: center; }
  .money-in { display: flex; align-items: center; gap: 4px; padding: 0 15px; }
  .money-in span { color: var(--muted); font-size: 18px; }
  .money-in input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 18px; min-height: 50px; }
  .money-in:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  /* Checkboxes look like switches */
  .check { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 16px; margin-bottom: 16px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 56px; }
  .check small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
  .check input { order: 2; appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line);
    position: relative; flex: none; margin: 0; transition: background .2s; cursor: pointer; }
  .check input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--spring); }
  .check input:checked { background: var(--brand); }
  .check input:checked::after { transform: translateX(20px); }
  .check input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-bottom: 16px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions .btn { flex: 1; }
  details.more { margin-bottom: 16px; }
  details.more summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 48px; font-weight: 700; color: var(--brand); }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary svg { transition: transform .25s var(--spring); }
  details.more[open] summary svg { transform: rotate(180deg); }
  details.more[open] > div { animation: open .3s ease both; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--panel); border-radius: 14px; padding: 4px; margin-bottom: 8px; }
  .seg button { min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 700; font-size: 15px; color: var(--muted); }
  .seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* Bottom tabs: My list, Family, [Add a wish], Budget, Settings */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 96%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 6px max(4px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px); }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; }
  .tab { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0;
    font-size: 12px; font-weight: 600; border-radius: 12px; min-height: 52px; }
  .tab .ico { width: 54px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .2s ease; }
  .tab[aria-current="page"] { color: var(--brand); font-weight: 800; }
  .tab[aria-current="page"] .ico { background: var(--soft); animation: hop .55s ease .05s both; }
  .tab.add-tab { color: var(--brand); font-weight: 800; }
  .add-tab .fab { width: 60px; height: 60px; margin-top: -28px; border-radius: 50%; background: var(--brand); color: var(--brand-ink);
    border: 4px solid var(--bg); display: grid; place-items: center; box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 38%, transparent);
    transition: transform .2s var(--spring); }
  .add-tab:active .fab { transform: scale(.9) rotate(90deg); }

  /* Sheet */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; background: var(--bg); color: var(--ink);
    border-radius: 26px 26px 0 0; }
  dialog.sheet[open] { animation: sheetUp .42s cubic-bezier(.2, .9, .3, 1) both; }
  @media (min-width: 620px) { dialog.sheet { margin: auto; border-radius: 22px; } dialog.sheet[open] { animation: rise .3s ease both; } }
  dialog.sheet::backdrop { background: rgba(30, 15, 20, .45); animation: fade .25s ease both; }
  .sheet-in { padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .sheet-close { position: absolute; top: 14px; right: 14px; font-size: 26px; line-height: 1; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.2; margin: 0 52px 16px 0; }
  .sheet-sec { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 20px; }
  .sheet-sec h4 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .sheet .what { color: var(--ink); font-weight: 700; font-size: 17px; margin: -6px 0 16px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); translate: -50% 0; z-index: 30;
    background: var(--ink); color: var(--bg); border-radius: 16px; padding: 6px 8px 6px 16px; min-height: 52px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.25); width: max-content; max-width: calc(100% - 32px);
    animation: toastIn .35s cubic-bezier(.2, .9, .3, 1.2) both; }
  .toast svg { flex: none; color: #9FD3B4; }
  .toast button { border: 0; background: none; color: var(--gold); font-weight: 800; min-height: 44px; padding: 0 12px; border-radius: 10px; }
  .toast span { padding-right: 8px; }
  .offline { background: var(--panel); color: var(--muted); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .loading { color: var(--faint); text-align: center; padding: 50px 0; }
  .picker { display: grid; gap: 10px; margin-bottom: 14px; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow .input { flex: 1; min-width: 0; }
  .linkrow .btn { min-height: 54px; }
  .photo-box { margin-bottom: 16px; }
  .photo-btn { background: var(--soft); border-color: transparent; color: var(--soft-ink); min-height: 50px; }
  .photo-status { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .photo-status img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none; }
  .photo-status strong { color: var(--ink); }
  .picks { display: grid; gap: 8px; margin-top: 12px; }
  .pick { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
  .pick strong { font-size: 16px; }
  .pick small { color: var(--muted); font-size: 14px; }
  .pick em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--ok); }
  .pick .where { font-size: 13px; color: var(--muted); }
  .pick .where.found { color: var(--brand); font-weight: 600; }
  .pick.on { border-color: var(--brand); background: var(--soft); }
  .pick.none { color: var(--muted); font-weight: 600; text-align: center; display: block; }
  .fillmsg { display: block; color: var(--muted); font-size: 14px; margin-top: 7px; }
  .fillmsg.ok { color: var(--ok); font-weight: 600; }

  /* Budget */
  .pcard { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .pcard-head { width: 100%; border: 0; background: none; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .pcard-top { display: flex; align-items: center; gap: 12px; width: 100%; }
  .pcard-top .avatar { width: 44px; height: 44px; font-size: 19px; }
  .pcard-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pcard-who strong { font-size: 17px; }
  .pcard-who small { color: var(--muted); font-size: 14px; }
  .pill { font-size: 14px; font-weight: 700; padding: 5px 10px; border-radius: 10px; white-space: nowrap; background: var(--ok-soft); color: var(--ok); }
  .pill.over { background: var(--warn-soft); color: var(--warn); }
  .pill.none { background: var(--panel); color: var(--muted); }
  .pcard .chev-d { color: var(--muted); flex: none; transition: transform .3s var(--spring); }
  .pcard.is-open .chev-d { transform: rotate(180deg); }
  .meter { width: 100%; height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transform-origin: left; animation: fill 1s var(--spring) .25s both; }
  .meter.over i { background: var(--warn-bar); }
  .pcard-body { padding: 0 16px 16px; animation: open .32s cubic-bezier(.2, .8, .3, 1) both; }
  .buys { list-style: none; margin: 0 0 12px; padding: 0; }
  .buys li { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .buys small { display: block; color: var(--muted); font-size: 13px; }
  .buys b { font-family: var(--serif); font-weight: 600; color: var(--soft-ink); white-space: nowrap; }
  .pcard-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pcard-body .stack { margin: 12px 0; }
  .pcard-body .row { box-shadow: none; border: 1.5px solid var(--line); }

  /* Motion. Every animation marks a real moment; all of it turns off with Reduce Motion. */
  .slide { animation: slide .45s cubic-bezier(.2, .8, .3, 1) both; }
  .drop { animation: drop .6s cubic-bezier(.2, .8, .3, 1) both; }
  .drop .price-tag { animation: swing 1s ease .35s both; }
  @keyframes slide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-28px) scale(.96); } 55% { opacity: 1; transform: translateY(5px) scale(1.01); } 80% { transform: translateY(-2px); } 100% { opacity: 1; transform: none; } }
  @keyframes swing { 0% { transform: rotate(-3deg); } 25% { transform: rotate(9deg); } 50% { transform: rotate(-7deg); } 75% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }
  @keyframes pop { 0% { transform: scale(1) rotate(-6deg); } 30% { transform: scale(1.5) rotate(-18deg); } 60% { transform: scale(.9) rotate(4deg); } 100% { transform: scale(1) rotate(-6deg); } }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
  @keyframes burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.5); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); } }
  @keyframes checkpop { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes hop { 0%, 100% { transform: none; } 35% { transform: translateY(-6px); } 65% { transform: translateY(1px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .5; } }
  @keyframes lid { 0% { transform: none; } 45% { transform: translateY(-26px) rotate(-20deg); } 100% { transform: translateY(-16px) rotate(-14deg); } }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes open { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes sheetUp { 0% { transform: translateY(100%); } 70% { transform: translateY(-6px); } 100% { transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(20px) scale(.96); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after, ::backdrop { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
"use strict";
const API = "/api/";
const TOKEN_KEY = "wishlist-token";
const CACHE_KEY = "wishlist-cache";
const TEXT_KEY = "wishlist-text";

// ---------- tiny helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (c) => (c == null ? "" : (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: c % 100 ? 2 : 0 }));
const priceIn = (c) => (c == null ? "" : String(c / 100));
const initial = (n) => (n || "?").trim().charAt(0).toUpperCase();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

async function api(path, data) {
  const opts = { headers: { "content-type": "application/json" } };
  const t = getToken();
  if (t) opts.headers["x-wishlist-token"] = t;
  if (data !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(data); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { const e = new Error("You're offline. Try again when you have a connection."); e.offline = true; throw e; }
  const out = await res.json().catch(() => ({}));
  if (res.status === 401 && t) { setToken(null); state.me = null; render(); }
  if (!res.ok) { const e = new Error(out.error || "Something went wrong."); e.status = res.status; throw e; }
  return out;
}

// Loads from the API, falling back to the last copy saved on this device when offline.
async function load(path) {
  try {
    const data = await api(path);
    writeCache(path, data);
    $("#offline").hidden = true;
    return data;
  } catch (e) {

    if (e.offline && cached) { $("#offline").hidden = false; return cached; }

// Counts a big number up (or down) to its value, like an odometer.
function countUp(el, fromCents, toCents) {
  if (!el) return;
  if (reduceMotion() || fromCents === toCents) { el.textContent = money(toCents); return; }
  const t0 = performance.now(), d = 900;
  const step = (t) => {
    const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);

    if (p < 1) requestAnimationFrame(step); else el.textContent = money(toCents);
  };
  requestAnimationFrame(step);
}

      if (!el.name) continue;
      data[el.name] = el.type === "checkbox" ? el.checked : el.value;
    }
    try { await submit(data); }
    catch (err) { errEl.textContent = err.message; errEl.hidden = false; }
    finally { btn.disabled = false; }
  });
}

// ---------- state + routing ----------
// One-shot animation flags: the next render plays them once, then they're cleared.
const state = { me: null, groups: [], season: null, tab: "mine", person: null, view: null, openPeople: new Set(), flash: null, burst: null, pop: null, lastLeft: null };

const hashFor = (tab) => (tab === "notes" ? "budget" : tab);
function setTab(tab, person = null) {
  state.tab = tab;
  state.person = person;
  state.view = null;
  const h = person ? `#person/${person}` : `#${hashFor(tab)}`;
  if (location.hash !== h) history.pushState(null, "", h);
  window.scrollTo(0, 0);
  render();
}
window.addEventListener("popstate", () => { readHash(); render(); });
function readHash() {
  const h = location.hash.slice(1);
  if (h.startsWith("person/")) { if (state.person !== h.slice(7)) state.view = null; state.tab = "family"; state.person = h.slice(7); }
  else if (h === "budget" || h === "notes") { state.tab = "notes"; state.person = null; }
  else if (["mine", "family"].includes(h)) { state.tab = h; state.person = null; }
}
document.querySelectorAll(".tab[data-tab]").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
$("#addTab").onclick = () => editItem();
$("#settingsTab").onclick = () => openSettings();

const group = () => state.groups[0] || null;
// You can be in several families. People are listed once even if they share more than one with you.
const multi = () => state.groups.length > 1;
function everyone() {
  const seen = new Map();
  for (const g of state.groups) for (const m of g.members) if (!seen.has(m.id)) seen.set(m.id, m);
  return [...seen.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
}
const others = () => everyone().filter((m) => m.id !== state.me.id);
const personName = (id) => everyone().find((m) => m.id === id)?.name || "Someone";
const groupName = (id) => state.groups.find((g) => g.id === id)?.name || "a family";

async function refreshMe() {
  const data = await load("me");
  state.me = data.me;
  state.groups = data.groups;
  for (const g of data.groups) notePhotos(g.members);
  notePhotos([data.me]);
  state.season = data.season;
}

async function render() {
  const signedIn = !!getToken();
  $("#tabs").hidden = !signedIn;
  if (!signedIn) return renderWelcome();

  document.querySelectorAll(".tab[data-tab]").forEach((b) => b.setAttribute("aria-current", !state.person && b.dataset.tab === state.tab ? "page" : "false"));
  if (state.person) $('.tab[data-tab="family"]').setAttribute("aria-current", "page");
  try {
    if (!state.me) await refreshMe();
    if (state.person) await renderPerson(state.person);
    else if (state.tab === "family") await renderFamily();
    else if (state.tab === "notes") await renderTracker();
    else await renderMine();
  } catch (e) {
    if (!getToken()) return;
    $("#view").innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn" type="button" id="retry">Try again</button>`;
    $("#retry").onclick = () => { state.me = null; render(); };
  }
  state.flash = state.burst = state.pop = null;
  fetchImages($("#view"));
}

// Top pick is the old "must have": one tap on the card, saved right away.

// ---------- autofill from a link ----------
function linkField(value) {
  return `<label class="field"><span>Have a link? <em>Paste it to fill in the rest</em></span>
    <div class="linkrow"><input class="input" name="url" type="url" inputmode="url" value="${esc(value)}" placeholder="Paste a link">
    <button class="btn small" type="button" data-fill>Fill</button></div>
    <small class="fillmsg" hidden></small></label>
    <div class="photo-box">
      <input type="file" accept="image/*" data-photo hidden>
      <button class="btn wide photo-btn" type="button" data-photo-btn>${CAMERA} Or snap a photo of it</button>
      <div class="photo-status" hidden></div>
      <div class="picks" hidden></div>
    </div>`;
}

// Shrink the photo on the phone before sending (faster, cheaper). Returns a JPEG data URL.
function shrinkPhoto(file, maxSide = 1024, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL("image/jpeg", quality), preview: c.toDataURL("image/jpeg", 0.6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try another one.")); };
    img.src = url;
  });
}

// Profile photo: center crop to a small square JPEG (about 10 to 20 KB).
function squarePhoto(file, side = 256) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement("canvas");
      c.width = c.height = Math.min(side, s);
      c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try another one.")); };
    img.src = url;
  });
}

const range = (lo, hi) => (lo && hi && lo !== hi ? `Usually $${lo} to $${hi}` : lo || hi ? `Usually about $${lo || hi}` : "");
const where = (x) => (x.link === "product" ? `At ${x.store}${x.price ? ` for ${money(Math.round(x.price * 100))}` : ""}` : `Search ${x.store}`);

// Photo: Gemini suggests what it might be; tapping a suggestion fills the name, a store link, and the price when known.
function wirePhoto(form) {
  const input = form.querySelector("[data-photo]"), btn = form.querySelector("[data-photo-btn]");
  const status = form.querySelector(".photo-status"), picks = form.querySelector(".picks");
  btn.addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const file = input.files[0];
    input.value = "";
    if (!file) return;
    picks.hidden = true;
    btn.disabled = true;
    try {
      const photo = await shrinkPhoto(file);
      status.innerHTML = `<img src="${photo.preview}" alt=""><span>Looking at your photo and checking stores...</span>`;
      status.hidden = false;
      const { suggestions } = await api("identify", { image: photo.data });
      if (!suggestions.length) {
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>Couldn't tell what this is. Try a closer photo, or type it in above.</span>`;
        return;
      }
      status.innerHTML = `<img src="${photo.preview}" alt=""><span><strong>Is it one of these?</strong> Tap the closest match.</span>`;
      picks.innerHTML = suggestions.map((x, i) => `<button class="pick" type="button" data-i="${i}">
          <strong>${esc(x.title)}</strong>${x.detail ? `<small>${esc(x.detail)}</small>` : ""}${!x.price && range(x.price_low, x.price_high) ? `<em>${esc(range(x.price_low, x.price_high))}</em>` : ""}<span class="where${x.link === "product" ? " found" : ""}">${esc(where(x))}</span>
        </button>`).join("") + '<button class="pick none" type="button" data-none>None of these</button>';
      picks.hidden = false;
      // Remember what a tap filled in, so tapping a different match replaces it but never overwrites your typing.
      let filled = { url: "", price: "" };
      picks.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
        const x = suggestions[+b.dataset.i];
        const { url, price } = form.elements;
        form.elements.title.value = x.title;
        if (!url.value.trim() || url.value === filled.url) url.value = filled.url = x.url || "";
        if (price && (!price.value.trim() || price.value === filled.price)) price.value = filled.price = x.price ? String(x.price) : "";
        picks.querySelectorAll(".pick").forEach((p) => p.classList.toggle("on", p === b));
        const note = x.link === "product"
          ? `<strong>Added it.</strong> The link goes to ${esc(x.store)}${x.price ? ", and the price is filled in" : ""}. Paste a different store link to change it.`
          : `<strong>Added the name.</strong> We couldn't confirm a product page, so the link searches ${esc(x.store)}. Paste a store link instead and tap Fill to get the exact price.`;
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>${note}</span>`;
        form.elements.title.scrollIntoView({ behavior: "smooth", block: "center" });
      }));
      picks.querySelector("[data-none]").onclick = () => {
        picks.hidden = true;
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>No problem. Type the name above, or try another photo.</span>`;
        form.elements.title.focus();
      };
    } catch (e) {
      status.innerHTML = `<span>${esc(e.message)}</span>`;
      status.hidden = false;
    } finally { btn.disabled = false; }
  });
}

// Share buttons in store apps paste text plus a link ("Check out X! https://...").
// Split it into the link and the leftover words. Must match sharedUrl() in src/wishlist.js.
function splitShared(raw) {
  const s = String(raw || "").trim();
  if (/^https?:\/\/\S+$/i.test(s)) return { url: s, hint: "" };
  const m = s.match(/https?:\/\/[^\s<>"']+/i) || s.match(/(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s<>"']*/i);
  if (!m) return { url: s, hint: "" };
  const url = m[0].replace(/[).,!?;:'"\]]+$/, "");
  return { url, hint: shareHint(s.slice(0, m.index) + " " + s.slice(m.index + m[0].length)) };
}

// Turn "Check out Lip Oil on Ulta Beauty!" into "Lip Oil". Only used when the page gives no name.
function shareHint(t) {
  t = t.replace(/\s+/g, " ").trim()
    .replace(/^(hey[,!]?\s*)?(check (this|it) out|check out( this( product| item)?)?|look (at )?(what|this)( i found)?|i found this|found this|shop( now)?|buy( now)?)\s*(on|at|from)?\s*[:!.\-]*\s*/i, "")
    .replace(/(\s+(on|at|from|via)\s+|\s+[|\-–]\s+)[\w&'. ]{2,30}[!.]*$/i, (x) => (/\b(app|beauty|store|shop|amazon|target|walmart|sephora|ulta|etsy)\b/i.test(x) ? "" : x))
    .replace(/^[\w&'. ]{2,30}:\s*/, (x) => (/\b(app|beauty|store|shop|amazon|target|walmart|sephora|ulta|etsy)\b/i.test(x) ? "" : x))
    .replace(/^["'\s:!.\-([]+|["'\s:!.\-([]+$/g, "");
  return t.length >= 3 && t.length <= 150 && /[a-z]/i.test(t) ? t : "";
}

// The photo autofill found, if the link box still holds that link.
const imageFor = (form) => (form.dataset.image && form.dataset.imageFor === form.elements.url.value.trim() ? form.dataset.image : undefined);

// Pasting a link (or tapping Fill) looks up the product and fills the empty name and price fields.
function wireAutofill(form) {
  wirePhoto(form);
  const url = form.elements.url, btn = form.querySelector("[data-fill]"), msg = form.querySelector(".fillmsg");
  const title = form.elements.title, price = form.elements.price;
  const say = (t, ok, img) => {
    msg.textContent = t;
    if (img) { const el = document.createElement("img"); el.src = img; el.alt = ""; el.referrerPolicy = "no-referrer"; el.onerror = () => el.remove(); msg.prepend(el); }
    msg.hidden = !t; msg.classList.toggle("ok", !!ok); msg.classList.toggle("has-img", !!img);
  };
  let busy = false, hint = "";
  // Keep just the link in the box; remember the shared words as a backup name.
  const tidy = (raw) => {
    const s = splitShared(raw);
    if (s.url !== url.value) url.value = s.url;
    if (s.hint) hint = s.hint;
  };
  async function fill(force) {
    tidy(url.value);
    const v = url.value.trim();
    if (!v || busy) return;
    busy = true; btn.disabled = true; say("Looking it up...");
    try {
      const r = await api("preview", { url: v }).catch((e) => {
        if (!hint) throw e;
        return { site: "the link" };
      });
      if (!r.title && hint) r.title = hint;
      if (r.image) { form.dataset.image = r.image; form.dataset.imageFor = v; } else { delete form.dataset.image; }
      let filled = [];
      if (r.title && (force || !title.value.trim())) { title.value = r.title; filled.push("name"); }
      if (r.price != null && (force || !price.value.trim())) { price.value = String(r.price); filled.push("price"); }
      if (filled.includes("price")) { const d = form.querySelector("details.more"); if (d) d.open = true; }
      if (r.image) filled.push("photo");
      const list = filled.length > 1 ? `${filled.slice(0, -1).join(", ")} and ${filled.at(-1)}` : filled[0];
      say(filled.length ? `Filled in the ${list} from ${r.site}. Check it looks right.`
        : r.title || r.price != null ? "Already filled in. Tap Fill to replace with the link's details."
        : `Couldn't read details from ${r.site}. Type them in instead.`, filled.length > 0, r.image);
    } catch (e) { say(e.message); }
    finally { busy = false; btn.disabled = false; }
  }
  btn.addEventListener("click", () => fill(true));
  // Read the raw clipboard: a type=url box drops line breaks, which would glue the words onto the link.
  url.addEventListener("paste", (e) => {
    const raw = e.clipboardData?.getData("text");
    if (raw && splitShared(raw).url !== raw.trim()) { e.preventDefault(); hint = ""; tidy(raw); }
    else hint = "";
    setTimeout(() => fill(false), 0);
  });
  url.addEventListener("blur", () => tidy(url.value));
}

function budgetMini(p) {
  if (!p || p.budget_cents == null) return "";
  const over = p.spent_cents > p.budget_cents;
  const pct = p.budget_cents ? Math.min(100, Math.round((p.spent_cents / p.budget_cents) * 100)) : 100;
  return `<span class="mini${over ? " over" : ""}"><span class="bar"><i style="width:${over ? 100 : pct}%"></i></span>
    <span>${over ? `${money(p.spent_cents - p.budget_cents)} over` : `${money(p.spent_cents)} of ${money(p.budget_cents)}`}</span></span>`;
}

async function shareInvite(g, nudgeName) {
  const link = `${location.origin}/?code=${encodeURIComponent(g.code)}`;
  const text = nudgeName
    ? `Hi ${nudgeName}! Add a few things to your Wishlist so we know what to get you. Family code: ${g.code}`
    : `Join our family Wishlist (${g.name}). Code: ${g.code}`;
  try {
    if (navigator.share) return await navigator.share({ title: "Wishlist", text, url: link });
    await navigator.clipboard.writeText(`${text}\n${link}`);
    toast(nudgeName ? "Reminder copied" : "Invite copied");
  } catch (e) {
    if (e?.name !== "AbortError") toast(`Code: ${g.code}`);
  }
}

// ---------- someone else's list ----------
// Filters and sort for someone's list. Reset when you open a different person.
const PRICE_BUCKETS = [["u25", "Under $25", 0, 2500], ["25-50", "$25 to $50", 2500, 5000], ["50-100", "$50 to $100", 5000, 10000], ["100", "$100+", 10000, Infinity]];
const SORTS = [["top", "Top picks first"], ["low", "Lowest price"], ["high", "Highest price"], ["new", "Newest"]];
const freshView = () => ({ cat: "all", price: "all", sort: "top", open: false });
const inBucket = (c, k) => { const b = PRICE_BUCKETS.find((x) => x[0] === k); return c != null && c >= b[2] && c < b[3]; };

async function renderPerson(id) {
  const [list, t] = await Promise.all([load(`list?member=${encodeURIComponent(id)}`), loadTracker()]);
  state.tracker = t;
  notePhotos([list.member]);
  state.view ||= freshView();
  const view = state.view;
  const name = list.member.name;
  const plan = t?.people.find((p) => p.id === id);
  const sugg = list.suggestions || [];
  const mine = list.myIdeas || [];
  const all = list.items;

  // Summary numbers.
  const open = all.filter((i) => !i.claim && !i.removed);
  const gettingN = all.filter((i) => i.claim?.mine).length;
  const prices = all.map((i) => i.price_cents).filter((c) => c != null);
  const topN = all.filter((i) => i.priority === "must" && !i.removed).length;

  // Filter options: only categories and price ranges that are actually on the list.
  const catCount = {};
  for (const i of all) { const k = catOf(i); catCount[k] = (catCount[k] || 0) + 1; }
  const cats = CATS.filter(([k]) => catCount[k]);
  const buckets = PRICE_BUCKETS.filter(([k]) => all.some((i) => inBucket(i.price_cents, k)));
  if (view.cat !== "all" && !catCount[view.cat]) view.cat = "all";
  if (view.price !== "all" && !buckets.some(([k]) => k === view.price)) view.price = "all";

  const rank = (i) => (!i.claim ? 0 : i.claim.mine ? 1 : 2);
  const byPrice = (dir) => (a, b) => (a.price_cents == null) - (b.price_cents == null) || dir * ((a.price_cents ?? 0) - (b.price_cents ?? 0));
  const sorter = {
    top: (a, b) => rank(a) - rank(b) || (b.priority === "must") - (a.priority === "must"),
    low: byPrice(1),
    high: byPrice(-1),
    new: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
  }[view.sort] || (() => 0);
  const items = all
    .filter((i) => view.cat === "all" || catOf(i) === view.cat)
    .filter((i) => view.price === "all" || inBucket(i.price_cents, view.price))
    .filter((i) => !view.open || (!i.claim && !i.removed))
    .slice().sort(sorter);
  const filtering = view.cat !== "all" || view.price !== "all" || view.open;

  let meter = "";
  if (plan?.budget_cents != null) {
    const over = plan.spent_cents > plan.budget_cents;
    const pct = plan.budget_cents ? Math.min(100, Math.round((plan.spent_cents / plan.budget_cents) * 100)) : 100;
    meter = `<div class="hero-meter"><span class="bar"><i style="width:${over ? 100 : pct}%"></i></span>
      <span><b>${money(plan.spent_cents)}</b> of ${money(plan.budget_cents)} for ${esc(name)}</span></div>`;
  }
  setHero(`<button class="back" type="button" id="backBtn">${BACK} Family</button>
    <div class="hero-row">${avatar(name, id, true)}
      <div class="who-name"><h1>${esc(name)}'s list</h1>${list.member.fullName && list.member.fullName !== name ? `<span class="realname">${esc(list.member.fullName)}</span>` : ""}</div>
      <button class="hero-edit" type="button" id="editBtn" aria-label="Edit nickname and budget for ${esc(name)}">${PENCIL}<span>Edit</span></button></div>${meter}`);

  const chip = (group, k, label, count, icon = "") =>
    `<button class="chip" type="button" data-${group}="${k}" aria-pressed="${view[group] === k}">${icon}${esc(label)}${count != null ? `<span class="chip-n">${count}</span>` : ""}</button>`;
  const toolbar = all.length < 2 ? "" : `
    <div class="toolbar">
      ${cats.length > 1 ? `<div class="chips" role="group" aria-label="Filter by category">
        ${chip("cat", "all", "All", all.length)}${cats.map(([k, label]) => chip("cat", k, label, catCount[k], catIcon(k))).join("")}</div>` : ""}
      ${buckets.length > 1 || (buckets.length && prices.length < all.length) ? `<div class="chips" role="group" aria-label="Filter by price">
        ${chip("price", "all", "Any price")}${buckets.map(([k, label]) => chip("price", k, label)).join("")}</div>` : ""}
      <div class="toolbar-row">
        <label class="toggle"><input type="checkbox" id="openOnly" ${view.open ? "checked" : ""}><span>Still available only</span></label>
        <span class="spacer"></span>
        <label class="sort"><span class="vh">Sort by</span>
          <select id="sortSel">${SORTS.map(([k, l]) => `<option value="${k}"${view.sort === k ? " selected" : ""}>${l}</option>`).join("")}</select>${CHEV_D}</label>
      </div>
      ${filtering ? `<p class="showing">Showing ${items.length} of ${plural(all.length, "wish", "wishes")} <button class="linkbtn" type="button" id="clearFilters">Clear filters</button></p>` : ""}
    </div>`;

  const v = $("#view");
  v.innerHTML = `
    ${all.length ? `<div class="stats">
      <div class="stat"><b>${all.length}</b><span>${all.length === 1 ? "wish" : "wishes"}</span></div>
      <div class="stat"><b>${open.length}</b><span>still available</span></div>
      ${gettingN ? `<div class="stat ok"><b>${gettingN}</b><span>you're getting</span></div>`
        : `<div class="stat${topN ? " gold" : ""}"><b>${topN}</b><span>${topN === 1 ? "top pick" : "top picks"}</span></div>`}
    </div>` : ""}
    ${toolbar}
    ${all.length ? `<div class="stack">${items.length ? items.map((i, n) => personRow(i, "item", n)).join("")
      : `<div class="nomatch"><strong>Nothing matches</strong><p>Try another category or price.</p><button class="btn small" type="button" id="clearFilters2">Show everything</button></div>`}</div>` : `
      <div class="empty">
        ${giftBox(`Add your own idea for ${name}`)}
        <strong>${esc(name)} hasn't added any wishes yet</strong>
        <p>Give ${esc(name)} a little nudge, or jot down your own idea. ${esc(name)} will never see your ideas.</p>
        <div class="stack"><button class="add" type="button" id="nudge">${MSG} Send ${esc(name)} a reminder</button></div>
      </div>`}
    ${sugg.length ? `<div class="label">Ideas from family</div><p class="subtle">Hidden from ${esc(name)}.</p>
      <div class="stack">${sugg.map((i, n) => personRow(i, "idea", n)).join("")}</div>` : ""}
    <div class="label">Your ideas for ${esc(name)}</div>
    <p class="subtle">Just for you, unless you share one with the family.</p>
    <div class="stack">
      ${mine.map(ideaRow).join("")}
      <button class="add soft" type="button" id="addIdea">${PLUS} Add your own idea for ${esc(name)}</button>
    </div>`;
  $("#backBtn").onclick = () => setTab("family");
  $("#editBtn").onclick = () => editPerson(list.member, plan);
  $("#addIdea").onclick = () => editIdea(null, id);
  $("#nudge")?.addEventListener("click", () => shareInvite(group(), name));
  wireGiftBox(v, () => editIdea(null, id));
  const redo = () => render();
  v.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { view.cat = b.dataset.cat; redo(); }));
  v.querySelectorAll("[data-price]").forEach((b) => (b.onclick = () => { view.price = b.dataset.price; redo(); }));
  $("#sortSel")?.addEventListener("change", (e) => { view.sort = e.target.value; redo(); });
  $("#openOnly")?.addEventListener("change", (e) => { view.open = e.target.checked; redo(); });
  for (const b of v.querySelectorAll("#clearFilters, #clearFilters2")) b.onclick = () => { Object.assign(view, freshView(), { sort: view.sort }); redo(); };
  // Keep the chosen chip in view when the row scrolls sideways.
  v.querySelectorAll('.chip[aria-pressed="true"]').forEach((c) => c.scrollIntoView({ block: "nearest", inline: "nearest" }));
  wireIdeaRows(v, mine);
  const byKind = { item: all, idea: sugg };
  v.querySelectorAll("[data-mark]").forEach((b) => (b.onclick = () => {
    const [kind, itemId] = b.dataset.mark.split(":");
    markPurchased(kind, byKind[kind].find((x) => x.id === itemId), name);
  }));
}

// Edit someone: your own name for them ("Grandma" instead of "Jane Doe") and your budget for them. Both only for you.
function editPerson(member, plan) {
  const real = member.fullName || member.name;
  const hasNick = member.name !== real;
  openSheet(`
    <h3>Edit ${esc(member.name)}</h3>
    <form id="personForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Nickname <em>(optional)</em></span>
        <input class="input" name="nickname" maxlength="40" value="${hasNick ? esc(member.name) : ""}" placeholder="${esc(real)}"></label>
      ${plan ? `<label class="field"><span>Budget for ${state.tracker?.season || "this year"} <em>(optional)</em></span>
        <div class="input money-in"><span>$</span><input name="amount" inputmode="decimal" value="${esc(priceIn(plan.budget_cents))}" placeholder="100" aria-label="Budget amount"></div></label>` : ""}
      <p class="hint">${LOCK} Just for you. Everyone else still sees ${esc(real)}, and nobody sees your budget.</p>
      <button class="btn primary wide" type="submit">Save</button>
    </form>`, (el) => {
      wireForm($("#personForm", el), async ({ nickname, amount }) => {
        const nick = nickname.trim();
        const jobs = [];
        if (nick !== (hasNick ? member.name : "")) jobs.push(api("nickname", { subjectId: member.id, nickname: nick }));
        if (plan && amount !== undefined && amount.trim() !== priceIn(plan.budget_cents)) jobs.push(api("budget", { subjectId: member.id, amount: amount.trim() }));
        await Promise.all(jobs);
        closeSheet();
        if (jobs.length) { toast("Saved"); state.me = null; render(); }
      });
    });
}

function personRow(i, kind, n = 0) {
  const key = `${kind}:${i.id}`;
  const fresh = state.burst === key;
  let foot = "", cls = "";
  const visit = i.url ? `<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">View at ${esc(host(i.url))} ${OUT}</a>` : "";
  if (i.claim?.mine) {
    cls = " mine";
    foot = `<span class="mine-line"><span class="chk${fresh ? " new" : ""}">${CHECK}</span>You're getting this one</span><span class="spacer"></span>
      <button class="btn small quiet" type="button" data-mark="${key}">Edit</button>`;
  } else if (i.claim) {
    cls = " taken";
    foot = `<span class="taken-line">${esc(i.claim.buyerName)} is getting this</span>`;
  } else {
    foot = `${visit}<span class="spacer"></span>
      <button class="btn small primary" type="button" data-mark="${key}">${GIFT_SM} I'll get this</button>`;
  }
  if (i.removed) foot = `<span class="taken-line">Removed by ${esc(personName(state.person))}</span><span class="spacer"></span>` + foot;
  const top = kind === "item" && i.priority === "must" && !i.claim;
  const cat = catOf(i);
  const notes = kind === "idea" ? i.note : i.notes;
  const paid = i.claim?.mine && i.claim.price_cents != null ? i.claim.price_cents : i.price_cents;
  const lookingUp = paid == null && i.url && !i.price_checked;
  const price = paid != null ? `<span class="wish-price">${money(paid)}</span>`
    : `<span class="wish-price none"${lookingUp ? ` data-price-slot="${esc(key)}"` : ""}>No price listed</span>`;
  const meta = [
    `<span class="cat-tag">${catIcon(cat, 14)}${esc(CAT[cat].label)}</span>`,
    kind === "idea" ? `<span>Idea from ${esc(i.author_name)}</span>` : i.created_at ? `<span>${addedOn(i.created_at)}</span>` : "",
    (i.claim || i.removed) && i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))}</a>` : "",
  ].filter(Boolean).join('<span class="dot" aria-hidden="true"></span>');
  const whose = kind === "idea" ? `${esc(i.author_name)}'s note` : `${esc(personName(state.person))}'s note`;
  return `<article class="row wish${cls}${top ? " is-top" : ""} ${fresh ? "" : "slide"}" style="animation-delay:${n * 0.05}s">
    ${top ? `<span class="top-ribbon">${STAR} Top pick</span>` : ""}
    <div class="row-top">${tile(i, kind)}
      <div class="row-main">
        <span class="row-title">${esc(i.title)}</span>
        ${price}
        <div class="wish-meta">${meta}</div>
      </div>
    </div>
    ${notes ? `<div class="wish-note"><span>${whose}</span>${esc(notes)}</div>` : ""}
    <div class="row-foot">${foot}</div>
    ${fresh && !reduceMotion() ? `<span class="burst" aria-hidden="true">${CONFETTI}</span>` : ""}
  </article>`;
}

// "I'll get this" (or edit what you paid / take it back) for a list item or a shared idea.
function markPurchased(kind, x, name) {
  const path = kind === "item" ? "claim" : "idea/claim";
  const key = kind === "item" ? "itemId" : "ideaId";
  const editing = !!x.claim?.mine;
  const paid = editing ? x.claim.price_cents ?? x.price_cents : x.price_cents;
  const who = name || "them";
  openSheet(`
    <h3>${editing ? "Your gift" : "Getting this one?"}</h3>
    <p class="what">${esc(x.title)}</p>
    <form id="markForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Price you paid <em>(optional)</em></span>
        <div class="input money-in"><span>$</span><input name="price" inputmode="decimal" value="${esc(priceIn(paid))}" placeholder="0" aria-label="Price you paid"></div></label>
      <p class="hint">This goes toward your budget for ${esc(who)}.</p>
      ${editing ? `<div class="actions"><button class="btn danger" type="button" id="unmark">Not getting it</button><button class="btn primary" type="submit">Save</button></div>`
        : `<button class="btn primary wide" type="submit">Yes, I'm getting it</button><button class="btn quiet wide" type="button" id="cancelMark" style="margin-top:6px">Cancel</button>`}
    </form>`, (el) => {
      $("#cancelMark", el)?.addEventListener("click", closeSheet);
      wireForm($("#markForm", el), async ({ price }) => {
        await api(path, { [key]: x.id, on: true, price });
        closeSheet();
        if (editing) { toast("Saved"); return render(); }
        buzz();
        const amount = price && parseFloat(price) > 0 ? money(Math.round(parseFloat(price) * 100)) : "";
        toast(amount ? `Added ${amount} to ${who}'s budget` : "It's yours. Nobody else will get it.",
          () => api(path, { [key]: x.id, on: false }).then(render, (e) => toast(e.message)));
        state.burst = `${kind}:${x.id}`;
        render();
      });
      $("#unmark", el)?.addEventListener("click", async () => {

// ---------- budget: per person budgets, spending, ideas (private) ----------
async function renderTracker() {
  const t = await load("tracker");
  notePhotos(t.people);
  state.tracker = t;
  const totalBudget = t.people.reduce((n, p) => n + (p.budget_cents || 0), 0);
  const totalSpent = t.people.reduce((n, p) => n + p.spent_cents, 0);
  const left = totalBudget - totalSpent;
  const hasBudget = totalBudget > 0;
  const shown = hasBudget ? Math.abs(left) : totalSpent;
  const pct = hasBudget ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;
  setHero(`
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><h1>Budget</h1><span class="lockline">${LOCK} just for you</span></div>
    <div class="hero-stat">
      <p class="kicker">${hasBudget ? (left < 0 ? "Over budget by" : "Left to spend") : `Spent so far in ${esc(t.season)}`}</p>
      <span class="big-num" id="bigNum">${money(shown)}</span>
      <p class="hero-sub">${hasBudget ? `of ${money(totalBudget)}, ${money(totalSpent)} spent so far` : "Set a budget for anyone below to see what's left."}</p>
      ${hasBudget ? `<div class="hero-meter" style="margin-top:12px"><span class="bar"><i style="width:${pct}%"></i></span></div>` : ""}
    </div>`);
  const from = state.lastLeft ?? (hasBudget ? totalBudget : 0);
  countUp($("#bigNum"), from, shown);
  state.lastLeft = shown;

  const v = $("#view");
  v.innerHTML = t.people.length ? `
    <div class="label" style="margin-top:0">By person</div>
    <div class="stack" style="margin-top:12px">${t.people.map(personCard).join("")}</div>
    <div class="stack" style="margin-top:18px">
      <button class="add" type="button" id="addPurchase">${PLUS} Add a purchase</button>
      <button class="btn wide" type="button" id="addIdea">${PLUS} Gift idea</button>
      <button class="btn quiet wide" type="button" id="exportBtn">${DOWN} Download as Excel</button>
    </div>` : `<div class="empty">${giftBox("Invite your family")}<strong>No one to plan for yet</strong><p>Once family members join, you can set budgets and track gifts for each of them here.</p></div>`;
  $("#addPurchase")?.addEventListener("click", () => editIdea(null, null, { purchase: true }));
  $("#addIdea")?.addEventListener("click", () => editIdea(null, null));
  $("#exportBtn")?.addEventListener("click", () => exportExcel(t));
  wireGiftBox(v, () => setTab("family"));
  v.querySelectorAll(".pcard").forEach((c) => wireTrackerCard(c, t));
}

function wireTrackerCard(card, t) {
  if (!card) return;
  card.querySelector("[data-toggle]").onclick = () => {
    const id = card.dataset.person;
    if (state.openPeople.has(id)) state.openPeople.delete(id); else state.openPeople.add(id);
    const p = t.people.find((x) => x.id === id);
    card.outerHTML = personCard(p, 0, true);
    wireTrackerCard($(`.pcard[data-person="${CSS.escape(id)}"]`), t);
  };
  card.querySelector("[data-budget]")?.addEventListener("click", () => editBudget(t.people.find((p) => p.id === card.dataset.person)));
  card.querySelector("[data-for]")?.addEventListener("click", () => editIdea(null, card.dataset.person));
  card.querySelector("[data-open]")?.addEventListener("click", () => setTab("family", card.dataset.person));
  wireIdeaRows(card, t.people.flatMap((p) => p.ideas));
}

function personCard(p, n = 0, still = false) {
  const budget = p.budget_cents;
  const isOpen = state.openPeople.has(p.id);
  const over = budget != null && p.spent_cents > budget;
  const pct = budget ? Math.min(100, Math.round((p.spent_cents / budget) * 100)) : 100;
  const pill = budget == null ? '<span class="pill none">No budget</span>'
    : over ? `<span class="pill over">${money(p.spent_cents - budget)} over</span>` : `<span class="pill">${money(budget - p.spent_cents)} left</span>`;
  return `<div class="pcard${isOpen ? " is-open" : ""}${still ? "" : " slide"}" style="animation-delay:${n * 0.06}s" data-person="${esc(p.id)}">
    <button class="pcard-head" type="button" data-toggle="${esc(p.id)}" aria-expanded="${isOpen}">
      <span class="pcard-top">${avatar(p.name, p.id)}
        <span class="pcard-who"><strong>${esc(p.name)}</strong><small>${money(p.spent_cents)}${budget != null ? ` of ${money(budget)}` : " spent"}</small></span>
        ${pill}${CHEV_D}</span>
      ${budget != null ? `<span class="meter${over ? " over" : ""}"><i style="width:${over ? 100 : pct}%${still ? ";animation:none" : ""}"></i></span>` : ""}
    </button>
    ${isOpen ? `<div class="pcard-body">
      ${p.purchases.length ? `<ul class="buys">${p.purchases.map((x) => `<li><span>${esc(x.title)}<small>${esc(x.from)}</small></span><b>${money(x.spent_cents)}</b></li>`).join("")}</ul>`
        : '<p class="subtle">Nothing bought yet.</p>'}
      ${p.ideas.length ? `<div class="stack">${p.ideas.map(ideaRow).join("")}</div>` : ""}
      <div class="pcard-actions">
        <button class="btn small" type="button" data-budget="${esc(p.id)}">${budget != null ? "Change budget" : "Set a budget"}</button>
        <button class="btn small" type="button" data-for="${esc(p.id)}">${PLUS} Gift idea</button>
        <button class="btn small quiet" type="button" data-open="${esc(p.id)}">${esc(p.name)}'s list</button>
      </div>
    </div>` : ""}
  </div>`;
}
