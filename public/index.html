const inviteLink = (g) => `${location.origin}/join/${encodeURIComponent(g.code)}?from=${encodeURIComponent(state.me.id)}`;
const inviteText = (g) => `${state.me.name} invited you to ${g.name} on Hints 🎁 Add what you'd love this year, see what everyone's hoping for, and keep gifts a surprise.`;
const COPY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>';
const QR_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';

// A ticket with the code, the link, Copy / Send, and a QR code to show someone in person.
function inviteCard(g) {
  const link = inviteLink(g);
  const canSend = !!navigator.share;
  return `<div class="ticket" data-ticket>
    <div class="ticket-top">${DOODLE}<p>${esc(g.name)}</p>
      <div class="code-big" role="img" aria-label="Invite code ${esc([...g.code].join(" "))}">${[...g.code].map((c, i) => `<span style="animation-delay:${0.1 + i * 0.07}s">${esc(c)}</span>`).join("")}</div>
      <small>${esc(link.replace(/^https?:\/\//, "").replace(/\?.*$/, ""))}</small></div>
    <div class="ticket-mid"></div>
    <div class="ticket-body">
      <div class="ticket-actions">
        <button class="btn${canSend ? "" : " primary"}" type="button" data-copy>${COPY} Copy invite</button>
        ${canSend ? `<button class="btn primary" type="button" data-send>${SEND} Send</button>` : ""}
      </div>
      <div class="qr" hidden></div>
      <button class="btn quiet qr-btn" type="button" data-qr>${QR_ICON} Show QR code</button>
    </div></div>`;
}

let qrLoading;
function loadQr() {
  return (qrLoading ||= new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "/qr.js";
    sc.onload = ok;
    sc.onerror = () => { qrLoading = null; no(new Error("Couldn't load the QR code. Check your connection.")); };
    document.head.appendChild(sc);
  }));
}

function wireInviteCard(root, g) {
  const card = $("[data-ticket]", root);
  if (!card) return;
  const link = inviteLink(g);
  const copyBtn = $("[data-copy]", card);
  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(`${inviteText(g)}\n\nJoin here: ${link}\nInvite code: ${g.code}`);
    } catch { return toast(`Invite code: ${g.code}`); }
    buzz();
    copyBtn.innerHTML = `${CHECK} Copied!`;
    copyBtn.classList.add("copied");
    card.classList.remove("wiggle"); void card.offsetWidth; card.classList.add("wiggle");
    const r = copyBtn.getBoundingClientRect();
    party(r.left + r.width / 2, r.top, 14);
    clearTimeout(copyBtn._t);
    copyBtn._t = setTimeout(() => { copyBtn.innerHTML = `${COPY} Copy invite`; copyBtn.classList.remove("copied"); }, 2400);
  };
  $("[data-send]", card)?.addEventListener("click", async () => {
    try { await navigator.share({ title: `Join ${g.name} on Hints`, text: inviteText(g), url: link }); }
    catch (e) { if (e?.name !== "AbortError") copyBtn.click(); }
  });
  const qrBtn = $("[data-qr]", card), qrBox = $(".qr", card);
  qrBtn.onclick = async () => {
    if (!qrBox.hidden) { qrBox.hidden = true; qrBtn.innerHTML = `${QR_ICON} Show QR code`; return; }
    try { await loadQr(); } catch (e) { return toast(e.message); }
    qrBox.innerHTML = window.qrSvg(link, { dark: "#4A0E22", light: "#FFFFFF", label: `QR code to join ${g.name}` }) + "<small>Point a phone camera here to join</small>";
    qrBox.hidden = false;
    qrBtn.innerHTML = `${QR_ICON} Hide QR code`;
  };
}

function openInvite(g) {
  openSheet(`<h3>Invite to ${esc(g.name)}</h3>${inviteCard(g)}`, (el) => wireInviteCard(el, g));
}

// "Remind them" on someone's empty list.
async function shareInvite(g, nudgeName) {
  const link = inviteLink(g);
  const text = `Hi ${nudgeName}! Add a few things to your list on Hints so we know what to get you 🎁`;
  try {
    if (navigator.share) return await navigator.share({ title: "Hints", text, url: link });
    await navigator.clipboard.writeText(`${text}\n${link}`);
    toast("Reminder copied");
  } catch (e) {
    if (e?.name !== "AbortError") toast(`Code: ${g.code}`);
  }
}

// ---------- someone else's list ----------
// Filters and sort for someone's list. Reset when you open a different person.
const PRICE_BUCKETS = [["u25", "Under $25", 0, 2500], ["25-50", "$25 to $50", 2500, 5000], ["50-100", "$50 to $100", 5000, 10000], ["100", "$100+", 10000, Infinity]];
const SORTS = [["top", "Top picks first"], ["low", "Lowest price"], ["high", "Highest price"], ["new", "Newest"]];
const freshView = () => ({ cat: "all", price: "all", sort: "top", open: false });
const inBucket = (c, k) => { const b = PRICE_BUCKETS.find((x) => x[0] === k); return c != null && c >= b[2] && c < b[3]; };

async function renderPerson(id) {
  const [list, t] = await Promise.all([load(`list?member=${encodeURIComponent(id)}`), loadTracker()]);
  state.tracker = t;
  notePhotos([list.member]);
  state.view ||= freshView();
  const view = state.view;
  const name = list.member.name;
  const plan = t?.people.find((p) => p.id === id);
  const sugg = list.suggestions || [];
  const mine = list.myIdeas || [];
  const all = list.items;

  // Summary numbers.
  const open = all.filter((i) => !i.claim && !i.removed);
  const gettingN = all.filter((i) => i.claim?.mine).length;
  const prices = all.map((i) => i.price_cents).filter((c) => c != null);
  const topN = all.filter((i) => i.priority === "must" && !i.removed).length;
  markSeen(id, all.filter((i) => !i.removed).length);

  // Filter options: only categories and price ranges that are actually on the list.
  const catCount = {};
  for (const i of all) { const k = catOf(i); catCount[k] = (catCount[k] || 0) + 1; }
  const cats = CATS.filter(([k]) => catCount[k]);
  const buckets = PRICE_BUCKETS.filter(([k]) => all.some((i) => inBucket(i.price_cents, k)));
  if (view.cat !== "all" && !catCount[view.cat]) view.cat = "all";
  if (view.price !== "all" && !buckets.some(([k]) => k === view.price)) view.price = "all";

  const rank = (i) => (!i.claim ? 0 : i.claim.mine ? 1 : 2);
  const byPrice = (dir) => (a, b) => (a.price_cents == null) - (b.price_cents == null) || dir * ((a.price_cents ?? 0) - (b.price_cents ?? 0));
  const sorter = {
    top: (a, b) => rank(a) - rank(b) || (b.priority === "must") - (a.priority === "must"),
    low: byPrice(1),
    high: byPrice(-1),
    new: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
  }[view.sort] || (() => 0);
  const items = all
    .filter((i) => view.cat === "all" || catOf(i) === view.cat)
    .filter((i) => view.price === "all" || inBucket(i.price_cents, view.price))
    .filter((i) => !view.open || (!i.claim && !i.removed))
    .slice().sort(sorter);
  const filtering = view.cat !== "all" || view.price !== "all" || view.open;

  // Budget for their next occasion (Christmas or their birthday, whichever comes first).
  let meter = "";
  const next = plan?.occasions[0];
  if (next?.budget_cents != null) {
    const forWhat = next.christmas && !next.birthday ? `${esc(name)} this Christmas` : `${esc(name)}'s ${occName(next)}`;
    const over = next.spent_cents > next.budget_cents;
    const pct = next.budget_cents ? Math.min(100, Math.round((next.spent_cents / next.budget_cents) * 100)) : 100;
    meter = `<div class="hero-meter"><span class="bar"><i style="width:${over ? 100 : pct}%"></i></span>
      <span><b>${money(next.spent_cents)}</b> of ${money(next.budget_cents)} for ${forWhat}</span></div>`;
  }
  setHero(`<button class="back" type="button" id="backBtn">${BACK} Circles</button>
    <div class="hero-row">${avatar(name, id, true)}
      <div class="who-name"><h1>${esc(name)}'s list</h1>${list.member.fullName && list.member.fullName !== name ? `<span class="realname">${esc(list.member.fullName)}</span>` : ""}</div>
      <button class="hero-edit" type="button" id="editBtn" aria-label="Edit nickname and budget for ${esc(name)}">${PENCIL}<span>Edit</span></button></div>${meter}`);

  const chip = (group, k, label, count, icon = "") =>
    `<button class="chip" type="button" data-${group}="${k}" aria-pressed="${view[group] === k}">${icon}${esc(label)}${count != null ? `<span class="chip-n">${count}</span>` : ""}</button>`;
  const toolbar = all.length < 2 ? "" : `
    <div class="toolbar">
      ${cats.length > 1 ? `<div class="chips" role="group" aria-label="Filter by category">
        ${chip("cat", "all", "All", all.length)}${cats.map(([k, label]) => chip("cat", k, label, catCount[k], catIcon(k))).join("")}</div>` : ""}
      ${buckets.length > 1 || (buckets.length && prices.length < all.length) ? `<div class="chips" role="group" aria-label="Filter by price">
        ${chip("price", "all", "Any price")}${buckets.map(([k, label]) => chip("price", k, label)).join("")}</div>` : ""}
      <div class="toolbar-row">
        <label class="toggle"><input type="checkbox" id="openOnly" ${view.open ? "checked" : ""}><span>Still available only</span></label>
        <span class="spacer"></span>
        <label class="sort"><span class="vh">Sort by</span>
          <select id="sortSel">${SORTS.map(([k, l]) => `<option value="${k}"${view.sort === k ? " selected" : ""}>${l}</option>`).join("")}</select>${CHEV_D}</label>
      </div>
      ${filtering ? `<p class="showing">Showing ${items.length} of ${plural(all.length, "wish", "wishes")} <button class="linkbtn" type="button" id="clearFilters">Clear filters</button></p>` : ""}
    </div>`;

  const v = $("#view");
  v.innerHTML = `<div class="person-layout"><div class="person-side">
    ${hintsCard(list.member.profile)}
    ${knowCard(list.member.profile)}
    ${all.length ? `<div class="stats">
      <div class="stat"><b>${all.length}</b><span>${all.length === 1 ? "wish" : "wishes"}</span></div>
      <div class="stat"><b>${open.length}</b><span>still available</span></div>
      ${gettingN ? `<div class="stat ok"><b>${gettingN}</b><span>you're getting</span></div>`
        : `<div class="stat${topN ? " gold" : ""}"><b>${topN}</b><span>${topN === 1 ? "top pick" : "top picks"}</span></div>`}
    </div>` : ""}
    ${toolbar}</div><div class="person-main">
    ${all.length ? `<div class="stack">${items.length ? items.map((i, n) => personRow(i, "item", n)).join("")
      : `<div class="nomatch"><strong>Nothing matches</strong><p>Try another category or price.</p><button class="btn small" type="button" id="clearFilters2">Show everything</button></div>`}</div>` : `
      <div class="empty">
        ${giftBox(`Add your own idea for ${name}`)}
        <strong>${esc(name)} hasn't added any wishes yet</strong>
        <p>Give ${esc(name)} a little nudge, or jot down your own idea. ${esc(name)} will never see your ideas.</p>
        <div class="stack"><button class="add" type="button" id="nudge">${MSG} Send ${esc(name)} a reminder</button></div>
      </div>`}
    ${theirGiftCards(list.giftCards, name, id)}
    ${sugg.length ? `<div class="label">Ideas from others${tip(`Hidden from ${name}.`)}</div>
      <div class="stack">${sugg.map((i, n) => personRow(i, "idea", n)).join("")}</div>` : ""}
    <div class="label">Your ideas for ${esc(name)}${tip("Only you see these, unless you share one.")}</div>
    <div class="stack">
      ${mine.map(ideaRow).join("")}
      <button class="add soft" type="button" id="addIdea">${PLUS} Add your own idea for ${esc(name)}</button>
    </div></div></div>`;
  $("#backBtn").onclick = () => setTab("family");
  $("#editBtn").onclick = () => editPerson(list.member, plan);
  $("#addIdea").onclick = () => addThing(id);
  $("#nudge")?.addEventListener("click", () => shareInvite(group(), name));
  wireGiftBox(v, () => addThing(id));
  const redo = () => render();
  v.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { view.cat = b.dataset.cat; redo(); }));
  v.querySelectorAll("[data-price]").forEach((b) => (b.onclick = () => { view.price = b.dataset.price; redo(); }));
  $("#sortSel")?.addEventListener("change", (e) => { view.sort = e.target.value; redo(); });
  $("#openOnly")?.addEventListener("change", (e) => { view.open = e.target.checked; redo(); });
  for (const b of v.querySelectorAll("#clearFilters, #clearFilters2")) b.onclick = () => { Object.assign(view, freshView(), { sort: view.sort }); redo(); };
  // Keep the chosen chip in view when the row scrolls sideways.
  v.querySelectorAll('.chip[aria-pressed="true"]').forEach((c) => c.scrollIntoView({ block: "nearest", inline: "nearest" }));
  wireIdeaRows(v, mine);
  v.querySelectorAll("[data-give]").forEach((b) => (b.onclick = () => giveGiftCard(list.giftCards.find((c) => c.brand === b.dataset.give), list.member, name, id)));
  const byKind = { item: all, idea: sugg };
  v.querySelectorAll("[data-mark]").forEach((b) => (b.onclick = () => {
    const [kind, itemId] = b.dataset.mark.split(":");
    markPurchased(kind, byKind[kind].find((x) => x.id === itemId), name, id);
  }));
}

// Edit someone: your own name for them ("Grandma" instead of "Jane Doe") and your budget for them. Both only for you.
function editPerson(member, plan) {
  const real = member.fullName || member.name;
  const next = plan?.occasions[0];
  const forWhat = !next ? "" : next.christmas && !next.birthday ? `Christmas ${occParts(next)[0]}` : `${member.name}'s ${occName(next)} (${occDay(next)})`;
  const hasNick = member.name !== real;
  openSheet(`
    <h3>Edit ${esc(member.name)}${lockTip("Only you see these.")}</h3>
    <form id="personForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Nickname</span>
        <input class="input" name="nickname" maxlength="40" value="${hasNick ? esc(member.name) : ""}" placeholder="${esc(real)}"></label>
      ${next ? `<label class="field"><span>Budget for ${esc(forWhat)}</span>
        <div class="input money-in"><span>$</span><input name="amount" inputmode="decimal" value="${esc(priceIn(next.budget_cents))}" placeholder="100" aria-label="Budget amount"></div></label>` : ""}
      <button class="btn primary wide" type="submit">Save</button>
    </form>`, (el) => {
      wireForm($("#personForm", el), async ({ nickname, amount }) => {
        const nick = nickname.trim();
        const jobs = [];
        if (nick !== (hasNick ? member.name : "")) jobs.push(api("nickname", { subjectId: member.id, nickname: nick }));
        if (next && amount !== undefined && amount.trim() !== priceIn(next.budget_cents)) jobs.push(api("budget", { subjectId: member.id, amount: amount.trim(), occasion: next.code }));
        await Promise.all(jobs);
        closeSheet();
        if (jobs.length) { toast("Saved"); state.stale = true; render(); }
      });
    });
}

function personRow(i, kind, n = 0) {
  const key = `${kind}:${i.id}`;
  const fresh = state.burst === key;
  let foot = "", cls = "";
  const visit = i.url ? `<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">View at ${esc(host(i.url))} ${OUT}</a>` : "";
  if (i.claim?.mine) {
    cls = " mine";
    foot = `<span class="mine-line"><span class="chk${fresh ? " new" : ""}">${CHECK}</span>You're getting this${occTag(state.person, i.claim.occasion) || " one"}</span><span class="spacer"></span>
      <button class="btn small quiet" type="button" data-mark="${key}">Edit</button>`;
  } else if (i.claim) {
    cls = " taken";
    foot = `<span class="taken-line">${esc(i.claim.buyerName)} is getting this${occTag(state.person, i.claim.occasion)}</span>`;
  } else {
    foot = `${visit}<span class="spacer"></span>
      <button class="btn small primary" type="button" data-mark="${key}">${GIFT_SM} I'll get this</button>`;
  }
  if (i.removed) foot = `<span class="taken-line">Removed by ${esc(personName(state.person))}</span><span class="spacer"></span>` + foot;
  const top = kind === "item" && i.priority === "must" && !i.claim;
  const notes = kind === "idea" ? i.note : i.notes;
  const paid = i.claim?.mine && i.claim.price_cents != null ? i.claim.price_cents : i.price_cents;
  const lookingUp = paid == null && i.url && !i.price_checked;
  const price = paid != null ? `<span class="wish-price">${money(paid)}</span>`
    : `<span class="wish-price none"${lookingUp ? ` data-price-slot="${esc(key)}"` : ""}>No price listed</span>`;
  const meta = [
    kind === "idea" ? `<span>Idea from ${esc(i.author_name)}</span>` : i.created_at ? `<span>${addedOn(i.created_at)}</span>` : "",
    (i.claim || i.removed) && i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))}</a>` : "",
  ].filter(Boolean).join('<span class="dot" aria-hidden="true"></span>');
  const whose = kind === "idea" ? `${esc(i.author_name)}'s note` : `${esc(personName(state.person))}'s note`;
  return `<article class="row wish${cls}${top ? " is-top" : ""} ${fresh ? "" : "slide"}" style="animation-delay:${n * 0.05}s">
    ${top ? `<span class="top-ribbon">${STAR} Top pick</span>` : ""}
    <div class="row-top">${tile(i, kind)}
      <div class="row-main">
        ${nameBlock(i)}
        ${detailChips(i)}
        ${price}
        ${i.url && !i.claim && !i.removed ? `<span class="live" data-live="${esc(key)}" data-listed="${i.price_cents ?? ""}" hidden></span>` : ""}
        <div class="wish-meta">${meta}</div>
      </div>
    </div>
    ${notes ? `<div class="wish-note"><span>${whose}</span>${esc(notes)}</div>` : ""}
    <div class="row-foot">${foot}</div>
    ${fresh && !reduceMotion() ? `<span class="burst" aria-hidden="true">${CONFETTI}</span>` : ""}
  </article>`;
}

// "I'll get this" (or edit what you paid / take it back) for a list item or a shared idea.
function markPurchased(kind, x, name, personId) {
  const path = kind === "item" ? "claim" : "idea/claim";
  const occ = occasionsOf(personId);
  const key = kind === "item" ? "itemId" : "ideaId";
  const editing = !!x.claim?.mine;
  const paid = editing ? x.claim.price_cents ?? x.price_cents : x.price_cents;
  const who = name || "them";
  openSheet(`
    <h3>${editing ? "Your gift" : "Getting this one?"}</h3>
    <p class="what">${esc(x.title)}</p>
    <form id="markForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>${editing ? "Price you paid" : "Price"}</span>
        <div class="input money-in"><span>$</span><input name="price" inputmode="decimal" value="${esc(priceIn(paid))}" placeholder="0" aria-label="Price"></div></label>
      ${occPicker(personId, x.claim?.occasion)}
      ${editing ? "" : `<p class="hint">Not bought yet? Mark it anyway so nobody doubles up.</p>`}
      ${editing ? `<div class="actions"><button class="btn danger" type="button" id="unmark">Not getting it</button><button class="btn primary" type="submit">Save</button></div>`
        : `<button class="btn primary wide" type="submit">Yes, I'm getting it</button><button class="btn quiet wide" type="button" id="cancelMark" style="margin-top:6px">Cancel</button>`}
    </form>`, (el) => {
      $("#cancelMark", el)?.addEventListener("click", closeSheet);
      const occasion = wireOccPicker(el);
      wireForm($("#markForm", el), async ({ price }) => {
        await api(path, { [key]: x.id, on: true, price, occasion: occasion() });
        closeSheet();
        if (editing) { toast("Saved"); return render(); }
        buzz();
        const amount = price && parseFloat(price) > 0 ? money(Math.round(parseFloat(price) * 100)) : "";
        toast(amount ? `Added ${amount} to ${who}'s budget` : "It's yours. Nobody else will get it.",
          () => api(path, { [key]: x.id, on: false }).then(render, (e) => toast(e.message)));
        state.burst = `${kind}:${x.id}`;
        render();
      });
      $("#unmark", el)?.addEventListener("click", async () => {
        try { await api(path, { [key]: x.id, on: false }); closeSheet(); toast("Taken back"); render(); }
        catch (e) { toast(e.message); }
      });
    });
}

// ---------- budget: per person budgets, purchases, ideas (private) ----------
// Three tabs: People (budgets, Christmas or Birthdays), Purchases (every gift you've bought for an
// upcoming occasion and how it's coming along), and Ideas (your open ideas, by person).
const BUDGET_VIEW_KEY = "wishlist-budget-view";
const BUDGET_TAB_KEY = "wishlist-budget-tab";
function budgetView() { try { return localStorage.getItem(BUDGET_VIEW_KEY) === "birthday" ? "birthday" : "christmas"; } catch { return "christmas"; } }
function setBudgetView(v) { try { v === "birthday" ? localStorage.setItem(BUDGET_VIEW_KEY, v) : localStorage.removeItem(BUDGET_VIEW_KEY); } catch {} }
function budgetTab() { try { const v = localStorage.getItem(BUDGET_TAB_KEY); return v === "gifts" || v === "ideas" ? v : "people"; } catch { return "people"; } }
function setBudgetTab(v) { try { v === "people" ? localStorage.removeItem(BUDGET_TAB_KEY) : localStorage.setItem(BUDGET_TAB_KEY, v); } catch {} }
// The occasion a person's card shows in a view (null: no birthday yet).
const viewOcc = (p, view) => p.occasions.find((o) => (view === "birthday" ? o.birthday : o.christmas)) || null;
const xmasYear = (t) => { const o = t.people[0] && viewOcc(t.people[0], "christmas"); return o ? occParts(o)[0] : ""; };

// How a gift you bought is coming along. null = ordered / on the way. Must match PURCHASE_STAGES in src/wishlist.js.
// [status, name, filter chip label, quick-advance button label (to reach this stage)]
const STAGES = [[null, "Ordered", "On the way", ""], ["home", "Have it", "To wrap", "Got it"], ["wrapped", "Wrapped", "Wrapped", "Wrapped"], ["given", "Given", "Given", "Given"]];
const stageAt = (status) => Math.max(0, STAGES.findIndex((s) => s[0] === (status || null)));
const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
// Every purchase for an upcoming occasion, with who it's for and the occasion, soonest occasion first.
const allBuys = (t) => t.people.flatMap((p) => p.occasions.flatMap((o) => o.purchases.map((x) => ({ x, p, o }))))
  .sort((a, b) => a.o.code - b.o.code || String(a.x.date).localeCompare(String(b.x.date)));
const occLabel = (p, o) => (o.christmas && !o.birthday ? `Christmas ${occParts(o)[0]}` : `${p.name}'s ${occName(o)} · ${occDay(o)}`);
const stagePill = (x) => { const n = stageAt(x.status); return `<span class="stage s${n}">${STAGES[n][1]}</span>`; };

async function renderTracker() {
  const t = await load("tracker");
  notePhotos(t.people);
  state.tracker = t;
  const v = $("#view");
  if (!t.people.length) {
    setHero(budgetTitle());
    v.innerHTML = `<div class="empty">${giftBox("Invite your people")}<strong>No one to plan for yet</strong><p>Budgets and gifts show up once people join.</p></div>`;
    wireGiftBox(v, () => setTab("family"));
    return;
  }
  renderBudgetTab(t);
}

const budgetTitle = () => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h1>Budget</h1>${lockTip("Just for you. Nobody else can see your budgets, ideas, or purchases.", true)}</div>`;

// Draws the tab strip and the chosen tab, from the tracker already loaded (switching tabs doesn't refetch).
function renderBudgetTab(t) {
  const tab = budgetTab();
  const buys = allBuys(t);
  const ideaCount = t.people.reduce((n, p) => n + p.ideas.length, 0);
  const tabs = [["people", "People", ""], ["gifts", "Purchases", buys.length], ["ideas", "Ideas", ideaCount]];
  const v = $("#view");
  v.innerHTML = `<div class="btabs" role="tablist" aria-label="Budget sections">${tabs.map(([k, l, n]) =>
    `<button type="button" role="tab" data-btab="${k}" aria-selected="${k === tab}">${l}${n ? `<span class="chip-n">${n}</span>` : ""}</button>`).join("")}</div>
    <div id="btabBody" role="tabpanel"></div>`;
  v.querySelectorAll("[data-btab]").forEach((b) => (b.onclick = () => {
    if (b.dataset.btab === tab) return;
    setBudgetTab(b.dataset.btab);
    state.lastLeft = null;
    renderBudgetTab(t);
  }));
  const body = $("#btabBody");
  if (tab === "gifts") renderGiftsTab(t, body, buys);
  else if (tab === "ideas") renderIdeasTab(t, body);
  else renderPeopleTab(t, body);
}

function renderPeopleTab(t, v) {
  const view = budgetView();
  const rows = t.people.map((p) => ({ p, o: viewOcc(p, view) }));
  const shownRows = rows.filter((r) => r.o);
  if (view === "birthday") shownRows.sort((a, b) => a.o.code - b.o.code);
  const noBday = rows.filter((r) => !r.o);
  const totalBudget = shownRows.reduce((n, r) => n + (r.o.budget_cents || 0), 0);
  const totalSpent = shownRows.reduce((n, r) => n + r.o.spent_cents, 0);
  const left = totalBudget - totalSpent;
  const hasBudget = totalBudget > 0;
  const shown = hasBudget ? Math.abs(left) : totalSpent;
  const pct = hasBudget ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;
  const what = view === "birthday" ? "upcoming birthdays" : `Christmas ${xmasYear(t)}`;
  // How long until the next occasion in this view, and who doesn't have anything yet.
  const soonest = shownRows.reduce((a, r) => (!a || r.o.code < a.code ? r.o : a), null);
  const daysLeft = soonest ? daysUntil(soonest) : null;
  const countdown = daysLeft == null ? "" : view === "birthday"
    ? `Next birthday ${inDays(soonest)}`
    : daysLeft <= 0 ? "Merry Christmas!" : `${plural(daysLeft, "day", "days")} until Christmas`;
  const needGift = shownRows.filter((r) => !r.o.purchases.length);
  setHero(`${budgetTitle()}
    <div class="hero-stat">
      <p class="kicker">${hasBudget ? (left < 0 ? `Over budget for ${esc(what)} by` : `Left to spend for ${esc(what)}`) : `Spent so far for ${esc(what)}`}</p>
      <span class="big-num" id="bigNum">${money(shown)}</span>
      <p class="hero-sub">${hasBudget ? `of ${money(totalBudget)}, ${money(totalSpent)} spent so far` : "No budget set"}</p>
      ${hasBudget ? `<div class="hero-meter" style="margin-top:12px"><span class="bar"><i style="width:${pct}%"></i></span></div>` : ""}
      ${countdown ? `<p class="hero-sub" style="margin-top:10px;font-weight:700">${esc(countdown)}</p>` : ""}
    </div>`);
  const from = state.lastLeft ?? (hasBudget ? totalBudget : 0);
  countUp($("#bigNum"), from, shown);
  state.lastLeft = shown;

  const segHtml = seg("Which budget", [["christmas", `Christmas ${xmasYear(t)}`], ["birthday", "Birthdays"]], view, "two");
  v.innerHTML = `<div class="budget-layout">
    <div id="viewSeg">${segHtml}</div>
    ${needGift.length && needGift.length < shownRows.length ? `<div class="b-need"><div class="label" style="margin-top:18px">Still need a gift for</div>
      <div class="still-need">${needGift.map((r) => `<button class="chip" type="button" data-need="${esc(r.p.id)}">${avatar(r.p.name, r.p.id, "sm")}${esc(r.p.name)}</button>`).join("")}</div></div>` : ""}
    <div class="b-main">
    ${shownRows.length ? `<div class="label" style="margin-top:18px">${view === "birthday" ? "Coming up" : "By person"}</div>
    <div class="stack" style="margin-top:12px">${shownRows.map((r, n) => personCard(r.p, r.o, view, n)).join("")}</div>`
      : `<div class="empty" style="margin-top:18px"><strong>No birthdays yet</strong><p>They show up once people add them in Profile.</p></div>`}
    ${view === "birthday" && noBday.length ? `<div class="label">No birthday added yet${tip("They can add it in Profile.")}</div>
      <div class="stack">${noBday.map((r) => `<button class="member" type="button" data-open="${esc(r.p.id)}">${avatar(r.p.name, r.p.id)}<span class="who"><strong>${esc(r.p.name)}</strong><small>${esc(r.p.name)}'s list</small></span>${CHEV}</button>`).join("")}</div>` : ""}
    </div>
    <div class="stack b-actions" style="margin-top:18px">
      <button class="add" type="button" id="addPurchase">${PLUS} Add a purchase</button>
      <button class="btn wide" type="button" id="addIdea">${PLUS} Gift idea</button>
      ${shownRows.length ? `<button class="btn quiet wide" type="button" id="exportBtn">${DOWN} Download as Excel</button>` : ""}
    </div></div>`;
  wireSeg($("#viewSeg .seg"), (val) => { setBudgetView(val); state.lastLeft = null; renderPeopleTab(t, v); });
  $("#addPurchase").addEventListener("click", () => editIdea(null, null, { purchase: true, view }));
  $("#addIdea").addEventListener("click", () => addThing(null));
  $("#exportBtn")?.addEventListener("click", () => exportExcel(t, view));
  v.querySelectorAll(".stack > [data-open]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.open)));
  v.querySelectorAll("[data-need]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.need)));
  v.querySelectorAll(".pcard").forEach((c) => wireTrackerCard(c, t, view));
}

// Purchases: everything you've bought for anyone's upcoming occasions, grouped by occasion, with where each
// gift is (on the way, have it, wrapped, given) and where you hid it. Filter chips by stage.
function renderGiftsTab(t, v, buys, still = false) {
  const counts = STAGES.map((s, n) => buys.filter((b) => stageAt(b.x.status) === n).length);
  const ready = counts[2] + counts[3];
  const spent = buys.reduce((n, b) => n + b.x.spent_cents, 0);
  const next = [counts[0] ? `${counts[0]} on the way` : "", counts[1] ? `${counts[1]} to wrap` : ""].filter(Boolean).join(" · ");
  setHero(`${budgetTitle()}
    <div class="hero-stat">
      <p class="kicker">Gifts bought for what's coming up</p>
      <span class="big-num">${buys.length}</span>
      <p class="hero-sub">${buys.length ? `${money(spent)} spent · ${ready} of ${buys.length} wrapped or given` : "Nothing bought yet"}</p>
      ${buys.length ? `<div class="hero-meter" style="margin-top:12px"><span class="bar"><i style="width:${Math.round((ready / buys.length) * 100)}%"></i></span></div>` : ""}
      ${next ? `<p class="hero-sub" style="margin-top:10px;font-weight:700">${esc(next)}</p>` : ""}
    </div>`);
  const f = state.giftFilter ?? "all";
  const filter = f !== "all" && counts[+f] ? +f : null;
  const shown = filter == null ? buys : buys.filter((b) => stageAt(b.x.status) === filter);
  // Group by occasion: one Christmas for everyone, each birthday on its own.
  const groups = [];
  for (const b of shown) {
    const key = b.o.christmas && !b.o.birthday ? `x${b.o.code}` : `${b.o.code}:${b.p.id}`;
    let g = groups.find((x) => x.key === key);
    if (!g) groups.push((g = { key, o: b.o, p: b.p, list: [] }));
    g.list.push(b);
  }
  const ordered = groups.flatMap((g) => g.list);
  let k = 0;
  v.innerHTML = buys.length ? `
    <div class="chips" role="group" aria-label="Filter by how it's going" style="margin-top:4px">
      <button class="chip" type="button" data-gf="all" aria-pressed="${filter == null}">All<span class="chip-n">${buys.length}</span></button>
      ${STAGES.map((s, n) => counts[n] ? `<button class="chip" type="button" data-gf="${n}" aria-pressed="${filter === n}">${s[2]}<span class="chip-n">${counts[n]}</span></button>` : "").join("")}
    </div>
    ${groups.map((g) => `<div class="label occ-label"><span>${esc(occLabel(g.p, g.o))}</span><small>${esc(inDays(g.o))}</small></div>
      <div class="stack">${g.list.map((b) => buyRow(b, k++, still)).join("")}</div>`).join("")}
    <div class="stack" style="margin-top:18px"><button class="add" type="button" id="addPurchase">${PLUS} Add a purchase</button></div>`
    : `<div class="empty" style="margin-top:12px">${giftBox("Find a gift")}<strong>Nothing bought yet</strong>
      <p>When you mark something as purchased, or add a purchase here, it shows up so you can follow it from ordered to wrapped to given.</p></div>
      <div class="stack" style="margin-top:18px"><button class="add" type="button" id="addPurchase">${PLUS} Add a purchase</button></div>`;
  wireGiftBox(v, () => setTab("family"));
  $("#addPurchase").addEventListener("click", () => editIdea(null, null, { purchase: true, view: budgetView() }));
  v.querySelectorAll("[data-gf]").forEach((b) => (b.onclick = () => { state.giftFilter = b.dataset.gf; renderGiftsTab(t, v, buys); }));
  v.querySelectorAll('.chip[aria-pressed="true"]').forEach((c) => c.scrollIntoView({ block: "nearest", inline: "nearest" }));
  v.querySelectorAll("[data-buy]").forEach((el) => {
    const b = ordered[+el.dataset.buy];
    el.onclick = (e) => {
      if (e.target.closest("a")) return;
      const adv = e.target.closest("[data-advance]");
      if (adv) advancePurchase(b, t, () => { const y = scrollY; renderGiftsTab(t, v, buys, true); scrollTo(0, y); });
      else editPurchase(b.x, b.p, b.o);
    };
    el.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); editPurchase(b.x, b.p, b.o); } };
  });
}

function buyRow({ x, p }, n, still) {
  const at = stageAt(x.status);
  const nextStage = STAGES[at + 1];
  return `<div class="row buy${still ? "" : " slide"}" style="animation-delay:${Math.min(n, 8) * 0.04}s" role="button" tabindex="0" data-buy="${n}" aria-label="${esc(x.title)} for ${esc(p.name)}, ${STAGES[at][1]}">
    <div class="row-top">${avatar(p.name, p.id)}
      <div class="row-main">
        <div class="row-head"><span class="row-title">${esc(x.title)}</span>${x.spent_cents ? `<span class="row-price">${money(x.spent_cents)}</span>` : ""}</div>
        <span class="from">For ${esc(p.name)} · ${esc(x.from)}${x.url ? ` · <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(host(x.url))}</a>` : ""}</span>
        ${x.stash ? `<span class="stash">${PIN}${esc(x.stash)}</span>` : ""}
      </div>
    </div>
    <div class="buy-foot">${stagePill(x)}<span class="spacer"></span>
      ${nextStage ? `<button class="btn small" type="button" data-advance>${CHECK} ${nextStage[3]}</button>` : ""}</div>
  </div>`;
}

// One tap to the next stage. Shows right away; puts it back if saving fails.
async function advancePurchase({ x, o, p }, t, redraw) {
  const before = x.status;
  const to = STAGES[stageAt(before) + 1];
  if (!to) return;
  x.status = to[0];
  buzz();
  redraw();
  try {
    await api("purchase/progress", { kind: x.kind, id: x.id, subjectId: p.id, occasion: o.code, status: x.status, stash: x.stash || "" });
    writeCache("tracker", t);
    toast(`${x.title}: ${to[1].toLowerCase()}`, async () => {
      x.status = before;
      redraw();
      try { await api("purchase/progress", { kind: x.kind, id: x.id, subjectId: p.id, occasion: o.code, status: before || "", stash: x.stash || "" }); } catch (e) { toast(e.message); }
    });
  } catch (e) { x.status = before; redraw(); toast(e.message); }
}

// Edit a purchase: how it's going, where it's hidden, what you paid. Or take it back.
function editPurchase(x, p, o) {
  const at = stageAt(x.status);
  openSheet(`
    <h3>${esc(x.title)}${lockTip(`Only you see this. ${p.name} never will.`)}</h3>
    <p class="what">For ${esc(p.name)} · ${esc(occLabel(p, o))} · ${esc(x.from)}</p>
    <form id="buyForm" autocomplete="off">
      <div class="err" hidden></div>
      <div class="field"><span>How's it going?</span>
        <div class="seg stages" role="radiogroup" aria-label="How's it going" data-stage>${STAGES.map((s, n) =>
          `<button type="button" role="radio" data-v="${n}" aria-checked="${n === at}">${s[1]}</button>`).join("")}</div></div>
      <label class="field"><span>Where it's hidden</span><input class="input" name="stash" maxlength="80" value="${esc(x.stash)}" placeholder="Hall closet, top shelf"></label>
      <label class="field"><span>${x.kind === "giftcard" ? "Amount" : "Price you paid"}</span>
        <div class="input money-in"><span>$</span><input name="paid" inputmode="decimal" value="${esc(priceIn(x.paid_cents ?? x.list_cents))}" aria-label="Price you paid"></div></label>
      <div class="actions">
        <button class="btn danger" type="button" id="unbuy">Not getting it</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>`, (el) => {
      const stageEl = $("[data-stage]", el);
      wireSeg(stageEl, () => buzz());
      const form = $("#buyForm", el);
      wireForm(form, async ({ stash, paid }) => {
        const n = +stageEl.querySelector('[aria-checked="true"]').dataset.v;
        if (paid.trim() !== priceIn(x.paid_cents ?? x.list_cents)) await setPurchase(x, p, o, true, paid.trim());
        await api("purchase/progress", { kind: x.kind, id: x.id, subjectId: p.id, occasion: o.code, status: STAGES[n][0] || "", stash });
        closeSheet();
        toast("Saved");
        render();
      });
      $("#unbuy", el).addEventListener("click", async () => {
        if (!window.confirm(`Take back "${x.title}"? It won't count as purchased anymore.`)) return;
        try { await setPurchase(x, p, o, false); closeSheet(); toast("Taken back"); render(); } catch (e) { toast(e.message); }
      });
    });
}

// Mark (on) with a price, or unmark, through the endpoint for that kind of purchase.
function setPurchase(x, p, o, on, price) {
  if (x.kind === "item") return api("claim", { itemId: x.id, on, price, occasion: o.code });
  if (x.kind === "idea") return api("idea/claim", { ideaId: x.id, on, price, occasion: o.code });
  return api("giftcard/give", { memberId: p.id, brand: x.brand, on, amount: price, occasion: o.code });
}

// Ideas: every open idea you have, by person, plus a quick way to add one for people with none.
function renderIdeasTab(t, v) {
  const withIdeas = t.people.filter((p) => p.ideas.length);
  const without = t.people.filter((p) => !p.ideas.length);
  const all = t.people.flatMap((p) => p.ideas);
  const shared = all.filter((i) => i.shared).length;
  setHero(`${budgetTitle()}
    <div class="hero-stat">
      <p class="kicker">Gift ideas you haven't bought yet</p>
      <span class="big-num">${all.length}</span>
      <p class="hero-sub">${all.length ? `For ${plural(withIdeas.length, "person", "people")}${shared ? ` · ${shared} shared with others` : ""}` : "Jot one down whenever it comes to you"}</p>
    </div>`);
  v.innerHTML = `
    ${withIdeas.map((p) => `<div class="label occ-label"><span>${esc(p.name)}</span><button class="linkbtn" type="button" data-for="${esc(p.id)}">${PLUS} Add</button></div>
      <div class="stack">${p.ideas.map(ideaRow).join("")}</div>`).join("")}
    ${without.length ? `<div class="label" style="margin-top:18px">No ideas yet for</div>
      <div class="still-need">${without.map((p) => `<button class="chip" type="button" data-for="${esc(p.id)}">${avatar(p.name, p.id, "sm")}${esc(p.name)}</button>`).join("")}</div>` : ""}
    <div class="stack" style="margin-top:18px"><button class="add" type="button" id="addIdea">${PLUS} Gift idea</button></div>`;
  $("#addIdea").addEventListener("click", () => addThing(null));
  v.querySelectorAll("[data-for]").forEach((b) => (b.onclick = () => addThing(b.dataset.for)));
  wireIdeaRows(v, all);
}

function wireTrackerCard(card, t, view) {
  if (!card) return;
  const p = t.people.find((x) => x.id === card.dataset.person);
  const o = viewOcc(p, view);
  card.querySelector("[data-toggle]").onclick = () => {
    const id = card.dataset.person;
    if (state.openPeople.has(id)) state.openPeople.delete(id); else state.openPeople.add(id);
    card.outerHTML = personCard(p, o, view, 0, true);
    wireTrackerCard($(`.pcard[data-person="${CSS.escape(id)}"]`), t, view);
  };
  card.querySelector("[data-budget]")?.addEventListener("click", () => editBudget(p, o));
  card.querySelector("[data-for]")?.addEventListener("click", () => addThing(card.dataset.person));
  card.querySelector("[data-open]")?.addEventListener("click", () => setTab("family", card.dataset.person));
  card.querySelectorAll("[data-pbuy]").forEach((b) => (b.onclick = () => editPurchase(o.purchases[+b.dataset.pbuy], p, o)));
  wireIdeaRows(card, t.people.flatMap((x) => x.ideas));
}

function personCard(p, o, view, n = 0, still = false) {
  const budget = o.budget_cents;
  const isOpen = state.openPeople.has(p.id);
  const over = budget != null && o.spent_cents > budget;
  const pct = budget ? Math.min(100, Math.round((o.spent_cents / budget) * 100)) : 100;
  const pill = budget == null ? '<span class="pill none">No budget</span>'
    : over ? `<span class="pill over">${money(o.spent_cents - budget)} over</span>` : `<span class="pill">${money(budget - o.spent_cents)} left</span>`;
  const when = view === "birthday" ? `<small class="occ-when">${occDay(o)}, ${inDays(o)}${o.turning ? ` · turning ${o.turning}` : ""}</small>` : "";
  return `<div class="pcard${isOpen ? " is-open" : ""}${still ? "" : " slide"}" style="animation-delay:${n * 0.06}s" data-person="${esc(p.id)}">
    <button class="pcard-head" type="button" data-toggle="${esc(p.id)}" aria-expanded="${isOpen}">
      <span class="pcard-top">${avatar(p.name, p.id)}

// Nopes: someone's "rather not get" list (from their profile). An idea matches a nope when its name or note
// has the nope's words in order, singular or plural ("fuzzy sock set" matches "Fuzzy socks"; "steak" doesn't match "Tea").
const nopesOf = (id) => { for (const g of state.groups || []) { const m = g.members.find((x) => x.id === id); if (m) return m.nopes || []; } return []; };
// One word, singular or plural: candy/candies, tie/ties, box/boxes, sock/socks.
function nopeWord(w) {
  const q = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (/[^aeiou]ies$/.test(w) && w.length > 4) return `${q(w.slice(0, -3))}(?:y|ies)`;
  if (/[^aeiou]y$/.test(w) && w.length > 2) return `${q(w.slice(0, -1))}(?:y|ies)`;
  if (/(ss|sh|ch|x|z)es$/.test(w)) return `${q(w.slice(0, -2))}(?:es)?`;
  if (/s$/.test(w) && !/ss$/.test(w) && w.length > 3) return `${q(w.slice(0, -1))}(?:s|es)?`;
  return `${q(w)}(?:s|es)?`;
}
function nopeHits(id, text) {
  const plain = (x) => String(x || "").toLowerCase().normalize("NFD").replace(/\p{M}/gu, ""); // Pokemon = Pokémon
  const s = plain(text);
  if (!id || !s.trim()) return [];
  return nopesOf(id).filter((n) => {
    const words = plain(n).match(/[\p{L}\p{N}']+/gu);
    if (!words) return false;
    const re = words.map(nopeWord).join("[\\s-]+");
    return new RegExp(`(^|[^\\p{L}\\p{N}])${re}(?=$|[^\\p{L}\\p{N}])`, "u").test(s);
  });
}

// A gift idea for someone. With { purchase: true } it's "Add a purchase": an idea already marked bought.
function editIdea(idea, subjectId, opts = {}) {
  const isNew = !idea;
  const purchase = isNew && opts.purchase;
  const c = opts.carry;
  idea ||= { subject_id: subjectId, ...(c ? { title: c.title, url: c.url, price_cents: toCents(c.price), price_auto: c.priceAuto, note: c.notes } : {}) };
  const chips = isNew && opts.chooser && !purchase ? whoChips(subjectId) : "";
  const people = others();
  const boughtByOther = idea.claim && !idea.claim.mine;
  openSheet(`
    <h3>${purchase ? "Add a purchase" : isNew ? "Gift idea" : "Edit idea"}</h3>
    ${chips}
    <form id="ideaForm" autocomplete="off"${idea.price_auto ? ` data-price-auto="${esc(priceIn(idea.price_cents))}"` : ""}>
      <div class="err" hidden></div>
      ${chips ? (subjectId ? `<p class="what">For ${esc(personName(subjectId))}${lockTip(`${personName(subjectId)} never sees this.`)}</p>` : "") : isNew && !subjectId ? `<label class="field"><span>Who's it for?</span><select class="input" name="subjectId" required>
          <option value="">Choose someone</option>${people.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>`
        : `<p class="what">For ${esc(personName(idea.subject_id))}</p>`}
      ${isNew ? linkField(idea.url, true) : ""}
      <label class="field"><span>${purchase ? "What did you get?" : "Idea"}</span><input class="input" name="title" maxlength="200" value="${esc(idea.title)}" placeholder="${purchase ? "A candle" : isNew ? "Or type the idea" : "That book she mentioned"}" required></label>
      <div class="nope-warn" id="nopeWarn" role="status" hidden></div>
      ${isNew ? "" : linkField(idea.url)}
      ${photoField()}
      <label class="field"><span>Price</span><input class="input" name="price" inputmode="decimal" value="${esc(priceIn(idea.price_cents))}" placeholder="Fills in from the link"><small class="price-sync" hidden>Synced with the store. Type your own price to stop syncing.</small></label>
      <label class="field"><span>Note</span><textarea class="input" name="note" maxlength="1000">${esc(idea.note)}</textarea></label>
      <label class="check"><span>Let others see this idea<small id="shareHint"></small></span><input type="checkbox" name="shared" ${idea.shared ? "checked" : ""}></label>
      ${boughtByOther ? `<p class="hint">${esc(idea.claim.buyerName)} is getting this.</p>` : `
      <label class="check"${purchase ? " hidden" : ""}><span>I'm getting this</span><input type="checkbox" name="bought" ${idea.claim?.mine || purchase ? "checked" : ""}></label>
      <div id="occField"></div>
      <label class="field" id="paidField"><span>Price you paid</span><input class="input" name="paid" inputmode="decimal" value="${esc(priceIn(idea.claim?.price_cents ?? idea.price_cents))}"></label>`}
      <div class="actions sticky">
        ${isNew ? "" : '<button class="btn danger" type="button" id="removeIdea">Delete</button>'}
        <button class="btn primary" type="submit">${purchase ? "Save purchase" : "Save"}</button>
      </div>
    </form>`, (el) => {
      const form = $("#ideaForm", el);
      form.noValidate = true;
      wireAutofill(form);
      wireWhoChips(el);
      restoreImage(form, c);
      if (isNew && !form.elements.title.value && !form.elements.url.value) setTimeout(() => form.elements.url.focus(), 300);
      if (opts.fill) form.fillFromLink?.();
      // Which occasion it's for: shown when you're getting it and the person has a birthday too.
      let occSubject = null, occasion = () => undefined;
      const syncOcc = () => {
        const box = $("#occField", el);
        if (!box) return;
        const who = form.subjectId?.value || idea.subject_id;
        box.hidden = !form.bought?.checked;
        if (who === occSubject) return;
        occSubject = who;
        const occ = occasionsOf(who);
        const want = idea.claim?.occasion ?? (opts.view === "birthday" ? occ.find((o) => o.birthday)?.code : occ.find((o) => o.christmas)?.code);
        box.innerHTML = who ? occPicker(who, want) : "";
        occasion = wireOccPicker(box);
      };
      // Heads up when the idea matches one of their Nopes. Never blocks: the button just says Save anyway.
      const saveBtn = form.querySelector('[type="submit"]'), saveLabel = saveBtn.textContent;
      const checkNopes = () => {
        const who = form.subjectId?.value || idea.subject_id;
        const hits = nopeHits(who, `${form.title.value} ${form.note.value}`);
        const box = $("#nopeWarn", el);
        box.hidden = !hits.length;
        if (hits.length) box.innerHTML = `${NOPE_I}<span><strong>Heads up:</strong> ${esc(personName(who))} put ${andList(hits.map((h) => `<b>${esc(h)}</b>`))} in their nopes.</span>`;
        saveBtn.textContent = hits.length ? "Save anyway" : saveLabel;
        const was = form.dataset.nopeShown === "1";
        form.dataset.nopeShown = hits.length ? "1" : "";
        if (hits.length && !was) buzz();
        return { hits, was };
      };
      const sync = () => {
        checkNopes();
        syncOcc();
        const shared = form.shared.checked;
        $("#shareHint", el).textContent = shared
          ? `Everyone except ${personName(form.subjectId?.value || idea.subject_id)} can see it and get it.`
          : "Only you can see it.";
        if (form.bought) $("#paidField", el).hidden = !form.bought.checked;
        // When adding a purchase, the price you type is what you paid.
        if (purchase && form.paid && document.activeElement === form.price) form.paid.value = form.price.value;
      };
      form.addEventListener("change", sync);
      form.addEventListener("input", sync);
      sync();
      wireForm(form, async (d) => {
        // Filled in by a link without typing: show the heads up first, save on the next tap.
        const { hits, was } = checkNopes();
        if (hits.length && !was) return $("#nopeWarn", el).scrollIntoView({ block: "center", behavior: "smooth" });
        const payload = { id: idea.id, subjectId: d.subjectId || idea.subject_id, title: d.title, url: d.url, price: d.price, priceAuto: autoPrice(form), note: d.note, shared: d.shared, image: imageFor(form) };
        if (!boughtByOther) { payload.bought = d.bought; payload.paid = d.paid; if (d.bought) payload.occasion = occasion(); }
        if (!payload.subjectId) throw new Error("Choose who it's for.");
        await api("idea/save", payload);
        closeSheet();
        // Saved for someone whose page you're not on: offer a shortcut there.
        if (isNew && !purchase && state.person !== payload.subjectId && state.tab !== "notes") toast(`Idea saved for ${personName(payload.subjectId)}`, () => setTab("family", payload.subjectId), "View");
        else toast(purchase ? "Purchase added" : "Saved");
        if (purchase && payload.subjectId) state.openPeople.add(payload.subjectId);
        render();
      });
      $("#removeIdea", el)?.addEventListener("click", async () => {
        if (!window.confirm("Delete this idea?")) return;
        try { await api("idea/remove", { id: idea.id }); closeSheet(); toast("Deleted"); render(); }
        catch (e) { toast(e.message); }
      });
    });
}

// ---------- gift cards ----------
// Brands come from public/giftcards.js (shared with the server). A gift card is never "taken":
// anyone can give one, and the owner never learns who.
const GIFT_LIST = window.GIFT_CARDS || [];
const GC = Object.fromEntries(GIFT_LIST.map((g) => [g.key, g]));
const GC_GROUPS = [...new Set(GIFT_LIST.map((g) => g.group))];
const gcFindUrl = (g) => `https://www.google.com/search?q=${encodeURIComponent(`${g.name} gift card`)}`;
const squash = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]/g, "");
function giftCard(g, extra = "") {
  // The logo falls back to the emoji if its file can't load (offline before it was ever cached).
  const mark = g.logo ? `<span class="gc-logo${g.logo.endsWith(".svg") ? " mark" : ""}" data-emoji="${g.emoji}"><img src="${g.logo}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('broken')"></span>`
    : `<span class="gc-emoji">${g.emoji}</span>`;
  return `<span class="gc" style="--gc:${g.color}" aria-hidden="true"><span class="gc-top"><span class="gc-chip"></span>${mark}</span>
    <span class="gc-name"><small>Gift card</small>${esc(g.name)}</span>${extra}</span>`;
}

// My list: the gift cards I picked, plus a tile to change them.
function myGiftCards(cards = []) {
  const list = cards.filter((c) => GC[c.brand]);
  let k = 0;
  return `<div class="label">Gift cards${tip("They stay on your list every year, and people can give as many as they like.")}</div>
    <div class="gc-grid">${list.map((c, n) => {
      const pop = state.gcNew?.has(c.brand);
      return `<button class="gc-item ${pop ? "gc-pop" : "slide"}" type="button" data-gc-edit style="${pop ? `--d:${k++ * 0.08}s` : `animation-delay:${n * 0.04}s`}"
        aria-label="${esc(GC[c.brand].name)} gift card. Tap to change your gift cards.">${giftCard(GC[c.brand])}</button>`;
    }).join("")}
      <button class="gc-add" type="button" data-gc-edit>${PLUS}<span>${list.length ? "Add or remove" : "Add gift cards"}</span></button></div>`;
}

// Pick gift cards: tap stores on and off, then save. Replaces the whole set.
function pickGiftCards(current = []) {
  const before = new Set(current.map((c) => c.brand).filter((k) => GC[k]));
  const chosen = new Set(before);
  const card = (g) => `<button class="gc-item" type="button" data-pick="${g.key}" aria-pressed="${chosen.has(g.key)}" aria-label="${esc(g.name)}">${giftCard(g, `<span class="gc-check">${CHECK}</span>`)}</button>`;
  openSheet(`
    <h3>Gift cards you'd love</h3>
    <input class="input gc-search" type="search" placeholder="Search stores" aria-label="Search stores" autocomplete="off">
    ${GC_GROUPS.map((grp) => `<section data-group><div class="gc-group">${esc(grp)}</div>
      <div class="gc-pick">${GIFT_LIST.filter((g) => g.group === grp).map(card).join("")}</div></section>`).join("")}
    <p class="subtle" id="gcNone" hidden style="margin-top:14px">No matches</p>
    <div class="gc-pick-foot"><div class="err" hidden></div><button class="btn primary wide" type="button" id="gcSave"></button></div>`, (el) => {
      const save = $("#gcSave", el);
      const label = () => {
        const same = chosen.size === before.size && [...chosen].every((k) => before.has(k));
        save.textContent = same ? "Done" : chosen.size ? `Save ${plural(chosen.size, "gift card", "gift cards")}` : "Remove all gift cards";
      };
      label();
      el.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
        const k = b.dataset.pick;
        if (chosen.has(k)) chosen.delete(k); else chosen.add(k);
        b.setAttribute("aria-pressed", String(chosen.has(k)));
        buzz();
        label();
      }));
      const search = $(".gc-search", el);
      search.oninput = () => {
        const q = squash(search.value);
        let any = false;
        el.querySelectorAll("[data-group]").forEach((sec) => {
          let shown = 0;
          sec.querySelectorAll("[data-pick]").forEach((b) => {
            const ok = !q || squash(GC[b.dataset.pick].name).includes(q) || squash(GC[b.dataset.pick].group).includes(q);
            b.hidden = !ok;
            if (ok) shown++;
          });
          sec.hidden = !shown;
          if (shown) any = true;
        });
        $("#gcNone", el).hidden = any;
      };
      save.onclick = async () => {
        const added = [...chosen].filter((k) => !before.has(k));
        const removed = [...before].filter((k) => !chosen.has(k));
        if (!added.length && !removed.length) return closeSheet();
        const err = $(".err", el);
        err.hidden = true;
        save.disabled = true;
        try {
          await api("giftcards/save", { brands: [...chosen] });
          closeSheet();
          buzz();
          toast(added.length ? `Added ${plural(added.length, "gift card", "gift cards")} to your list` : "Gift cards saved");
          state.stale = true;
          state.gcNew = new Set(added);
          if (added.length) setTimeout(() => party(innerWidth / 2, innerHeight / 2.4, 26), 350);
          if (state.tab !== "mine" || state.person) return setTab("mine");
          render();
        } catch (e) {
          err.textContent = e.message;
          err.hidden = false;
          save.disabled = false;
        }
      };
    });
}

// Someone else's list: their gift cards. Never shown as taken. Removed ones only show if you're giving it.
// c.mine: your gifts for their upcoming occasions, [{ occasion, amount_cents }].
function theirGiftCards(cards = [], name, personId) {

      const g = GC[c.brand];

// "I'm giving one" for one of their occasions (Christmas, or their birthday if they added one), with an
// optional amount. Picking an occasion you already gave for switches to editing that gift.
function giveGiftCard(c, member, name, personId) {
  if (!c) return;
  const g = GC[c.brand];
  const who = name || "them";
  const mine = c.mine || [];
  const occ = occasionsOf(personId);
  const mineAt = (code) => mine.find((m) => String(m.occasion) === String(code));
  const first = mine[0]?.occasion;
  openSheet(`
    <h3>${mine.length ? "Your gift card" : `Give ${esc(who)} a gift card?`}${lockTip(`${who} won't see it's from you.`)}</h3>
    <div class="gc-hero">${giftCard(g)}</div>
    ${c.removed ? `<p class="hint" style="margin-top:0">${esc(who)} removed this from their list.</p>` : ""}
    ${c.others ? `<p class="hint" style="margin-top:0">${c.others === 1 ? "1 other person is" : `${c.others} others are`} giving one too.</p>` : ""}
    <form id="giveForm" autocomplete="off">
      <div class="err" hidden></div>
      ${occPicker(personId, first)}
      <label class="field"><span>Amount</span>
        <div class="input money-in"><span>$</span><input name="amount" inputmode="decimal" placeholder="25" aria-label="Gift card amount"></div></label>
      <div id="giveActions"></div>
      <a class="btn quiet wide gc-find" href="${esc(gcFindUrl(g))}" target="_blank" rel="noopener">Find ${esc(g.name)} gift cards ${OUT}</a>
    </form>`, (el) => {
      const form = $("#giveForm", el);
      const occasion = wireOccPicker(el);
      const send = (on, amount, code) => api("giftcard/give", { memberId: member.id, brand: c.brand, on, amount, occasion: code });
      // The amount and buttons follow the picked occasion: your gift for it, or a new one.
      const paint = () => {
        const have = mineAt(occasion() ?? first ?? occ[0]?.code);
        form.elements.amount.value = have ? priceIn(have.amount_cents) : "";
        $("#giveActions", el).innerHTML = have
          ? `<div class="actions"><button class="btn danger" type="button" id="ungive">Not giving it</button><button class="btn primary" type="submit">Save</button></div>`
          : `<button class="btn primary wide" type="submit">${GIFT_SM} Yes, I'm giving one</button>`;
        $("#ungive", el)?.addEventListener("click", async () => {
          try { await send(false, undefined, have.occasion); closeSheet(); toast("Taken back"); render(); }
          catch (e) { toast(e.message); }
        });
      };
      paint();
      el.querySelectorAll("[data-occ] button").forEach((b) => b.addEventListener("click", paint));
      wireForm(form, async ({ amount }) => {
        const code = occasion() ?? first;
        const editing = !!mineAt(code ?? occ[0]?.code);
        await send(true, amount, code);
        closeSheet();
        if (editing) { toast("Saved"); return render(); }
        buzz();
        const n = parseFloat(String(amount).replace(/[$,\s]/g, ""));
        const filed = code ?? occ[0]?.code;
        toast(n > 0 ? `Added ${money(Math.round(n * 100))} to ${who}'s budget` : `You're giving ${who} a ${g.name} gift card`,
          () => send(false, undefined, filed).then(render, (e) => toast(e.message)));
        state.burst = `gc:${c.brand}`;
        render();
      });
    });
}

// ---------- Excel export ----------
function loadXlsx() {
  if (window.buildXlsx) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "/xlsx.js";
    s.onload = ok;
    s.onerror = () => no(new Error("Couldn't load the exporter. Check your connection."));
    document.head.appendChild(s);
  });
}

// Exports the view you're looking at (Christmas or Birthdays).
async function exportExcel(t, view) {
  try {
    await loadXlsx();
    const dollars = (c) => (c == null ? null : c / 100);
    const day = (iso) => (iso ? iso.slice(0, 10) : null);
    const rows = t.people.map((p) => ({ p, o: viewOcc(p, view) })).filter((r) => r.o);
    if (view === "birthday") rows.sort((a, b) => a.o.code - b.o.code);
    const summary = rows.map(({ p, o }) => [p.name, o.date, dollars(o.budget_cents), dollars(o.spent_cents), o.budget_cents == null ? null : dollars(o.budget_cents - o.spent_cents), o.purchases.length, p.ideas.length]);
    const tb = rows.reduce((n, r) => n + (r.o.budget_cents || 0), 0), ts = rows.reduce((n, r) => n + r.o.spent_cents, 0);
    summary.push(["Total", null, dollars(tb), dollars(ts), dollars(tb - ts), rows.reduce((n, r) => n + r.o.purchases.length, 0), rows.reduce((n, r) => n + r.p.ideas.length, 0)]);
    const blob = window.buildXlsx([
      { name: "Summary", boldLast: true, columns: [
          { header: "Person", width: 20 }, { header: view === "birthday" ? "Birthday" : "Date", width: 12 }, { header: "Budget", money: true }, { header: "Spent", money: true },
          { header: "Left", money: true }, { header: "Gifts bought", width: 13 }, { header: "Open ideas", width: 12 }],
        rows: summary },
      { name: "Purchases", columns: [
          { header: "Person", width: 18 }, { header: "Gift", width: 36 }, { header: "From", width: 22 }, { header: "Paid", money: true },
          { header: "Listed price", money: true }, { header: "Status", width: 12 }, { header: "Hidden", width: 22 }, { header: "Date", width: 12 }, { header: "Link", width: 40 }],
        rows: rows.flatMap(({ p, o }) => o.purchases.map((x) => [p.name, x.title, x.from, dollars(x.spent_cents), dollars(x.list_cents), STAGES[stageAt(x.status)][1], x.stash, day(x.date), x.url])) },
      { name: "Ideas", columns: [
          { header: "Person", width: 18 }, { header: "Idea", width: 36 }, { header: "Price", money: true }, { header: "Shared", width: 10 },
          { header: "Note", width: 40 }, { header: "Link", width: 40 }],
        rows: rows.flatMap(({ p }) => p.ideas.map((i) => [p.name, i.title, dollars(i.price_cents), i.shared ? "Yes" : "No", i.note, i.url])) },
    ]);
    const filename = view === "birthday" ? `Hints birthdays ${state.today ? String(state.today).slice(0, 4) : ""}.xlsx`.replace(" .", ".") : `Hints budget Christmas ${xmasYear(t)}.xlsx`;
    const file = new File([blob], filename, { type: blob.type });
    // Phones: the share sheet lets you save to Files or send it. Computers: a normal download.
    if (navigator.canShare?.({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { toast(e.message); }
}

    </div>

    <div class="set-card" id="ed-tags">

      ${seg("Add to", [["likes", `<span aria-hidden="true">♥</span> Loves`], ["dislikes", "Nopes"]], focus === "tags-nope" ? "dislikes" : "likes", "lovenope")}
      <div class="tag-add">
        <input class="input" id="tagIn" maxlength="40" enterkeyhint="done" autocomplete="off" aria-label="Add a love or nope">

      </div>
      <div class="tag-cols">
        <div class="tag-col" data-col="likes"><span class="flabel"><span class="ico" style="color:var(--brand);display:inline-flex">${HEART_I}</span>Loves <em id="likeN"></em></span><div class="tags edit" id="likeTags"></div></div>
        <div class="tag-col" data-col="dislikes"><span class="flabel"><span style="color:var(--muted);display:inline-flex">${NOPE_I}</span>Nopes <em id="nopeN"></em></span><div class="tags edit" id="nopeTags"></div></div>
      </div>
      <div class="tag-ideas">
        <div class="tag-ideas-h"><span>Need ideas? Tap to add</span><button class="linkbtn" type="button" id="moreIdeas">More ideas</button></div>
        <div class="tags" id="ideaTags"></div>
      </div>
    </div>

    <div class="set-card" id="ed-sizes">
      <h4>Sizes</h4>
      <div class="two">${SIZE_LABELS.map(([k, l]) => `<label class="field"><span style="font-size:14px;color:var(--muted);margin-bottom:4px">${l}</span><input class="input" name="size_${k}" maxlength="30" value="${esc(prof.sizes?.[k] || "")}" placeholder="${SIZE_EG[k]}"></label>`).join("")}</div>
    </div>

    <div class="set-card" id="ed-style">
      <h4>Your style</h4>
      <span class="flabel" style="margin-top:8px">Favorite brands</span>
      <div id="brandChips">${brandChips(prof.brands || [], true)}</div>
      <div class="brand-add">
        <input class="input" id="brandIn" maxlength="40" list="brandList" placeholder="Lululemon, Trader Joe's" autocomplete="off" enterkeyhint="done" aria-label="Add a favorite brand">
        <button class="btn small" type="button" id="brandAdd">${PLUS} Add</button>
      </div>
      <datalist id="brandList">${GIFT_LIST.map((g) => `<option value="${esc(g.name)}">`).join("")}</datalist>
      <span class="flabel">Gift style <em>(up to 3)</em></span>
      <div class="pick-chips" id="styleChips">${GIFT_STYLES.map(([k, l]) => `<button class="chip" type="button" data-style="${k}" aria-pressed="${(prof.giftStyle || []).includes(k)}">${esc(l).replace(/^(\S+) /, '<span aria-hidden="true">$1</span>')}</button>`).join("")}</div>
      <span class="flabel">Favorite colors <em>(up to 3, they color your profile)</em></span>
      <div class="swatches" id="colorPick">${FAV_COLORS.map(([k, l, c]) => `<button class="swatch" type="button" data-color="${k}" aria-pressed="${(prof.colors || []).includes(k)}" aria-label="${l}" title="${l}" style="--c:${c};${["white", "yellow", "silver"].includes(k) ? "--tick:#2A1E22" : ""}"></button>`).join("")}</div>
    </div>

    <div class="set-card" id="ed-careful">
      <h4>Allergies and hard nos</h4>
      <p>Shown with a heads up on your page, so nobody misses it.</p>
      <textarea class="input" name="avoid" maxlength="300" aria-label="Allergies and hard nos" placeholder="Allergic to wool, no scented candles">${esc(prof.avoid || "")}</textarea>
    </div>

    <div class="err" hidden></div>
    <div class="save-bar">
      <button class="btn" type="button" id="cancelEdit">Cancel</button>
      <button class="btn primary" type="submit">Save profile</button>
    </div>
  </form>`;
  $("#cancelTop").onclick = () => done();
  $("#cancelEdit", v).onclick = () => done();
  const target = { about: "#ed-about", tags: "#ed-tags", "tags-nope": "#ed-tags", sizes: "#ed-sizes", style: "#ed-style" }[focus];
  if (target && focus !== "about") requestAnimationFrame(() => $(target, v)?.scrollIntoView({ block: "start", behavior: "smooth" }));

  // Photo saves right away, like before.
  const file = $("#photoFile", v);
  $("#pickPhoto", v).onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    const btn = $("#pickPhoto", v);
    btn.disabled = true;
    try { await api("profile", { photo: await squarePhoto(f) }); state.stale = true; toast("Photo saved"); $("#mePhoto", v).innerHTML = avatar(state.me.name, state.me.id).replace('class="avatar"', 'class="avatar huge"'); }
    catch (e) { toast(e.message); }
    btn.disabled = false;
  };
  $("#removePhoto", v)?.addEventListener("click", async () => {
    try { await api("profile", { photo: "" }); PHOTOS.delete(state.me.id); state.stale = true; toast("Photo removed"); $("#mePhoto", v).innerHTML = avatar(state.me.name, state.me.id).replace('class="avatar"', 'class="avatar huge"'); }
    catch (e) { toast(e.message); }
  });

  // Bio counter.
  const bioIn = $("#bioIn", v), bioCount = $("#bioCount", v);
  const countBio = () => { const left = 100 - bioIn.value.length; bioCount.textContent = left <= 30 ? `${left} left` : ""; };
  bioIn.oninput = countBio; countBio();

  // Loves and nopes. Kept here until Save.
  const lists = { likes: [...(prof.likes || [])], dislikes: [...(prof.dislikes || [])] };
  let mode = focus === "tags-nope" ? "dislikes" : "likes", ideaAt = 0;
  const tagIn = $("#tagIn", v);
  const other = (m) => (m === "likes" ? "dislikes" : "likes");
  const find = (m, t) => lists[m].findIndex((x) => x.toLowerCase() === t.toLowerCase());
  const editChip = (t, m, k) => `<span class="tag ${m === "likes" ? "love" : "nope"}" style="--i:0" data-move="${m}:${k}" role="button" tabindex="0" aria-label="${esc(t)}, move to ${m === "likes" ? "Nopes" : "Loves"}">
    <i aria-hidden="true">${tagEmoji(t)}</i><span>${esc(t)}</span><button type="button" data-drop="${m}:${k}" aria-label="Remove ${esc(t)}">&times;</button></span>`;
  const paint = () => {
    for (const [m, el, n] of [["likes", "#likeTags", "#likeN"], ["dislikes", "#nopeTags", "#nopeN"]]) {
      $(el, v).innerHTML = lists[m].length ? lists[m].map((t, k) => editChip(t, m, k)).join("") : `<p class="tags-empty">${m === "likes" ? "Nothing yet" : "Nothing yet. Lucky them."}</p>`;
      $(n, v).textContent = lists[m].length ? `(${lists[m].length})` : "";
    }
    v.querySelectorAll(".tag-col").forEach((c) => c.classList.toggle("on", c.dataset.col === mode));
    tagIn.placeholder = mode === "likes" ? "Cats, coffee, Pokémon" : "Tea, fuzzy socks, clutter";
    const used = new Set([...lists.likes, ...lists.dislikes].map((t) => t.toLowerCase()));
    const ideas = TAG_IDEAS.filter((t) => !used.has(t.toLowerCase()));
    const start = ideas.length ? (ideaAt * 12) % ideas.length : 0;
    $("#ideaTags", v).innerHTML = [...ideas.slice(start), ...ideas.slice(0, start)].slice(0, 12)
      .map((t, k) => `<button class="tag" type="button" style="--i:${k}" data-idea="${esc(t)}"><i aria-hidden="true">${tagEmoji(t)}</i><span>${esc(t)}</span></button>`).join("");
    $("#moreIdeas", v).hidden = ideas.length <= 12;
  };
  const add = (raw, m = mode) => {
    let added = 0;
    for (const part of raw.split(/[,;\n]+/)) {
      const t = part.replace(/\s+/g, " ").trim().slice(0, 40);
      if (!t) continue;
      if (find(m, t) >= 0) { toast(`${t} is already there`); continue; }
      const o = find(other(m), t);
      if (o >= 0) lists[other(m)].splice(o, 1);
      if (lists[m].length >= 30) { toast("That's plenty. Keep it to 30."); break; }
      lists[m].push(t); added++;
    }
    if (added) buzz();
    paint();
  };
  wireSeg($(".seg.lovenope", v), (val) => { mode = val; paint(); tagIn.focus(); });
  $("#tagAdd", v).onclick = () => { add(tagIn.value); tagIn.value = ""; tagIn.focus(); };
  tagIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(tagIn.value); tagIn.value = ""; } });
  $("#moreIdeas", v).onclick = () => { ideaAt++; paint(); };
  const moveTo = (el) => {
    const [m, k] = el.dataset.move.split(":");
    const [t] = lists[m].splice(+k, 1);
    lists[other(m)].push(t);
    buzz(); paint();
    toast(`Moved ${t} to ${m === "likes" ? "Nopes" : "Loves"}`);
  };
  v.querySelector("#ed-tags").addEventListener("click", (e) => {
    const drop = e.target.closest("[data-drop]"), move = e.target.closest("[data-move]"), idea = e.target.closest("[data-idea]");
    if (drop) { const [m, k] = drop.dataset.drop.split(":"); lists[m].splice(+k, 1); paint(); }
    else if (move) moveTo(move);
    else if (idea) add(idea.dataset.idea);
  });
  v.querySelector("#ed-tags").addEventListener("keydown", (e) => {
    const move = e.target.closest?.("[data-move]");
    if (move && e.target === move && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); moveTo(move); }
  });
  paint();

  // Favorite brands: typed or picked from the list, shown as chips.
  const brands = [...(prof.brands || [])];
  const brandIn = $("#brandIn", v);
  const paintBrands = () => {
    $("#brandChips", v).innerHTML = brandChips(brands, true);
    v.querySelectorAll("[data-unbrand]").forEach((b) => (b.onclick = () => { brands.splice(+b.dataset.unbrand, 1); paintBrands(); }));
  };
  const addBrand = () => {
    const name = brandIn.value.replace(/\s+/g, " ").trim();
    brandIn.value = "";
    if (!name) return;
    if (brands.some((b) => b.toLowerCase() === name.toLowerCase())) return toast(`${name} is already on there`);
    if (brands.length >= 20) return toast("That's a lot of brands. Keep it to 20.");
    brands.push(name);
    paintBrands();
  };
  paintBrands();
  $("#brandAdd", v).onclick = () => { addBrand(); brandIn.focus(); };
  brandIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addBrand(); } });
  brandIn.addEventListener("input", (e) => { if (e.inputType === "insertReplacementText" || (!e.inputType && GIFT_LIST.some((g) => g.name === brandIn.value))) addBrand(); });
  // Gift style and favorite colors: tap on and off, up to 3 each.
  const picked = (attr) => [...v.querySelectorAll(`[${attr}][aria-pressed="true"]`)].map((b) => b.getAttribute(attr));
  for (const [attr, what] of [["data-style", "gift styles"], ["data-color", "colors"]]) {
    v.querySelectorAll(`[${attr}]`).forEach((b) => (b.onclick = () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      if (on && picked(attr).length >= 3) return toast(`Pick up to 3 ${what}`);
      b.setAttribute("aria-pressed", String(on));
      buzz();
    }));
  }
  wireForm($("#profileForm", v), async (f) => {
    if (!!f.bmonth !== !!f.bday) throw new Error("Pick both a month and a day for your birthday, or leave both empty.");
    if (brandIn.value.trim()) addBrand();
    if (tagIn.value.trim()) { add(tagIn.value); tagIn.value = ""; }
    const pad = (n) => String(n).padStart(2, "0");
    await api("profile", {
      name: f.name,
      bio: f.bio,
      birthday: f.bmonth ? `${pad(f.bmonth)}-${pad(f.bday)}` : "",
      birthYear: f.bmonth ? f.byear.trim() : "",
      sizes: Object.fromEntries(SIZE_LABELS.map(([k]) => [k, f[`size_${k}`]])),
      avoid: f.avoid,
      brands,
      giftStyle: picked("data-style"),
      colors: picked("data-color"),
      likes: lists.likes,
      dislikes: lists.dislikes,
    });
    done("Profile saved");
  });
}

// ---------- settings ----------
// Opens from the gear on Profile. Look and feel, PIN, circles, household, the app, sign out.
const MOTION_KEY = "wishlist-motion";
const SUN_I = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_I = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const TICK_I = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
const TEXT_SIZES = [["sm", "Small", 14], ["md", "Normal", 17], ["lg", "Large", 20], ["xl", "Extra large", 23]];

function seg(name, options, current, cls = "") {
  return `<div class="seg ${cls}" role="radiogroup" aria-label="${esc(name)}">${options.map(([v, l]) =>
    `<button type="button" role="radio" data-v="${v}" aria-checked="${v === current}">${l}</button>`).join("")}</div>`;
}
function wireSeg(el, onPick) {
  el.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
    onPick(b.dataset.v);
  }));
}
const swRow = (id, title, sub, on) => `<button class="sw-row" type="button" role="switch" id="${id}" aria-checked="${on}">
  <span class="txt"><strong>${esc(title)}</strong>${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="switch" aria-hidden="true"></span></button>`;

const themeAuto = () => !document.documentElement.dataset.theme;
const isDark = () => (themeAuto() ? matchMedia("(prefers-color-scheme: dark)").matches : document.documentElement.dataset.theme === "dark");
function setTheme(v) {
  const root = document.documentElement;
  try { v === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", v); } catch {}
  if (v === "auto") delete root.dataset.theme; else root.dataset.theme = v;
}
function setTextSize(v) {
  const root = document.documentElement;
  try { v === "md" ? localStorage.removeItem(TEXT_KEY) : localStorage.setItem(TEXT_KEY, v); } catch {}
  if (v === "md") delete root.dataset.text; else root.dataset.text = v;
}
function setMotion(on) {
  const root = document.documentElement;
  try { on ? localStorage.removeItem(MOTION_KEY) : localStorage.setItem(MOTION_KEY, "off"); } catch {}
  if (on) delete root.dataset.motion; else root.dataset.motion = "off";
}

async function renderSettings() {
  const iOS = isAppleMobile();
  const root = document.documentElement;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  setHero(`<button class="back" type="button" id="backBtn">${BACK} Profile</button>${heroTitle(state.me.name, "Settings")}`);
  const v = $("#view");
  v.innerHTML = `
    <div class="label" style="margin-top:0">Look and feel</div>
    <div class="set-card">
      <h4>Light or dark</h4>
      <div class="modes" role="radiogroup" aria-label="Light or dark" id="modes">
        ${[["light", "Light", SUN_I], ["dark", "Dark", MOON_I]].map(([m, l, ic]) => `
          <button class="mode" type="button" role="radio" data-mode="${m}" aria-checked="false">
            <span class="pv ${m}" aria-hidden="true"><i></i><i></i><i style="width:75%"></i></span>
            <span class="nm">${ic} ${l}<span class="tick">${TICK_I}</span></span>
