<style>
  /* Warm and a little handmade: cream paper, a wine header band, burgundy for actions, gold for
     top picks, pine for "you're getting this". Fraunces for titles and big numbers, Figtree for the rest.
     Big tap targets and plain words so it works for every age. Motion marks real moments only. */
  :root {
    --bg: #FAF6F1; --card: #FFFFFF; --panel: #F3ECE4; --ink: #2A1E22; --muted: #6B5E62; --faint: #A3979A;
    --line: #EADFD4; --brand: #7A1B36; --brand-ink: #FFFFFF; --soft: #F7E6EA; --soft-ink: #7A1B36;
    --hero: #4A0E22; --hero-ink: #FFF8F2; --hero-muted: #E8C3CD;
    --gold: #D9A94A; --gold-ink: #7A5410; --gold-soft: #FBF1DC;
    --ok: #2F6B4F; --ok-soft: #E8F2EC; --warn: #A15C07; --warn-soft: #FDF3E2; --warn-bar: #C98A2E;
    --err-bg: #FCECEA; --err: #A32A22;
    --t0: #F7E6EA; --t0-ink: #7A1B36; --t1: #E6EFE9; --t1-ink: #2F6B4F; --t2: #FBF1DC; --t2-ink: #7A5410; --t3: #E8EAF4; --t3-ink: #33407A;
    --shadow: 0 1px 2px rgba(74, 14, 34, .06), 0 8px 20px rgba(74, 14, 34, .06);
    --r: 18px;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --sans: Figtree, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --spring: cubic-bezier(.3, 1.4, .5, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
      --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
      --hero: #2B0D18; --hero-ink: #FFF1F4; --hero-muted: #D9A7B5; --gold: #E0B75E; --gold-ink: #F1D08A; --gold-soft: #3A2F1C;
      --ok: #8FD0B4; --ok-soft: #1E3029; --warn: #F2C27A; --warn-soft: #3A2C17; --warn-bar: #D9A04A; --err-bg: #3A1F1D; --err: #F2BDB7;
      --t0: #3A2129; --t0-ink: #F0B5C4; --t1: #1E3029; --t1-ink: #8FD0B4; --t2: #3A2F1C; --t2-ink: #F1D08A; --t3: #252A3D; --t3-ink: #B4BDF0;
      --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
    --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
    --hero: #2B0D18; --hero-ink: #FFF1F4; --hero-muted: #D9A7B5; --gold: #E0B75E; --gold-ink: #F1D08A; --gold-soft: #3A2F1C;
    --ok: #8FD0B4; --ok-soft: #1E3029; --warn: #F2C27A; --warn-soft: #3A2C17; --warn-bar: #D9A04A; --err-bg: #3A1F1D; --err: #F2BDB7;
    --t0: #3A2129; --t0-ink: #F0B5C4; --t1: #1E3029; --t1-ink: #8FD0B4; --t2: #3A2F1C; --t2-ink: #F1D08A; --t3: #252A3D; --t3-ink: #B4BDF0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

  /* App color (Settings > Look and feel): Wine is the default above. Each one swaps the action color,
     soft tints and the header band, in light and dark. Saved per device (wishlist-accent). */
  :root[data-accent="navy"] { --brand: #2E4A7D; --soft: #E7ECF6; --soft-ink: #2E4A7D; --hero: #17284A; --hero-muted: #BCC8E4; }
  :root[data-accent="plum"] { --brand: #5E2A73; --soft: #F0E7F4; --soft-ink: #5E2A73; --hero: #351543; --hero-muted: #D4BCDF; }
  :root[data-accent="clay"] { --brand: #A0472A; --soft: #F8E9E2; --soft-ink: #8A3B22; --hero: #4E2114; --hero-muted: #EBC3B3; }
  @media (prefers-color-scheme: dark) {
    :root[data-accent="navy"]:not([data-theme="light"]) { --brand: #A9BDF0; --brand-ink: #111B33; --soft: #232B40; --soft-ink: #BFCDF5; --hero: #121B30; --hero-muted: #A7B4D8; }
    :root[data-accent="plum"]:not([data-theme="light"]) { --brand: #D2A8E6; --brand-ink: #24102D; --soft: #33213D; --soft-ink: #DDBDEB; --hero: #22102B; --hero-muted: #C3A3D2; }
    :root[data-accent="clay"]:not([data-theme="light"]) { --brand: #EBA88F; --brand-ink: #2E140B; --soft: #3A251E; --soft-ink: #F2BFAB; --hero: #2E150D; --hero-muted: #D9AE9E; }
  }
  :root[data-accent="navy"][data-theme="dark"] { --brand: #A9BDF0; --brand-ink: #111B33; --soft: #232B40; --soft-ink: #BFCDF5; --hero: #121B30; --hero-muted: #A7B4D8; }
  :root[data-accent="plum"][data-theme="dark"] { --brand: #D2A8E6; --brand-ink: #24102D; --soft: #33213D; --soft-ink: #DDBDEB; --hero: #22102B; --hero-muted: #C3A3D2; }
  :root[data-accent="clay"][data-theme="dark"] { --brand: #EBA88F; --brand-ink: #2E140B; --soft: #3A251E; --soft-ink: #F2BFAB; --hero: #2E150D; --hero-muted: #D9AE9E; }

  /* Text size setting (Settings > Text size): Small, Normal, Large, Extra large. */
  :root[data-text="sm"] :is(main, .hero, dialog.sheet, nav.tabs, .toast) { zoom: .9; }
  :root[data-text="lg"] :is(main, .hero, dialog.sheet, nav.tabs, .toast) { zoom: 1.12; }
  :root[data-text="xl"] :is(main, .hero, dialog.sheet, .toast) { zoom: 1.25; }
  :root[data-text="xl"] nav.tabs { zoom: 1.12; }

  /* The theme button lives in Settings now. theme.js still applies the saved choice. */
  .theme-toggle { display: none !important; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font: inherit; color: var(--ink); }
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  main { max-width: 560px; margin: 0 auto;
    padding-block: 20px calc(env(safe-area-inset-bottom, 0px) + 120px);
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

  /* Wine header band */
  .hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink);
    padding: calc(env(safe-area-inset-top, 0px) + 26px) max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
  .hero-in { position: relative; max-width: 560px; margin: 0 auto; }
  .doodle { position: absolute; right: -28px; top: -14px; width: 240px; height: 170px; color: var(--hero-muted); opacity: .22; pointer-events: none; }
  @media (min-width: 720px) { .doodle { right: 4%; } }
  .kicker { margin: 0; color: var(--hero-muted); font-size: 15px; font-weight: 600; }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -.01em; margin: 4px 0 0; }
  .squiggle { display: block; margin-top: 6px; color: var(--gold); }
  .hero .back { color: var(--hero-muted); margin: -10px 0 6px -6px; padding: 0 8px 0 4px; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .hero-row .avatar { border: 2px solid var(--hero-muted); }
  .hero-row h1 { margin: 0; }
  .hero-row .who-name { flex: 1; min-width: 0; }
  .realname { display: block; color: var(--hero-muted); font-size: 14px; margin-top: 2px; }
  .lockline { display: inline-flex; align-items: center; gap: 5px; color: var(--hero-muted); font-size: 14px; font-weight: 600; margin-top: 8px; }
  .hero-meter { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; }
  .hero-meter .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .16); overflow: hidden; }
  .hero-meter .bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transform-origin: left; animation: fill 1s var(--spring) .2s both; }
  .hero-meter b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .hero-edit { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 11px; border-radius: 999px;
    border: 1.5px solid color-mix(in srgb, var(--hero-muted) 55%, transparent); background: transparent; color: var(--hero-ink); font-weight: 700; font-size: 15px; }
  .hero-edit:active { transform: scale(.96); }
  .hero-edit:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 380px) { .hero-edit span { display: none; } .hero-edit { padding: 0; width: 40px; justify-content: center; } }
  .hero-btn { margin-top: 16px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--hero-muted) 55%, transparent);
    background: transparent; color: var(--hero-ink); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .hero-stat { margin-top: 18px; }
  .big-num { display: block; font-family: var(--serif); font-size: 58px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero-sub { margin: 2px 0 0; color: var(--hero-muted); font-size: 15px; }
  .welcome-logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }

  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    display: grid; place-items: center; flex: none; padding: 0; }
  .press, .btn, .iconbtn, .member, .chip, .star-btn, .publish-btn, .seg button { transition: transform .14s var(--spring); }
  :is(.press, .btn, .iconbtn, .member, .chip, .star-btn, .publish-btn):active, .row[role="button"]:active { transform: scale(.97); }
  :is(.iconbtn, .btn, .tab, .row, .member, .add, .chip, .star-btn, .pcard-head, .seg button, .hero-btn, .back):focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .count-line { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
  .label { margin: 30px 0 4px; font-size: 18px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .label + .subtle { margin-top: 0; }
  #view > .label:first-child { margin-top: 4px; }
  .subtle { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .footnote { text-align: center; color: var(--muted); font-size: 14px; margin: 24px 0 0; }
  .spacer { flex: 1; }

  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; min-height: 48px; padding: 10px 18px; font-weight: 700; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.wide { width: 100%; }
  .btn.small { min-height: 44px; padding: 7px 14px; font-size: 15px; border-radius: 12px; }
  .btn.quiet { border-color: transparent; background: none; color: var(--brand); min-height: 44px; }
  .btn.danger { color: var(--err); }
  .btn[disabled] { opacity: .55; pointer-events: none; }
  .add { width: 100%; border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 16px; min-height: 54px; padding: 14px;
    font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 25%, transparent); }
  .add.soft { background: transparent; color: var(--brand); box-shadow: none; min-height: 52px; font-size: 16px; border: 1.5px dashed color-mix(in srgb, var(--brand) 35%, var(--line)); }

  .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 12px; }

  /* Wish cards */
  .row { position: relative; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: var(--r); padding: 14px; display: block; box-shadow: var(--shadow);
    transition: background-color .35s ease, box-shadow .35s ease, transform .14s var(--spring); }
  .row-top { display: flex; align-items: flex-start; gap: 14px; }
  .tile { width: 60px; height: 60px; border-radius: 14px; flex: none; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; font-weight: 600;
    background: var(--t0); color: var(--t0-ink); }
  .tile svg { width: 30px; height: 30px; }
  .tile.photo { background: #FFFFFF; padding: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .tile.photo img { width: 100%; height: 100%; object-fit: contain; border-radius: 9px; display: block; }
  .tile.fresh img { animation: fade .45s ease both; }
  .fillmsg img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
  .fillmsg.has-img { display: flex; align-items: center; gap: 10px; }
  .tile.t1 { background: var(--t1); color: var(--t1-ink); } .tile.t2 { background: var(--t2); color: var(--t2-ink); } .tile.t3 { background: var(--t3); color: var(--t3-ink); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-head { display: flex; align-items: flex-start; gap: 10px; }
  .row-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .row-price { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--soft-ink); white-space: nowrap; }
  .row-notes { color: var(--muted); font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row-foot:empty { display: none; }
  .open { font-size: 14px; font-weight: 700; color: var(--brand); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
  .from { font-size: 14px; color: var(--muted); }
  .from a { color: inherit; }
  .price-tag { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 9px; border-radius: 6px 14px 14px 6px;
    background: var(--soft); color: var(--soft-ink); font-family: var(--serif); font-size: 15px; font-weight: 600; transform: rotate(-3deg); transform-origin: 10px 50%; }
  .price-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--card); }
  .anyprice { font-size: 14px; color: var(--muted); }
  .hid-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--panel);
    border-radius: 999px; padding: 3px 10px; margin-top: 6px; width: fit-content; }
  .fam { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .fam:first-of-type { border-top: 0; padding-top: 0; }
  .fam .who { flex: 1; min-width: 0; }
  .fam strong { display: block; color: var(--ink); font-size: 17px; overflow-wrap: anywhere; }
  .fam small { color: var(--muted); font-size: 14px; }
  .fam .code-sm { font-weight: 800; letter-spacing: .1em; color: var(--ink); }
  .fam-label { justify-content: space-between; }
  .star-btn { position: relative; min-height: 44px; border: 0; border-radius: 999px; padding: 0 13px; background: var(--panel); color: var(--muted);
    font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .star-btn svg { transform: rotate(-6deg); }
  .star-btn svg path { fill: none; stroke: currentColor; }
  .star-btn[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold-ink); }
  .star-btn[aria-pressed="true"] svg path { fill: var(--gold); stroke: var(--gold-ink); }
  .star-btn.pop svg { animation: pop .5s ease both; }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); pointer-events: none; animation: spark .55s ease-out both; }
  .toppick { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; color: var(--gold-ink); }
  .toppick svg { transform: rotate(-6deg); }
  .toppick path { fill: var(--gold); stroke: var(--gold-ink); }

  /* Someone else's list */
  .row.mine { background: var(--ok-soft); box-shadow: none; }
  /* "Just me": private drafts, shown with a dashed edge until published */
  .row.draft { background: var(--panel); box-shadow: none; outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
  .publish-btn { min-height: 44px; border: 0; border-radius: 999px; padding: 0 15px; background: var(--brand); color: var(--brand-ink);
    font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .publish-btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .just-me-note { display: flex; gap: 8px; align-items: flex-start; background: var(--panel); border-radius: 12px; padding: 10px 12px;
    color: var(--muted); font-size: 14px; line-height: 1.4; margin: 0 0 14px; }
  .just-me-note svg { flex: none; margin-top: 2px; }
  .just-me-note strong { color: var(--ink); }
  .row.taken { background: var(--panel); box-shadow: none; }
  .row.taken .tile { filter: grayscale(1); opacity: .6; }
  .row.taken .row-title { color: var(--muted); }
  .mine-line { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 700; font-size: 15px; }
  .chk { width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: var(--card); display: grid; place-items: center; flex: none; }
  .chk.new { animation: checkpop .45s var(--spring) both; }
  .taken-line { color: var(--muted); font-size: 14px; font-weight: 600; }
  .burst { position: absolute; left: 40px; bottom: 30px; width: 0; height: 0; pointer-events: none; }
  .bit { position: absolute; left: 0; top: 0; width: 9px; height: 5px; border-radius: 2px; animation: burst .85s cubic-bezier(.15, .7, .4, 1) both; }
  .chips { display: flex; gap: 8px; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

    display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%), linear-gradient(140deg, var(--gc), color-mix(in srgb, var(--gc) 70%, #000));
    box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 14px color-mix(in srgb, var(--gc) 30%, transparent); transition: transform .18s var(--spring); }
  .gc::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%; transform: rotate(18deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); pointer-events: none; }
  .gc-item:hover .gc, .gc-item:focus-visible .gc { transform: translateY(-3px) rotate(-1.5deg); }
  .gc-item:hover .gc::after { animation: shine 1.1s ease; }
  .gc-item:active .gc { transform: scale(.96); }
  .gc-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .gc-chip { width: 26px; height: 19px; border-radius: 4px; background: linear-gradient(135deg, #F3D98B, #C9A246); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
    background-image: linear-gradient(135deg, #F3D98B, #C9A246), linear-gradient(90deg, transparent 45%, rgba(0,0,0,.18) 45% 55%, transparent 55%); background-blend-mode: multiply; }
  .gc-emoji { font-size: 24px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .gc-name { font-weight: 800; font-size: 15px; line-height: 1.15; text-shadow: 0 1px 2px rgba(0,0,0,.3); overflow-wrap: anywhere; }
  .gc-name small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; margin-bottom: 1px; }
  .gc-badge { position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: var(--ok); box-shadow: 0 2px 6px rgba(0,0,0,.25); animation: checkpop .45s var(--spring) both; }
  .gc-cap { font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.3; min-height: 18px; }
  .gc-cap.mine { color: var(--ok); }
  .gc-item { position: relative; }
  .gc-item[hidden] { display: none; }
  .gc-pop .gc { animation-delay: var(--d, 0s); }
  a.btn.gc-find { text-decoration: none; color: var(--brand); margin-top: 6px; }
  .gc-item.removed .gc { filter: grayscale(.7); opacity: .75; }
  .gc-add { aspect-ratio: 1.586; width: 100%; border-radius: 13px; border: 2px dashed var(--line); background: var(--card); color: var(--brand);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .gc-add:hover { border-color: var(--brand); }
  .gc-add:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .gc-pop .gc { animation: gcIn .55s var(--spring) both; }
  @keyframes gcIn { 0% { opacity: 0; transform: rotateY(80deg) translateY(8px) scale(.9); } 100% { opacity: 1; transform: none; } }
  /* Picker */
  .gc-search { margin-bottom: 6px; }
  .gc-group { margin: 16px 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .gc-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .gc-pick .gc-item .gc { padding: 7px 9px; border-radius: 11px; }
  .gc-pick .gc-name { font-size: 12.5px; }
  .gc-pick .gc-name small { font-size: 8.5px; }
  .gc-pick .gc-chip { width: 20px; height: 15px; }
  .gc-pick .gc-emoji { font-size: 18px; }
  .gc-pick .gc-item[aria-pressed="true"] .gc { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--brand); }
  .gc-pick .gc-item[aria-pressed="true"] .gc-check { display: grid; }
  .gc-check { display: none; position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; place-items: center; background: #fff; color: var(--brand);
    box-shadow: 0 2px 6px rgba(0,0,0,.25); animation: checkpop .4s var(--spring) both; }
  .gc-pick-foot { position: sticky; bottom: -1px; background: var(--bg); padding: 12px 0 4px; margin-top: 14px; box-shadow: 0 -10px 12px -10px rgba(0,0,0,.15); }
  .gc-hero { max-width: 230px; margin: 4px auto 16px; }
  .gc-hero .gc { transform: rotate(-2deg); }
  .gc-hero .gc-name { font-size: 20px; }
  .gc-hero .gc-emoji { font-size: 34px; }
  .about { text-align: center; color: var(--faint); font-size: 13px; margin-top: 22px; }

  /* Bottom tabs: My list, Circles, [Add], Budget, Settings */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 96%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 6px max(4px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px); }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; }
  .tab { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0;
    font-size: 12px; font-weight: 600; border-radius: 12px; min-height: 52px; }
  .tab .ico { width: 54px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .2s ease; }
  .tab[aria-current="page"] { color: var(--brand); font-weight: 800; }
  .tab[aria-current="page"] .ico { background: var(--soft); animation: hop .55s ease .05s both; }
  .tab.add-tab { color: var(--brand); font-weight: 800; }
  .add-tab .fab { width: 60px; height: 60px; margin-top: -28px; border-radius: 50%; background: var(--brand); color: var(--brand-ink);
    border: 4px solid var(--bg); display: grid; place-items: center; box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 38%, transparent);
    transition: transform .2s var(--spring); }
  .add-tab:active .fab { transform: scale(.9) rotate(90deg); }

  /* Sheet */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; background: var(--bg); color: var(--ink);
    border-radius: 26px 26px 0 0; }
  dialog.sheet[open] { animation: sheetUp .42s cubic-bezier(.2, .9, .3, 1) both; }
  @media (min-width: 620px) { dialog.sheet { margin: auto; border-radius: 22px; } dialog.sheet[open] { animation: rise .3s ease both; } }
  dialog.sheet::backdrop { background: rgba(30, 15, 20, .45); animation: fade .25s ease both; }
  .sheet-in { padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  .sheet-close { position: absolute; top: 14px; right: 14px; font-size: 26px; line-height: 1; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.2; margin: 0 52px 16px 0; }
  .sheet-sec { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 20px; }
  .sheet-sec h4 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .sheet .what { color: var(--ink); font-weight: 700; font-size: 17px; margin: -6px 0 16px; }
  /* Add sheet: who it's for */
  fieldset.for { border: 0; padding: 0; margin: -4px 0 16px; min-width: 0; }
  fieldset.for legend { font-size: 16px; font-weight: 700; margin-bottom: 8px; padding: 0; }
  .for-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .for-chip { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--card);
    border-radius: 999px; padding: 5px 14px 5px 5px; min-height: 44px; font-weight: 700; font-size: 15px; cursor: pointer; transition: transform .14s var(--spring); }
  .for-chip:active { transform: scale(.97); }
  .for-chip input { position: absolute; opacity: 0; pointer-events: none; }
  .for-chip:has(input:checked) { border-color: var(--brand); background: var(--soft); color: var(--soft-ink); }
  .for-chip:has(input:focus-visible) { outline: 3px solid var(--brand); outline-offset: 2px; }
  .avatar.sm { width: 32px; height: 32px; font-size: 14px; }
  fieldset.for + form .what { margin-top: 0; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); translate: -50% 0; z-index: 30;
    background: var(--ink); color: var(--bg); border-radius: 16px; padding: 6px 8px 6px 16px; min-height: 52px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.25); width: max-content; max-width: calc(100% - 32px);
    animation: toastIn .35s cubic-bezier(.2, .9, .3, 1.2) both; }
  .toast svg { flex: none; color: #9FD3B4; }
  .toast button { border: 0; background: none; color: var(--gold); font-weight: 800; min-height: 44px; padding: 0 12px; border-radius: 10px; }
  .toast span { padding-right: 8px; }
  .offline { background: var(--panel); color: var(--muted); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .loading { color: var(--faint); text-align: center; padding: 50px 0; }
  .picker { display: grid; gap: 10px; margin-bottom: 14px; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow .input { flex: 1; min-width: 0; }
  .linkrow .btn { min-height: 54px; }
  .photo-box { margin-bottom: 16px; }
  .photo-btn { background: var(--soft); border-color: transparent; color: var(--soft-ink); min-height: 50px; }
  .photo-status { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .photo-status img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none; }
  .photo-status strong { color: var(--ink); }
  .picks { display: grid; gap: 8px; margin-top: 12px; }
  .pick { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
  .pick strong { font-size: 16px; }
  .pick small { color: var(--muted); font-size: 14px; }
  .pick em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--ok); }
  .pick .where { font-size: 13px; color: var(--muted); }
  .pick .where.found { color: var(--brand); font-weight: 600; }
  .pick.on { border-color: var(--brand); background: var(--soft); }
  .pick.none { color: var(--muted); font-weight: 600; text-align: center; display: block; }
  .fillmsg { display: block; color: var(--muted); font-size: 14px; margin-top: 7px; }
  .fillmsg.ok { color: var(--ok); font-weight: 600; }

  /* Budget */
  .pcard { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .pcard-head { width: 100%; border: 0; background: none; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .pcard-top { display: flex; align-items: center; gap: 12px; width: 100%; }
  .pcard-top .avatar { width: 44px; height: 44px; font-size: 19px; }
  .pcard-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pcard-who strong { font-size: 17px; }
  .pcard-who small { color: var(--muted); font-size: 14px; }
  .pill { font-size: 14px; font-weight: 700; padding: 5px 10px; border-radius: 10px; white-space: nowrap; background: var(--ok-soft); color: var(--ok); }
  .pill.over { background: var(--warn-soft); color: var(--warn); }
  .pill.none { background: var(--panel); color: var(--muted); }
  .pcard .chev-d { color: var(--muted); flex: none; transition: transform .3s var(--spring); }
  .pcard.is-open .chev-d { transform: rotate(180deg); }
  .meter { width: 100%; height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transform-origin: left; animation: fill 1s var(--spring) .25s both; }
  .meter.over i { background: var(--warn-bar); }
  .pcard-body { padding: 0 16px 16px; animation: open .32s cubic-bezier(.2, .8, .3, 1) both; }
  .buys { list-style: none; margin: 0 0 12px; padding: 0; }
  .buys li { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .buys small { display: block; color: var(--muted); font-size: 13px; }
  .buys b { font-family: var(--serif); font-weight: 600; color: var(--soft-ink); white-space: nowrap; }
  .pcard-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pcard-body .stack { margin: 12px 0; }
  .pcard-body .row { box-shadow: none; border: 1.5px solid var(--line); }

  /* Invite landing (/join/CODE): an envelope opens, the invite card rises, the family pops in. */
  .hero.tall .hero-in { text-align: center; padding: 4px 0 6px; }
  .hero.tall .squiggle { margin: 6px auto 0; }
  .hero.tall h1 { font-size: 38px; }
  .env { position: relative; width: 150px; height: 118px; margin: 4px auto 14px; }
  .env svg { position: absolute; inset: 0; width: 150px; height: 118px; overflow: visible; }
  .env .back-p { fill: #5E1530; } .env .front-p { fill: #8A2A47; } .env .flap { fill: #9C3554; transform-origin: 75px 46px; }
  .env .letter { fill: #FAF6F1; } .env .letter-b { fill: #7A1B36; } .env .letter-g { fill: var(--gold); }
  .env .letter-wrap { animation: letterUp .9s var(--spring) .75s both; }
  .env .flap { transform: scaleY(-1); } .env .letter-wrap { transform: translateY(-28px); }
  .env .flap { animation: flapOpen .55s cubic-bezier(.5, 0, .3, 1) .3s both; }
  .env .bits { position: absolute; left: 75px; top: 30px; width: 0; height: 0; }
  .env .bits .bit { animation-delay: 1.05s; }
  .env .bits { animation: appear .01s linear 1.05s both; }
  .ring .bits { visibility: hidden; }
  .slide-card.on .ring .bits { animation: appear .01s linear 1s both; }
  .env.sad svg { animation: wobble .7s ease .2s both; }
  .env.sad .flap { animation: none; transform: none; } .env.sad .letter-wrap { display: none; }
  .avs { display: flex; justify-content: center; margin: 2px 0 10px; }
  .avs .avatar { width: 52px; height: 52px; font-size: 22px; border: 3px solid var(--bg); margin-left: -12px; animation: avPop .5s var(--spring) both; }
  .avs .avatar:first-child { margin-left: 0; }
  .avs .avatar.more { background: var(--panel) !important; color: var(--muted); font-family: var(--sans); font-size: 16px; font-weight: 800; }
  .avs .avatar.you { outline: 3px dashed color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 1px; }
  .avs-cap { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 16px; animation: slide .45s ease 1.2s both; }
  .avs-cap strong { color: var(--ink); }
  .perks { display: grid; gap: 10px; margin: 0 0 22px; }
  .perk { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); font-weight: 600; }
  .perk .pi { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .perk small { display: block; font-weight: 500; color: var(--muted); font-size: 14px; }
  .shine { position: relative; overflow: hidden; }
  .shine::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); animation: shine 3.2s ease-in-out 1.6s infinite; }
  .add.big { min-height: 60px; font-size: 18px; border-radius: 18px; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; font-weight: 600; margin: 22px 0 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .name-preview { display: flex; justify-content: center; margin: 0 0 16px; }
  .name-preview .avatar { width: 72px; height: 72px; font-size: 32px; box-shadow: 0 8px 20px rgba(0, 0, 0, .15); transition: background-color .3s ease; }
  .name-preview .avatar.bump { animation: checkpop .4s var(--spring) both; }

  /* Invite ticket: the family code, link, share and QR. */
  .ticket { position: relative; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .ticket-top { position: relative; background: var(--hero); color: var(--hero-ink); padding: 20px 20px 24px; text-align: center; overflow: hidden; }
  .ticket-top .doodle { right: -60px; top: -40px; opacity: .16; }
  .ticket-top p { margin: 0; color: var(--hero-muted); font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .code-big { display: flex; justify-content: center; gap: 6px; margin: 10px 0 8px; font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; }
  .code-big span { display: inline-grid; place-items: center; width: 42px; height: 54px; border-radius: 10px; background: rgba(255, 255, 255, .1);
    animation: flipIn .5s var(--spring) both; }
  .ticket-top small { color: var(--hero-muted); font-size: 14px; overflow-wrap: anywhere; }
  .ticket-mid { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 18px; }
  .ticket-mid::before, .ticket-mid::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
  .ticket-mid::before { left: -30px; } .ticket-mid::after { right: -30px; }
  .sheet .ticket-mid::before, .sheet .ticket-mid::after { background: var(--bg); }
  .ticket-body { padding: 18px; }
  .ticket-actions { display: flex; gap: 10px; }
  .ticket-actions .btn { flex: 1; }
  .ticket .copied { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok); }
  .ticket .copied svg { animation: checkpop .45s var(--spring) both; }
  .ticket.wiggle { animation: wiggle .5s ease both; }
  .qr-btn { width: 100%; margin-top: 8px; }
  .qr { display: grid; place-items: center; padding: 6px 0 4px; }
  .qr svg { width: 210px; height: 210px; border-radius: 14px; animation: qrIn .7s cubic-bezier(.2, .8, .3, 1) both; }
  .qr small { color: var(--muted); font-size: 14px; margin-top: 8px; text-align: center; }

  /* Welcome tour: a full-screen dialog of swipeable cards, each with a little animated scene. */
  dialog.tour { border: 0; padding: 0; margin: 0; width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; background: var(--bg); color: var(--ink); }
  dialog.tour[open] { display: flex; flex-direction: column; animation: fade .3s ease both; }
  dialog.tour::backdrop { background: var(--bg); }
  .tour-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 0; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); transition: width .35s var(--spring), background-color .3s ease; }
  .dots i.on { width: 26px; background: var(--brand); }
  .track { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .slide-card { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 10px 26px; max-width: 100%; overflow-y: auto; }
  .slide-card > * { max-width: 460px; }
  .slide-card h2 { font-size: 30px; margin: 22px 0 10px; }
  .slide-card p { color: var(--muted); margin: 0; font-size: 17px; }
  .slide-card .opacity-in { opacity: 1; }
  .slide-card.on h2 { animation: slide .5s ease .1s both; }
  .slide-card.on p { animation: slide .5s ease .2s both; }
  .tour-foot { max-width: 560px; width: 100%; margin: 0 auto; padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .scene { position: relative; width: 260px; height: 220px; display: grid; place-items: center; }
  .scene > :not(.blob) { position: relative; }
  .scene .blob { position: absolute; inset: 14px 6px; border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; background: var(--soft); }
  .slide-card.on .scene .blob { animation: blob 6s ease-in-out infinite; }
  /* Scene: welcome (you join the circle) */
  .ring { position: relative; width: 200px; height: 200px; }
  .ring .avatar { position: absolute; width: 52px; height: 52px; font-size: 22px; border: 3px solid var(--bg); }
  .ring .me { left: 64px; top: 64px; width: 72px; height: 72px; font-size: 30px; }
  .slide-card.on .ring .avatar { animation: avPop .5s var(--spring) both; }
  .slide-card.on .ring .me { animation: meDrop .8s var(--spring) .45s both; }
  .ring .bits { position: absolute; left: 100px; top: 100px; width: 0; height: 0; }
  .ring .bit { animation: none; opacity: 0; }
  .slide-card.on .ring .bit { animation: burst .9s cubic-bezier(.15, .7, .4, 1) 1s both; }
  /* Scene: add a wish (a link turns into a card) */
  .mock { position: relative; width: 230px; background: var(--card); border-radius: 18px; box-shadow: 0 10px 30px rgba(74, 14, 34, .14); padding: 14px; text-align: left; }
  .mock .ln { height: 40px; border-radius: 10px; border: 1.5px solid var(--line); display: flex; align-items: center; padding: 0 10px; font-size: 13px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .mock .ln b { color: var(--ink); font-weight: 600; display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; max-width: 100%; }
  .slide-card.on .mock .ln b { animation: typing 1.2s steps(22) .4s both; }
  .mock .res { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .mock .res .tile { width: 46px; height: 46px; font-size: 20px; border-radius: 12px; }
  .mock .res strong { display: block; font-size: 15px; } .mock .res .price-tag { margin-top: 4px; height: 24px; font-size: 13px; }
  .slide-card.on .mock .res { animation: drop .7s cubic-bezier(.2, .8, .3, 1) 1.7s both; }
  .slide-card.on .mock .res .price-tag { animation: swing 1s ease 2.2s both; }
  .mock .sparkle { position: absolute; right: -10px; top: -12px; color: var(--gold); }
  .slide-card.on .mock .sparkle { animation: twinkle 1.6s ease 2s infinite; }
  /* Scene: surprises (family sees the check, you don't) */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 250px; }
  .mini-card { background: var(--card); border-radius: 14px; box-shadow: 0 8px 22px rgba(74, 14, 34, .12); padding: 12px 10px; display: grid; justify-items: center; gap: 8px; }
  .mini-card small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .mini-card .tile { width: 48px; height: 48px; font-size: 21px; }
  .mini-card .chk { width: 30px; height: 30px; }
  .mini-card .eye { width: 30px; height: 30px; border-radius: 50%; background: var(--panel); color: var(--muted); display: grid; place-items: center; }
  .slide-card.on .pair .chk { animation: checkpop .5s var(--spring) .6s both; }
  .slide-card.on .pair .eye { animation: checkpop .5s var(--spring) 1.1s both; }
  .slide-card.on .pair .mini-card:last-child { animation: peek 2.8s ease 1.6s infinite; }
  /* Scene: private notes (a lock snaps shut, a budget fills) */
  .note { position: relative; width: 210px; background: var(--card); border-radius: 18px; box-shadow: 0 10px 30px rgba(74, 14, 34, .14); padding: 16px; text-align: left; }
  .note .l { height: 10px; border-radius: 5px; background: var(--panel); margin-bottom: 9px; }
  .note .meter { margin-top: 14px; }
  .slide-card.on .note .meter i { animation: fill 1.1s var(--spring) .7s both; }
  .note .lockbadge { position: absolute; right: -14px; top: -16px; }
  .lockbadge { width: 50px; height: 50px; border-radius: 50%; background: var(--gold); color: #4A2A05;
    display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0, 0, 0, .18); }
  .lockbadge .shackle { transform-origin: 16px 9px; }
  .slide-card.on .lockbadge { animation: checkpop .5s var(--spring) .3s both; }
  .slide-card.on .lockbadge .shackle { animation: shackle .6s var(--spring) 1s both; }
  /* Scene: PIN */
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 4px 0 0; }
  .pin-dots i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--brand); transition: background-color .15s ease; }
  .pin-dots i.on { background: var(--brand); animation: checkpop .3s var(--spring) both; }
  .pin-dots.done i { background: var(--ok); border-color: var(--ok); }
  .pin-dots.shake { animation: wobble .5s ease both; }
  .tour-pin { margin: 20px auto 0; max-width: 220px; }
  .tour-pin .input { text-align: center; }
  /* Scene: home screen */
  .phone { position: relative; width: 150px; height: 210px; border-radius: 26px; border: 4px solid var(--ink); background: var(--panel); padding: 22px 14px; }
  .phone .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .phone .app { aspect-ratio: 1; border-radius: 10px; background: var(--line); }
  .phone .app.ours { background: #82263C; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(130, 38, 60, .4); }
  .slide-card.on .phone .app.ours { animation: appIn .9s var(--spring) .5s both; }
  .steps-mini { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; text-align: left; }
  .steps-mini li { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 15px; font-weight: 600; }
  .steps-mini li b { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--soft-ink); display: grid; place-items: center; font-size: 14px; flex: none; }
  .tour-invite { width: 100%; margin-top: 18px; text-align: left; }

  /* Install nudge on My list, and the how-to sheet */
  .install-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 14px 10px; margin-bottom: 18px;
    border: 1.5px solid color-mix(in srgb, var(--brand) 22%, var(--line)); }
  .install-top { display: flex; gap: 12px; align-items: center; }
  .install-icon { width: 48px; height: 48px; border-radius: 12px; flex: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .install-top strong { display: block; font-size: 17px; }
  .install-top span { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .install-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .install-steps { counter-reset: st; list-style: none; margin: 4px 0 16px; padding: 0; display: grid; gap: 10px; }
  .install-steps li { counter-increment: st; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 14px; padding: 12px 14px;
    box-shadow: var(--shadow); font-size: 16px; line-height: 1.45; color: var(--ink); }
  .install-steps li b { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--soft-ink); display: grid; place-items: center;
    font-size: 14px; flex: none; margin-top: -1px; }
  .install-steps li b::before { content: counter(st); }
  .ico-in { display: inline-block; vertical-align: -3px; color: #0A84FF; margin: 0 1px; }
  .code-inline { letter-spacing: .08em; white-space: nowrap; }

  /* Getting started on My list: add 3 wishes. */
  .starter { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .starter strong { display: block; font-size: 17px; }
  .starter p { margin: 2px 0 12px; color: var(--muted); font-size: 15px; }
  .segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .segs i { height: 10px; border-radius: 5px; background: var(--panel); overflow: hidden; position: relative; }
  .segs i.on::after { content: ""; position: absolute; inset: 0; border-radius: 5px; background: var(--gold); transform-origin: left; }
  .segs i.on.new::after { animation: fill .8s var(--spring) .2s both; }
  .starter.done { background: var(--gold-soft); text-align: center; position: relative; }
  .starter.done strong { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--gold-ink); }
  .idea-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 18px; }
  .idea-chips .chip { animation: avPop .45s var(--spring) both; }

  /* Big celebration confetti, anywhere on screen. */
  .party { position: fixed; width: 0; height: 0; z-index: 40; pointer-events: none; }
  .party .bit { width: 10px; height: 6px; animation: burst 1.2s cubic-bezier(.15, .7, .4, 1) both; }

  /* Motion. Every animation marks a real moment; all of it turns off with Reduce Motion. */
  .slide { animation: slide .45s cubic-bezier(.2, .8, .3, 1) both; }
  .drop { animation: drop .6s cubic-bezier(.2, .8, .3, 1) both; }

  @keyframes slide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-28px) scale(.96); } 55% { opacity: 1; transform: translateY(5px) scale(1.01); } 80% { transform: translateY(-2px); } 100% { opacity: 1; transform: none; } }
  @keyframes swing { 0% { transform: rotate(-3deg); } 25% { transform: rotate(9deg); } 50% { transform: rotate(-7deg); } 75% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }
  @keyframes pop { 0% { transform: scale(1) rotate(-6deg); } 30% { transform: scale(1.5) rotate(-18deg); } 60% { transform: scale(.9) rotate(4deg); } 100% { transform: scale(1) rotate(-6deg); } }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
  @keyframes burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.5); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); } }
  @keyframes checkpop { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes hop { 0%, 100% { transform: none; } 35% { transform: translateY(-6px); } 65% { transform: translateY(1px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .5; } }
  @keyframes lid { 0% { transform: none; } 45% { transform: translateY(-26px) rotate(-20deg); } 100% { transform: translateY(-16px) rotate(-14deg); } }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes open { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes sheetUp { 0% { transform: translateY(100%); } 70% { transform: translateY(-6px); } 100% { transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(20px) scale(.96); } 100% { opacity: 1; transform: none; } }
  @keyframes appear { from { visibility: hidden; } to { visibility: visible; } }
  @keyframes flapOpen { from { transform: none; } to { transform: scaleY(-1); } }
  @keyframes letterUp { 0% { transform: translateY(60px); } 70% { transform: translateY(-34px); } 100% { transform: translateY(-28px); } }
  @keyframes wobble { 0%, 100% { transform: none; } 20% { transform: rotate(-8deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
  @keyframes avPop { 0% { opacity: 0; transform: scale(.3) translateY(10px); } 100% { opacity: 1; transform: none; } }
  @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }
  @keyframes flipIn { 0% { opacity: 0; transform: rotateX(90deg) translateY(-6px); } 100% { opacity: 1; transform: none; } }
  @keyframes wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.2deg) scale(1.01); } 75% { transform: rotate(-.6deg); } }
  @keyframes qrIn { 0% { clip-path: circle(0% at 50% 50%); transform: scale(.85) rotate(-4deg); } 100% { clip-path: circle(75% at 50% 50%); transform: none; } }
  @keyframes blob { 0%, 100% { border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; transform: rotate(0); } 50% { border-radius: 54% 46% 46% 54% / 46% 54% 48% 52%; transform: rotate(4deg); } }
  @keyframes meDrop { 0% { opacity: 0; transform: translateY(-120px) scale(.6); } 60% { opacity: 1; transform: translateY(8px) scale(1.08); } 100% { opacity: 1; transform: none; } }
  @keyframes typing { from { max-width: 0; } to { max-width: 100%; } }

  @keyframes peek { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-4px) rotate(-2deg); } 90% { transform: translateY(0) rotate(2deg); } }

  @keyframes appIn { 0% { opacity: 0; transform: translateY(-90px) scale(1.6) rotate(-20deg); } 60% { opacity: 1; transform: translateY(4px) scale(.95) rotate(4deg); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after, ::backdrop { animation: none !important; transition: none !important; } }
  :root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after, :root[data-motion="off"] ::backdrop { animation: none !important; transition: none !important; }
</style>

const money = (c) => (c == null ? "" : (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: c % 100 ? 2 : 0 }));

const reduceMotion = () => document.documentElement.dataset.motion === "off" || matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON_RULES = [

function countUp(el, fromCents, toCents) {
  if (!el) return;
  if (reduceMotion() || fromCents === toCents) { el.textContent = money(toCents); return; }
  const t0 = performance.now(), d = 900;
  const step = (t) => {
    const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3);
    el.textContent = money(Math.round((fromCents + (toCents - fromCents) * e) / 100) * 100);

}

    const data = {};
    for (const el of form.elements) {
      if (!el.name || (el.type === "radio" && !el.checked)) continue;
      data[el.name] = el.type === "checkbox" ? el.checked : el.value;

  if (occasionsOf(personId).length < 2 || !code) return "";
  const o = occFind(personId, code);
  return o ? ` for ${o.christmas && !o.birthday ? "Christmas" : `their ${occName(o)}`}` : "";
}
// Two-button picker for which occasion a gift is for. Empty when the person has just one occasion.
function occPicker(personId, current) {
  const occ = occasionsOf(personId);
  if (occ.length < 2) return "";
  const pick = occ.some((o) => o.code === current) ? current : occ[0].code;
  return `<div class="field"><span>It's for</span>
    <div class="seg two" role="radiogroup" aria-label="Which occasion" data-occ>${occ.map((o) =>
      `<button type="button" role="radio" data-v="${o.code}" aria-checked="${o.code === pick}">${o.christmas && !o.birthday ? "Christmas" : o.christmas ? "Birthday & Christmas" : "Birthday"} · ${occDay(o)}</button>`).join("")}</div></div>`;
}
function wireOccPicker(root) {
  const el = root.querySelector("[data-occ]");
  if (el) wireSeg(el, () => {});
  return () => el?.querySelector('[aria-checked="true"]')?.dataset.v;
}

async function refreshMe() {
  const data = await load("me");
  state.me = data.me;
  state.groups = data.groups;
  state.households = data.households || {};
  for (const g of data.groups) notePhotos(g.members);
  notePhotos([data.me]);
  state.today = data.today;
}

async function render() {
  const signedIn = !!getToken();
  $("#tabs").hidden = !signedIn;
  if (!signedIn) return renderWelcome(invite ? "invite" : "code");
  $("#hero").classList.remove("tall");

  document.querySelectorAll(".tab[data-tab]").forEach((b) => b.setAttribute("aria-current", !state.person && b.dataset.tab === state.tab ? "page" : "false"));
  if (state.person) $('.tab[data-tab="family"]').setAttribute("aria-current", "page");
  try {
    // Stale: refetch, but keep the old copy in place meanwhile so a tap during the reload still knows who you are.
    if (!state.me || state.stale) { state.stale = false; await refreshMe(); }
    // Your own list always opens on My list, which is the only place "Just me" wishes show.
    if (state.person && state.person === state.me?.id) { state.person = null; state.tab = "mine"; }
    if (state.person) await renderPerson(state.person);
    else if (state.tab === "family") await renderFamily();
    else if (state.tab === "notes") await renderTracker();
    else if (state.tab === "settings") await renderSettings();
    else await renderMine();
    if (!state.me.onboarded && !state.toured) openTour();
  } catch (e) {
    if (!getToken()) return;
    $("#view").innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn" type="button" id="retry">Try again</button>`;
    $("#retry").onclick = () => { state.stale = true; render(); };
  }
  state.flash = state.burst = state.pop = state.gcNew = null;
  fetchImages($("#view"));
}

// Invite links: /join/CODE?from=memberId (older links: /?code=CODE). The path stays until you've joined,
// so a refresh keeps the invite.
function readInvite() {
  const m = location.pathname.match(/^\/join\/([A-Za-z0-9]+)/);
  const q = new URLSearchParams(location.search);
  const code = (m?.[1] || q.get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  return code ? { code, from: q.get("from") || "" } : null;
}

async function renderWelcome(step = "code", info = {}) {

        ${info.members.map((m, i) => `<button class="member slide" style="animation-delay:${0.1 + i * 0.05}s" type="button" data-id="${esc(m.id)}">
            ${avatar(m.name, m.id)}

    });
  }
}

// Confetti from a point on screen (default: the middle). Skipped with Reduce Motion.
function party(x = innerWidth / 2, y = innerHeight / 2.6, count = 34) {
  if (reduceMotion()) return;
  const colors = ["#7A1B36", "#D9A94A", "#2F6B4F", "#E8A5B5", "#33407A"];
  const el = document.createElement("div");
  el.className = "party";
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.innerHTML = Array.from({ length: count }, (_, i) => {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.4, d = 90 + Math.random() * 140;
    return `<i class="bit" style="background:${colors[i % colors.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 60}px;--r:${Math.round(Math.random() * 720 - 360)}deg;animation-delay:${Math.random() * 0.12}s"></i>`;
  }).join("");
  // Open dialogs sit above everything else, so the confetti goes inside them.
  (tourEl.open ? tourEl : sheet.open ? sheet : document.body).appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ---------- install: nudge people to put Wishlist on their home screen ----------
// A card at the top of My list, only when installing is actually possible from where you are:
// - "prompt": Chrome, Edge and Samsung Internet hand us their own install prompt (it never fires once installed).
// - "ios": Safari on iPhone and iPad has no prompt, so we show the taps. "ios-other": Chrome, Edge, Firefox on iOS.
// - "inapp": opened inside Facebook, Instagram, Gmail and so on, which can't install. We say how to open a real browser.
// "Not now" snoozes it for 7 days, then 30, then stops. Settings > The app always has it.
// iPhone home screen apps keep their own storage, so we can't see from Safari that it's installed:
// the how-to sheet ends with "I've added it", which turns the card off for good.
const INSTALL_KEY = "wishlist-install";
function readInstall() { try { return JSON.parse(localStorage.getItem(INSTALL_KEY)) || {}; } catch { return {}; } }
function saveInstall(v) { try { localStorage.setItem(INSTALL_KEY, JSON.stringify(v)); } catch {} }
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isAppleMobile = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function installWay() {
  const ua = navigator.userAgent;
  if (isStandalone()) return null;
  if (/FBAN|FBAV|FB_IAB|Instagram|Snapchat|Pinterest|LinkedInApp|musical_ly|TikTok|Line\/|GSA\/|; wv\)/i.test(ua)) return "inapp";
  if (installPrompt) return "prompt";
  if (isAppleMobile()) return /CriOS|EdgiOS|FxiOS/.test(ua) ? "ios-other" : "ios";
  return null;
}
function installDue() {
  const st = readInstall();
  return !!installWay() && !st.done && !st.off && Date.now() > (st.until || 0) && !!state.me?.onboarded && !state.toured;
}

const SHARE_IOS = '<svg class="ico-in" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';

const DOTS = '<svg class="ico-in" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-label="More"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
const KEBAB = '<svg class="ico-in" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-label="Menu"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';

function paintInstallCard() {
  const slot = $("#installSlot");
  if (!slot) return;
  if (!installDue()) { slot.innerHTML = ""; return; }
  const way = installWay();
  const sub = way === "prompt" ? "Open it in one tap, full screen, like any other app."
    : way === "inapp" ? `This page is open inside another app. Open it in ${isAppleMobile() ? "Safari" : "Chrome"} to add it to your home screen.`
    : "Put it on your home screen so it opens in one tap. It takes a few seconds.";
  slot.innerHTML = `<div class="install-card slide" id="installCard">
    <div class="install-top"><img class="install-icon" src="/icons/icon-192.png" alt="">
      <div><strong>Get the Wishlist app</strong><span>${esc(sub)}</span></div></div>
    <div class="install-actions">
      <button class="btn quiet small" type="button" id="installLater">Not now</button>
      <button class="btn primary small" type="button" id="installGo">${way === "prompt" ? "Install" : "Show me how"}</button>
    </div></div>`;
  $("#installGo", slot).onclick = () => startInstall();
  $("#installLater", slot).onclick = () => {
    const st = readInstall(), snoozes = (st.snoozes || 0) + 1;
    saveInstall({ ...st, snoozes, until: Date.now() + (snoozes === 1 ? 7 : 30) * 864e5, off: snoozes >= 3 });
    slot.innerHTML = "";
    toast(snoozes >= 3 ? "Okay, I'll stop asking. It's in Settings anytime." : "No problem. It's also in Settings.");
  };
}

async function startInstall() {
  const way = installWay();
  if (way === "prompt") {
    try {
      installPrompt.prompt();
      const r = await installPrompt.userChoice;
      installPrompt = null;
      if (r.outcome === "accepted") { saveInstall({ ...readInstall(), done: true }); $("#installCard")?.remove(); party(); }
      else paintInstallCard();
    } catch {}
    return;
  }
  installHowTo(way);
}

// Step-by-step taps for browsers with no install prompt, with the same icons the phone shows.
function installHowTo(way) {
  const apple = isAppleMobile();
  const code = group()?.code;
  const ua = navigator.userAgent;
  const step = (html) => `<li><b></b><span>${html}</span></li>`;
  const signIn = apple && code ? step(`Open Wishlist from your home screen and sign in once: invite code <strong class="code-inline">${esc(code)}</strong>, then tap your name.`) : "";

function ringScene() {

  const around = ppl.map((m, i) => {

    return avatar(m.name, m.id).replace('style="', `style="${pos}`).replace('" aria-hidden', `${real.length ? "" : ";background:var(--line);color:var(--muted)"}" aria-hidden`);
  }).join("");
  return `<div class="scene"><span class="blob"></span><div class="ring">${around}${avatar(state.me.name, state.me.id).replace('class="avatar"', 'class="avatar me"')}<span class="bits">${CONFETTI}</span></div></div>`;

  tourEl.innerHTML = `
    <div class="tour-top"><div class="dots" aria-hidden="true">${slides.map(() => "<i></i>").join("")}</div>

    <div class="track" id="track">${slides.map((sl, i) => `<section class="slide-card" data-i="${i}" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}">

  const track = $("#track", tourEl), next = $("#tourNext", tourEl), cards = [...tourEl.querySelectorAll(".slide-card")], dots = [...tourEl.querySelectorAll(".dots i")];

// ---------- autofill from a link ----------
function linkField(value) {
  return `<label class="field"><span>Link</span>
    <div class="linkrow"><input class="input" name="url" type="url" inputmode="url" value="${esc(value)}" placeholder="Paste a link to fill in the rest">

    <small class="fillmsg" hidden></small></label>
    <div class="photo-box">
      <input type="file" accept="image/*" data-photo hidden>
      <button class="btn wide photo-btn" type="button" data-photo-btn>${CAMERA} Or snap a photo of it</button>
      <div class="photo-status" hidden></div>
      <div class="picks" hidden></div>
    </div>`;
}

// Shrink the photo on the phone before sending (faster, cheaper). Returns a JPEG data URL.
function shrinkPhoto(file, maxSide = 1024, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL("image/jpeg", quality), preview: c.toDataURL("image/jpeg", 0.6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try another one.")); };
    img.src = url;
  });
}

// Profile photo: center crop to a small square JPEG (about 10 to 20 KB).
function squarePhoto(file, side = 256) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement("canvas");
      c.width = c.height = Math.min(side, s);
      c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try another one.")); };
    img.src = url;
  });
}

const range = (lo, hi) => (lo && hi && lo !== hi ? `Usually $${lo} to $${hi}` : lo || hi ? `Usually about $${lo || hi}` : "");
const where = (x) => (x.link === "product" ? `At ${x.store}${x.price ? ` for ${money(Math.round(x.price * 100))}` : ""}` : `Search ${x.store}`);

// Photo: Gemini suggests what it might be; tapping a suggestion fills the name, a store link, and the price when known.
function wirePhoto(form) {
  const input = form.querySelector("[data-photo]"), btn = form.querySelector("[data-photo-btn]");
  const status = form.querySelector(".photo-status"), picks = form.querySelector(".picks");
  btn.addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const file = input.files[0];
    input.value = "";
    if (!file) return;
    picks.hidden = true;
    btn.disabled = true;
    try {
      const photo = await shrinkPhoto(file);
      status.innerHTML = `<img src="${photo.preview}" alt=""><span>Looking at your photo and checking stores...</span>`;
      status.hidden = false;
      const { suggestions } = await api("identify", { image: photo.data });
      if (!suggestions.length) {
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>Couldn't tell what this is. Try a closer photo, or type it in above.</span>`;
        return;
      }
      status.innerHTML = `<img src="${photo.preview}" alt=""><span><strong>Is it one of these?</strong> Tap the closest match.</span>`;
      picks.innerHTML = suggestions.map((x, i) => `<button class="pick" type="button" data-i="${i}">
          <strong>${esc(x.title)}</strong>${x.detail ? `<small>${esc(x.detail)}</small>` : ""}${!x.price && range(x.price_low, x.price_high) ? `<em>${esc(range(x.price_low, x.price_high))}</em>` : ""}<span class="where${x.link === "product" ? " found" : ""}">${esc(where(x))}</span>
        </button>`).join("") + '<button class="pick none" type="button" data-none>None of these</button>';
      picks.hidden = false;
      // Remember what a tap filled in, so tapping a different match replaces it but never overwrites your typing.
      let filled = { url: "", price: "" };
      picks.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
        const x = suggestions[+b.dataset.i];
        const { url, price } = form.elements;
        form.elements.title.value = x.title;
        if (!url.value.trim() || url.value === filled.url) url.value = filled.url = x.url || "";
        if (price && (!price.value.trim() || price.value === filled.price)) price.value = filled.price = x.price ? String(x.price) : "";
        picks.querySelectorAll(".pick").forEach((p) => p.classList.toggle("on", p === b));
        const note = x.link === "product"
          ? `<strong>Added it.</strong> The link goes to ${esc(x.store)}${x.price ? ", and the price is filled in" : ""}. Paste a different store link to change it.`
          : `<strong>Added the name.</strong> We couldn't confirm a product page, so the link searches ${esc(x.store)}. Paste a store link instead and tap Fill to get the exact price.`;
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>${note}</span>`;
        form.elements.title.scrollIntoView({ behavior: "smooth", block: "center" });
      }));
      picks.querySelector("[data-none]").onclick = () => {
        picks.hidden = true;
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>No problem. Type the name above, or try another photo.</span>`;
        form.elements.title.focus();
      };
    } catch (e) {
      if (e.detail) console.warn("Photo search:", e.detail);
      status.innerHTML = `<span>${esc(e.message)}</span>`;
      status.hidden = false;
    } finally { btn.disabled = false; }
  });
}

// Share buttons in store apps paste text plus a link ("Check out X! https://...").
// Split it into the link and the leftover words. Must match sharedUrl() in src/wishlist.js.
function splitShared(raw) {
  const s = String(raw || "").trim();
  if (/^https?:\/\/\S+$/i.test(s)) return { url: s, hint: "" };
  const m = s.match(/https?:\/\/[^\s<>"']+/i) || s.match(/(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s<>"']*/i);
  if (!m) return { url: s, hint: "" };
  const url = m[0].replace(/[).,!?;:'"\]]+$/, "");
  return { url, hint: shareHint(s.slice(0, m.index) + " " + s.slice(m.index + m[0].length)) };
}

// Turn "Check out Lip Oil on Ulta Beauty!" into "Lip Oil". Only used when the page gives no name.
function shareHint(t) {
  t = t.replace(/\s+/g, " ").trim()
    .replace(/^(hey[,!]?\s*)?(check (this|it) out|check out( this( product| item)?)?|look (at )?(what|this)( i found)?|i found this|found this|shop( now)?|buy( now)?)\s*(on|at|from)?\s*[:!.\-]*\s*/i, "")
    .replace(/(\s+(on|at|from|via)\s+|\s+[|\-–]\s+)[\w&'. ]{2,30}[!.]*$/i, (x) => (/\b(app|beauty|store|shop|amazon|target|walmart|sephora|ulta|etsy)\b/i.test(x) ? "" : x))
    .replace(/^[\w&'. ]{2,30}:\s*/, (x) => (/\b(app|beauty|store|shop|amazon|target|walmart|sephora|ulta|etsy)\b/i.test(x) ? "" : x))
    .replace(/^["'\s:!.\-([]+|["'\s:!.\-([]+$/g, "");
  return t.length >= 3 && t.length <= 150 && /[a-z]/i.test(t) ? t : "";
}

// The photo autofill found, if the link box still holds that link.
const imageFor = (form) => (form.dataset.image && form.dataset.imageFor === form.elements.url.value.trim() ? form.dataset.image : undefined);

// Pasting a link (or tapping Fill) looks up the product and fills the empty name and price fields.
function wireAutofill(form) {
  wirePhoto(form);
  const url = form.elements.url, btn = form.querySelector("[data-fill]"), msg = form.querySelector(".fillmsg");
  const title = form.elements.title, price = form.elements.price;
  const say = (t, ok, img) => {
    msg.textContent = t;
    if (img) { const el = document.createElement("img"); el.src = img; el.alt = ""; el.referrerPolicy = "no-referrer"; el.onerror = () => el.remove(); msg.prepend(el); }
    msg.hidden = !t; msg.classList.toggle("ok", !!ok); msg.classList.toggle("has-img", !!img);
  };
  let busy = false, hint = "";
  // Keep just the link in the box; remember the shared words as a backup name.
  const tidy = (raw) => {
    const s = splitShared(raw);
    if (s.url !== url.value) url.value = s.url;
    if (s.hint) hint = s.hint;
  };
  async function fill(force) {
    tidy(url.value);
    const v = url.value.trim();
    if (!v || busy) return;
    busy = true; btn.disabled = true; say("Looking it up...");
    try {
      const r = await api("preview", { url: v }).catch((e) => {
        if (!hint) throw e;
        return { site: "the link" };
      });
      if (!r.title && hint) r.title = hint;
      if (r.image) { form.dataset.image = r.image; form.dataset.imageFor = v; } else { delete form.dataset.image; }
      let filled = [];
      if (r.title && (force || !title.value.trim())) { title.value = r.title; filled.push("name"); }
      if (r.price != null && (force || !price.value.trim())) { price.value = String(r.price); filled.push("price"); }
      if (filled.includes("price")) { const d = form.querySelector("details.more"); if (d) d.open = true; }
      if (r.image) filled.push("photo");
      const list = filled.length > 1 ? `${filled.slice(0, -1).join(", ")} and ${filled.at(-1)}` : filled[0];
      say(filled.length ? `Filled in the ${list} from ${r.site}. Check it looks right.`
        : r.title || r.price != null ? "Already filled in. Tap Fill to replace with the link's details."
        : `Couldn't read details from ${r.site}. Type them in instead.`, filled.length > 0, r.image);
    } catch (e) { say(e.message); }
    finally { busy = false; btn.disabled = false; }
  }
  btn.addEventListener("click", () => fill(true));
  // Read the raw clipboard: a type=url box drops line breaks, which would glue the words onto the link.
  url.addEventListener("paste", (e) => {
    const raw = e.clipboardData?.getData("text");
    if (raw && splitShared(raw).url !== raw.trim()) { e.preventDefault(); hint = ""; tidy(raw); }
    else hint = "";
    setTimeout(() => fill(false), 0);
  });
  url.addEventListener("blur", () => tidy(url.value));
}

// Native confirm() is fine here: one tap, rare action.
const confirmRemove = () => window.confirm("Remove this from your list?");

// ---------- family ----------
// "2 new" on a Family row: wishes added since you last opened that person's list (remembered on this device).
const SEEN_KEY = "wishlist-seen";
function readSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch { return {}; } }
function markSeen(id, count) { try { const s = readSeen(); s[id] = count; localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch {} }
function newBadge(m) {
  const seen = readSeen()[m.id];
  const n = seen == null ? 0 : (m.itemCount || 0) - seen;
  return n > 0 ? `<span class="new-badge">${n} new</span>` : "";
}

async function renderFamily() {

        const p = plan.get(m.id);

  };
  // In more than one family: a section per family, each with its own Invite. Someone in two of them shows in both.
  const sections = state.groups.map((fam, n) => {
