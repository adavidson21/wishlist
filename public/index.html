<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishlist</title>
<meta name="description" content="Family wish lists: share what you'd like, mark what you bought, keep private gift notes.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1517" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/theme.js"></script>
<style>
  /* Friendly, low-tech look for the whole family: Figtree body, Gelasio headings, big tap targets,
     soft cards, sentence-case labels. Burgundy for actions, evergreen for "bought". */
  :root {
    --bg: #FBF6F0; --card: #FFFFFF; --panel: #F3ECE3; --ink: #2B2326; --muted: #6E6266; --faint: #A3989B;
    --line: #EADFD3; --brand: #8E2440; --brand-ink: #FFFFFF; --soft: #F8E8EC; --soft-ink: #7A1F37;
    --ok: #2F6A55; --ok-soft: #E3F1EA; --err-bg: #FCECEA; --err: #A32A22;
    --shadow: 0 1px 2px rgba(60, 30, 20, .05), 0 4px 14px rgba(60, 30, 20, .06);
    --r: 16px;
    --serif: Gelasio, Georgia, "Times New Roman", serif;
    --sans: Figtree, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
      --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
      --ok: #8FD0B4; --ok-soft: #1E3029; --err-bg: #3A1F1D; --err: #F2BDB7; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1A1517; --card: #241D20; --panel: #2E2629; --ink: #F3ECEE; --muted: #B6A9AD; --faint: #85787C;
    --line: #3A3034; --brand: #E59AAE; --brand-ink: #2A0E17; --soft: #3A2129; --soft-ink: #F0B5C4;
    --ok: #8FD0B4; --ok-soft: #1E3029; --err-bg: #3A1F1D; --err: #F2BDB7; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font: inherit; color: var(--ink); }
  [hidden] { display: none !important; }
  main { max-width: 560px; margin: 0 auto;
    padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 110px);
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

  header.top { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; padding-right: 50px; }
  @media (min-width: 720px) { header.top { padding-right: 0; } }
  .logo { width: 44px; height: 44px; border-radius: 12px; flex: none; display: block; }
  .name { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .group-name { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .spacer { flex: 1; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    display: grid; place-items: center; flex: none; padding: 0; }
  .iconbtn:active, .btn:active, .member:active, .row[role="button"]:active { transform: scale(.98); }
  :is(.iconbtn, .btn, .tab, .row, .member, .add):focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  h2 { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .label { margin: 30px 0 12px; font-size: 18px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .label .count { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--panel); border-radius: 999px; padding: 1px 9px; }
  .private { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--soft-ink); background: var(--soft);
    border-radius: 999px; padding: 4px 11px; white-space: nowrap; }

  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; min-height: 48px; padding: 10px 18px; font-weight: 700; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.wide { width: 100%; }
  .btn.small { min-height: 40px; padding: 7px 14px; font-size: 15px; border-radius: 10px; }
  .btn.quiet { border-color: transparent; background: none; color: var(--brand); min-height: 40px; }
  .btn.danger { color: var(--err); }
  .btn[disabled] { opacity: .55; pointer-events: none; }
  .add { width: 100%; border: 0; background: var(--brand); color: var(--brand-ink); border-radius: var(--r); min-height: 56px; padding: 14px;
    font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow); }
  .add.soft { background: var(--soft); color: var(--soft-ink); box-shadow: none; min-height: 48px; font-size: 16px; }

  .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 12px; }

  /* Item rows */
  .row { width: 100%; text-align: left; background: var(--card); border: 0; border-radius: var(--r); padding: 16px 18px; display: block; box-shadow: var(--shadow); }
  .row-top { display: flex; align-items: flex-start; gap: 12px; }
  .row-title { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
  .price { font-weight: 700; color: var(--ink); white-space: nowrap; background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 15px; }
  .row-notes { color: var(--muted); font-size: 15px; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row-foot:empty { display: none; }
  .tag { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: var(--soft); color: var(--soft-ink); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.muted { background: var(--panel); color: var(--muted); }
  .open { font-size: 15px; font-weight: 700; color: var(--brand); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
  .row.done { background: color-mix(in srgb, var(--card) 60%, var(--bg)); box-shadow: none; border: 1.5px dashed var(--line); }
  .row.done .row-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .row-foot .spacer { flex: 1; }

  /* People */
  .member { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--card); border: 0; border-radius: var(--r);
    padding: 14px 16px; text-align: left; box-shadow: var(--shadow); min-height: 72px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 19px; flex: none; color: #fff; }
  .avatar.big { width: 64px; height: 64px; font-size: 26px; }
  .member .who { flex: 1; min-width: 0; }
  .member strong { display: block; font-size: 18px; }
  .member small { color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
  .chev { color: var(--faint); flex: none; }
  .invite { display: flex; align-items: center; gap: 12px; }
  .code { font-size: 26px; font-weight: 800; letter-spacing: .14em; }
  .person-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .person-head h2 { margin: 0; }

  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--brand); font-weight: 700; font-size: 16px;
    padding: 8px 0; margin: -8px 0 10px; min-height: 44px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 18px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
  .empty .em-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--soft); color: var(--brand); display: grid; place-items: center; margin: 0 auto 12px; }
  .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-size: 21px; margin-bottom: 4px; }

  /* Forms */
  label.field { display: block; margin-bottom: 16px; }
  label.field > span { display: block; font-size: 16px; font-weight: 700; margin-bottom: 7px; }
  label.field > span em { font-style: normal; font-weight: 500; color: var(--faint); }
  .input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 13px 14px; font-size: 17px; min-height: 52px; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  textarea.input { min-height: 90px; resize: vertical; }
  .input.code-in { font-size: 28px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; text-align: center; }
  .input.pin-in { font-size: 28px; font-weight: 800; letter-spacing: .6em; text-align: center; }
  /* Checkboxes look like iOS-style switches */
  .check { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 16px; margin-bottom: 16px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; }
  .check input { order: 2; appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line);
    position: relative; flex: none; margin: 0; transition: background .2s; cursor: pointer; }
  .check input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .check input:checked { background: var(--brand); }
  .check input:checked::after { transform: translateX(20px); }
  .check input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-bottom: 16px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 14px; margin: -8px 0 16px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions .btn { flex: 1; }

  /* Bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 94%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px); }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tab { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0;
    font-size: 13px; font-weight: 700; border-radius: 12px; }
  .tab[aria-current="page"] { color: var(--brand); background: var(--soft); }

  /* Sheet */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh; background: var(--bg); color: var(--ink);
    border-radius: 22px 22px 0 0; }
  @media (min-width: 620px) { dialog.sheet { margin: auto; border-radius: 20px; } }
  dialog.sheet::backdrop { background: rgba(30, 15, 20, .45); }
  .sheet-in { padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .sheet-close { position: absolute; top: 14px; right: 14px; font-size: 26px; line-height: 1; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .sheet h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 0; }
  .sheet-sec { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 20px; }
  .sheet-sec h4 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); z-index: 30;
    background: var(--ink); color: var(--bg); border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
  .toast button { border: 0; background: none; color: var(--bg); text-decoration: underline; font-weight: 800; padding: 0; }
  .offline { background: var(--panel); color: var(--muted); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .loading { color: var(--faint); text-align: center; padding: 50px 0; }
  .picker { display: grid; gap: 10px; margin-bottom: 14px; }
  .linkrow { display: flex; gap: 8px; }
  .linkrow .input { flex: 1; min-width: 0; }
  .linkrow .btn { min-height: 52px; }
  .photo-box { margin-bottom: 16px; }
  .photo-btn { background: var(--soft); border-color: transparent; color: var(--soft-ink); min-height: 54px; }
  .photo-status { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .photo-status img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none; }
  .photo-status strong { color: var(--ink); }
  .picks { display: grid; gap: 8px; margin-top: 12px; }
  .pick { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
  .pick strong { font-size: 16px; }
  .pick small { color: var(--muted); font-size: 14px; }
  .pick em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--ok); }
  .pick.on { border-color: var(--brand); background: var(--soft); }
  .pick.none { color: var(--muted); font-weight: 600; text-align: center; display: block; }
  .fillmsg { display: block; color: var(--muted); font-size: 14px; margin-top: 7px; }
  .welcome-art { width: 84px; height: 84px; border-radius: 24px; margin: 6px 0 18px; display: block; box-shadow: var(--shadow); }

  /* Tracker */
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .totals small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .totals strong { font-size: 22px; font-weight: 800; }
  .over { color: var(--err); }
  .budget-line { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .budget-line strong { font-size: 22px; }
  .meter { height: 10px; border-radius: 5px; background: var(--panel); margin: 14px 0 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
  .meter.over i { background: var(--err); }
  .buys { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .buys li { display: flex; gap: 10px; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .buys li:last-child { border-bottom: 0; padding-bottom: 0; }
  .buys small { display: block; color: var(--muted); font-size: 13px; }
  .buys b { white-space: nowrap; }
</style>
</head>
<body>
<main>
  <header class="top">
    <img class="logo" src="/icons/icon.svg" alt="">
    <div>
      <div class="name">Wishlist</div>
      <div class="group-name" id="groupName" hidden></div>
    </div>
    <span class="spacer"></span>
    <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </header>
  <div id="offline" class="offline" hidden>You're offline. Showing what was last loaded; changes need a connection.</div>
  <div id="view"><div class="loading">Loading...</div></div>
</main>

<nav class="tabs" id="tabs" hidden>
  <div class="inner">
    <button class="tab" type="button" data-tab="mine">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M12 8v13M3 12h18M12 8c-1.5-3-5-4-6-2s2 2 6 2zM12 8c1.5-3 5-4 6-2s-2 2-6 2z"/></svg>
      My list
    </button>
    <button class="tab" type="button" data-tab="family">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6-.3 4.6 1.4 5.5 4.4"/></svg>
      Family
    </button>
    <button class="tab" type="button" data-tab="notes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Tracker
    </button>
  </div>
</nav>

<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const API = "/api/";
const TOKEN_KEY = "wishlist-token";
const CACHE_KEY = "wishlist-cache";

// ---------- tiny helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (c) => (c == null ? "" : (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: c % 100 ? 2 : 0 }));
const priceIn = (c) => (c == null ? "" : String(c / 100));
const initial = (n) => (n || "?").trim().charAt(0).toUpperCase();
const AV_COLORS = ["#8E2440", "#2F6A55", "#B5651D", "#3D5A99", "#7A4E9C", "#A23B6D", "#4F7A2B", "#2C7A86"];
function avatar(name, id, big) {
  let h = 0;
  for (const ch of String(id || name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="avatar${big ? " big" : ""}" style="background:${AV_COLORS[h % AV_COLORS.length]}" aria-hidden="true">${esc(initial(name))}</span>`;
}
const GIFT = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M12 8v13M3 12h18M12 8c-1.5-3-5-4-6-2s2 2 6 2zM12 8c1.5-3 5-4 6-2s-2 2-6 2z"/></svg>';
const GIFT_SM = GIFT.replace(/width="28" height="28"/, 'width="18" height="18"');
const emptyBox = (title, text) => `<div class="empty"><div class="em-icon">${GIFT}</div><strong>${title}</strong>${text}</div>`;
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "Link"; } };
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const LOCK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const CAMERA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const OUT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }
function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch { return {}; } }
function writeCache(key, value) { try { const c = readCache(); c[key] = value; localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch {} }

async function api(path, data) {
  const opts = { headers: { "content-type": "application/json" } };
  const t = getToken();
  if (t) opts.headers["x-wishlist-token"] = t;
  if (data !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(data); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { const e = new Error("You're offline. Try again when you have a connection."); e.offline = true; throw e; }
  const out = await res.json().catch(() => ({}));
  if (res.status === 401 && t) { setToken(null); state.me = null; render(); }
  if (!res.ok) { const e = new Error(out.error || "Something went wrong."); e.status = res.status; throw e; }
  return out;
}

// Loads from the API, falling back to the last copy saved on this device when offline.
async function load(path) {
  try {
    const data = await api(path);
    writeCache(path, data);
    $("#offline").hidden = true;
    return data;
  } catch (e) {
    const cached = readCache()[path];
    if (e.offline && cached) { $("#offline").hidden = false; return cached; }
    throw e;
  }
}

let toastTimer;
function toast(msg, undo) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button type="button">Undo</button>' : "");
  el.hidden = false;
  if (undo) el.querySelector("button").onclick = () => { el.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), undo ? 5000 : 2600);
}

// ---------- sheet (bottom drawer) ----------
const sheet = $("#sheet");
function openSheet(html, onReady) {
  $("#sheetBody").innerHTML = '<div class="grab"></div><button class="iconbtn sheet-close" type="button" aria-label="Close">&times;</button>' + html;
  $("#sheetBody .sheet-close").onclick = closeSheet;
  if (!sheet.open) sheet.showModal();
  onReady?.($("#sheetBody"));
}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });

// Wires a form: collects named fields, runs submit, shows errors inline.
function wireForm(form, submit) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector('[type="submit"]');
    const errEl = form.querySelector(".err");
    errEl.hidden = true;
    btn.disabled = true;
    const data = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      data[el.name] = el.type === "checkbox" ? el.checked : el.value;
    }
    try { await submit(data); }
    catch (err) { errEl.textContent = err.message; errEl.hidden = false; }
    finally { btn.disabled = false; }
  });
}

// ---------- state + routing ----------
const state = { me: null, groups: [], season: null, tab: "mine", person: null };

function setTab(tab, person = null) {
  state.tab = tab;
  state.person = person;
  const hash = person ? `#person/${person}` : `#${tab}`;
  if (location.hash !== hash) history.pushState(null, "", hash);
  render();
}
window.addEventListener("popstate", () => { readHash(); render(); });
function readHash() {
  const h = location.hash.slice(1);
  if (h.startsWith("person/")) { state.tab = "family"; state.person = h.slice(7); }
  else if (["mine", "family", "notes"].includes(h)) { state.tab = h; state.person = null; }
}
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

const group = () => state.groups[0] || null;
const others = () => (group()?.members || []).filter((m) => m.id !== state.me.id);
const personName = (id) => (group()?.members || []).find((m) => m.id === id)?.name || "Someone";

async function refreshMe() {
  const data = await load("me");
  state.me = data.me;
  state.groups = data.groups;
  state.season = data.season;
}

async function render() {
  const signedIn = !!getToken();
  $("#tabs").hidden = !signedIn;
  $("#settingsBtn").hidden = !signedIn;
  $("#groupName").hidden = !signedIn;
  if (!signedIn) return renderWelcome();

  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));
  try {
    if (!state.me) await refreshMe();
    $("#groupName").textContent = group()?.name || "";
    if (state.person) await renderPerson(state.person);
    else if (state.tab === "family") renderFamily();
    else if (state.tab === "notes") await renderTracker();
    else await renderMine();
  } catch (e) {
    if (!getToken()) return;
    $("#view").innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn" type="button" id="retry">Try again</button>`;
    $("#retry").onclick = () => { state.me = null; render(); };
  }
}

    wireForm($("#codeForm"), async ({ code }) => {
      const res = await api("lookup", { code });

    });
    $("#startBtn").onclick = () => renderWelcome("start");
    return;
  }

  if (step === "who") {
    v.innerHTML = `
      <button class="back" type="button" id="backBtn">&larr; Back</button>
      <h2>${esc(info.group.name)}</h2>
      <p class="lead">Tap your name.</p>
      <div class="picker">
        ${info.members.map((m) => `<button class="member" type="button" data-id="${esc(m.id)}">
            ${avatar(m.name, m.id)}
            <span class="who"><strong>${esc(m.name)}</strong>${m.hasPin ? `<small>${LOCK} PIN protected</small>` : ""}</span>${CHEV}
          </button>`).join("")}
        <button class="add soft" type="button" id="newBtn">${PLUS} I'm not on the list yet</button>
      </div>`;
    $("#backBtn").onclick = () => renderWelcome("code");
    $("#newBtn").onclick = () => renderWelcome("new", info);
    v.querySelectorAll("[data-id]").forEach((b) => (b.onclick = async () => {

      catch (e) { toast(e.message); }
    }));
    return;

  if (step === "pin") {
    v.innerHTML = `
      <button class="back" type="button" id="backBtn">&larr; Back</button>
      <h2>Hi ${esc(info.member.name)}</h2>
      <p class="lead">Enter your PIN.</p>
      <form class="card" id="pinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>PIN</span>
          <input class="input pin-in" name="pin" inputmode="numeric" pattern="\\d{4}" maxlength="4" required autofocus></label>
        <button class="btn primary wide" type="submit">Sign in</button>
      </form>`;
    $("#backBtn").onclick = () => renderWelcome("who", info);
    wireForm($("#pinForm"), async ({ pin }) => finishJoin(await api("join", { code: info.code, memberId: info.member.id, pin })));
    return;
  }

  if (step === "new" || step === "start") {
    const starting = step === "start";
    v.innerHTML = `
      <button class="back" type="button" id="backBtn">&larr; Back</button>
      <h2>${starting ? "Start a new family" : `Join ${esc(info.group.name)}`}</h2>
      <p class="lead">${starting ? "You'll get a code to share so everyone else can join." : "Add yourself so everyone can see your list."}</p>
      <form class="card" id="newForm" autocomplete="off">

        <label class="field"><span>Your name</span><input class="input" name="name" maxlength="40" placeholder="First name is fine" required></label>
        <label class="field"><span>PIN <em>(optional)</em></span><input class="input pin-in" name="pin" inputmode="numeric" pattern="\\d{4}" maxlength="4"></label>
        <p class="hint">A 4-digit PIN keeps others from signing in as you and seeing your private ideas. You can add one later.</p>

      </form>`;
    $("#backBtn").onclick = () => (starting ? renderWelcome("code") : renderWelcome("who", info));

function finishJoin({ token }) {
  setToken(token);
  try { localStorage.removeItem(CACHE_KEY); } catch {}
  history.replaceState(null, "", location.pathname + "#mine");
  state.me = null;
  state.tab = "mine";
  state.person = null;
  render();
}

function editItem(item) {
  const isNew = !item;
  item ||= {};
  openSheet(`
    <h3>${isNew ? "Add a wish" : "Edit wish"}</h3>
    <form id="itemForm" autocomplete="off">
      <div class="err" hidden></div>
      ${linkField(item.url)}
      <label class="field"><span>What is it?</span><input class="input" name="title" maxlength="200" value="${esc(item.title)}" placeholder="Cozy slippers" required></label>
      <label class="field"><span>Price <em>(optional)</em></span><input class="input" name="price" inputmode="decimal" value="${esc(priceIn(item.price_cents))}" placeholder="25"></label>
      <label class="field"><span>Notes <em>(size, color, where to buy)</em></span><textarea class="input" name="notes" maxlength="1000">${esc(item.notes)}</textarea></label>
      <label class="check"><input type="checkbox" name="must" ${item.priority === "must" ? "checked" : ""}> This is a must-have</label>
      <div class="actions">
        ${isNew ? "" : '<button class="btn danger" type="button" id="removeItem">Remove</button>'}
        <button class="btn primary" type="submit">${isNew ? "Add to my list" : "Save"}</button>
      </div>
    </form>`, (el) => {
      const form = $("#itemForm", el);
      // type=url rejects links without https://, so let the server fix those up instead.
      form.noValidate = true;
      wireAutofill(form);
      wireForm(form, async (d) => {
        if (!d.title.trim()) throw new Error("Give your wish a name.");
        await api("item/save", { id: item.id, title: d.title, url: d.url, price: d.price, notes: d.notes, priority: d.must ? "must" : null });
        closeSheet();

        if (!confirmRemove()) return;
        try { await api("item/remove", { id: item.id }); closeSheet(); toast("Removed"); state.me = null; render(); }
        catch (e) { toast(e.message); }
      });
    });
}

function linkField(value) {
  return `<div class="photo-box">
      <input type="file" accept="image/*" data-photo hidden>

    <small class="fillmsg" hidden></small></label>`;
}

// Shrink the photo on the phone before sending (faster, cheaper). Returns a JPEG data URL.
function shrinkPhoto(file, maxSide = 1024, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL("image/jpeg", quality), preview: c.toDataURL("image/jpeg", 0.6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't open that photo. Try another one.")); };
    img.src = url;
  });
}

const shopUrl = (q) => `https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q)}`;
const range = (lo, hi) => (lo && hi && lo !== hi ? `Usually $${lo} to $${hi}` : lo || hi ? `Usually about $${lo || hi}` : "");

// Photo: Gemini suggests what it might be; tapping a suggestion fills the name and a shopping-search link.
function wirePhoto(form) {
  const input = form.querySelector("[data-photo]"), btn = form.querySelector("[data-photo-btn]");
  const status = form.querySelector(".photo-status"), picks = form.querySelector(".picks");
  btn.addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const file = input.files[0];
    input.value = "";
    if (!file) return;
    picks.hidden = true;
    btn.disabled = true;
    try {
      const photo = await shrinkPhoto(file);
      status.innerHTML = `<img src="${photo.preview}" alt=""><span>Looking at your photo...</span>`;
      status.hidden = false;
      const { suggestions } = await api("identify", { image: photo.data });
      if (!suggestions.length) {
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>Couldn't tell what this is. Try a closer photo, or type it in below.</span>`;
        return;
      }
      status.innerHTML = `<img src="${photo.preview}" alt=""><span><strong>Is it one of these?</strong> Tap the closest match.</span>`;
      picks.innerHTML = suggestions.map((x, i) => `<button class="pick" type="button" data-i="${i}">
          <strong>${esc(x.title)}</strong>${x.detail ? `<small>${esc(x.detail)}</small>` : ""}${range(x.price_low, x.price_high) ? `<em>${esc(range(x.price_low, x.price_high))}</em>` : ""}
        </button>`).join("") + '<button class="pick none" type="button" data-none>None of these</button>';
      picks.hidden = false;
      picks.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
        const x = suggestions[+b.dataset.i];
        form.elements.title.value = x.title;
        if (!form.elements.url.value.trim()) form.elements.url.value = shopUrl(x.search);
        picks.querySelectorAll(".pick").forEach((p) => p.classList.toggle("on", p === b));
        status.innerHTML = `<img src="${photo.preview}" alt=""><span><strong>Added the name.</strong> The link searches stores for it. Paste a store link instead and tap Fill to get the exact price.</span>`;
        form.elements.title.scrollIntoView({ behavior: "smooth", block: "center" });
      }));
      picks.querySelector("[data-none]").onclick = () => {
        picks.hidden = true;
        status.innerHTML = `<img src="${photo.preview}" alt=""><span>No problem. Type the name below, or try another photo.</span>`;
        form.elements.title.focus();
      };
    } catch (e) {
      status.innerHTML = `<span>${esc(e.message)}</span>`;
      status.hidden = false;
    } finally { btn.disabled = false; }
  });
}

// Pasting a link (or tapping Fill) looks up the product and fills the empty name and price fields.
function wireAutofill(form) {
  wirePhoto(form);
  const url = form.elements.url, btn = form.querySelector("[data-fill]"), msg = form.querySelector(".fillmsg");
  const title = form.elements.title, price = form.elements.price;
  const say = (t) => { msg.textContent = t; msg.hidden = !t; };
  let busy = false;
  async function fill(force) {
    const v = url.value.trim();
    if (!v || busy) return;
    busy = true; btn.disabled = true; say("Looking it up...");
    try {
      const r = await api("preview", { url: v });
      let filled = [];
      if (r.title && (force || !title.value.trim())) { title.value = r.title; filled.push("name"); }
      if (r.price != null && (force || !price.value.trim())) { price.value = String(r.price); filled.push("price"); }
      say(filled.length ? `Filled in the ${filled.join(" and ")} from ${r.site}. Check it looks right.`
        : r.title || r.price != null ? "Already filled in. Tap Fill to replace with the link's details."
        : `Couldn't read details from ${r.site}. Type them in instead.`);
    } catch (e) { say(e.message); }
    finally { busy = false; btn.disabled = false; }
  }
  btn.addEventListener("click", () => fill(true));
  url.addEventListener("paste", () => setTimeout(() => fill(false), 0));
}

async function shareInvite(g) {
  const link = `${location.origin}/?code=${encodeURIComponent(g.code)}`;
  const text = `Join our family Wishlist (${g.name}). Code: ${g.code}`;
  try {
    if (navigator.share) return await navigator.share({ title: "Wishlist", text, url: link });
    await navigator.clipboard.writeText(`${text}\n${link}`);
    toast("Invite copied");
  } catch (e) {
    if (e?.name !== "AbortError") toast(`Code: ${g.code}`);
  }
}

function personRow(i, kind) {
  let foot = "";
  if (i.claim) {
    foot = i.claim.mine
      ? `<span class="tag ok">You bought this${i.claim.price_cents != null ? ` · ${money(i.claim.price_cents)}` : ""}</span><span class="spacer"></span><button class="btn small" type="button" data-mark="${kind}:${esc(i.id)}">Edit</button>`
      : `<span class="spacer"></span><span class="tag muted">Bought by ${esc(i.claim.buyerName)}</span>`;
    if (i.removed) foot = `<span class="tag muted">Removed by ${esc(personName(state.person))}</span>` + foot;
  } else {
    foot = `<span class="spacer"></span><button class="btn small primary" type="button" data-mark="${kind}:${esc(i.id)}">${GIFT_SM} I bought this</button>`;
  }
  const by = kind === "idea" ? `<span class="tag">Idea from ${esc(i.author_name)}</span>` : i.priority === "must" && !i.claim ? '<span class="tag">Must have</span>' : "";
  const notes = kind === "idea" ? i.note : i.notes;
  return `<div class="row${i.claim ? " done" : ""}">
    <div class="row-top"><span class="row-title">${esc(i.title)}</span>${i.price_cents != null ? `<span class="price">${money(i.price_cents)}</span>` : ""}</div>
    ${notes ? `<div class="row-notes">${esc(notes)}</div>` : ""}
    <div class="row-foot">${by}${i.url ? `<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))} ${OUT}</a>` : ""}${foot}</div>
  </div>`;
}

// Mark purchased (or edit the price / unmark) for a list item or an idea.
function markPurchased(kind, x) {
  const path = kind === "item" ? "claim" : "idea/claim";
  const key = kind === "item" ? "itemId" : "ideaId";
  const editing = !!x.claim?.mine;
  const paid = editing ? x.claim.price_cents ?? x.price_cents : x.price_cents;
  openSheet(`
    <h3>${editing ? "Your purchase" : "Mark as bought"}</h3>
    <p style="color:var(--ink);font-weight:600">${esc(x.title)}</p>
    <form id="markForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>What you paid <em>(optional, for your tracker)</em></span>
        <input class="input" name="price" inputmode="decimal" value="${esc(priceIn(paid))}" placeholder="0.00"></label>
      <div class="actions">
        ${editing ? '<button class="btn danger" type="button" id="unmark">Unmark</button>' : ""}
        <button class="btn primary" type="submit">${editing ? "Save" : "Mark as bought"}</button>
      </div>
    </form>`, (el) => {
      wireForm($("#markForm", el), async ({ price }) => {
        await api(path, { [key]: x.id, on: true, price });
        closeSheet();
        toast(editing ? "Saved" : "Marked as bought", editing ? null : () => api(path, { [key]: x.id, on: false }).then(render, (e) => toast(e.message)));
        render();
      });
      $("#unmark", el)?.addEventListener("click", async () => {
        try { await api(path, { [key]: x.id, on: false }); closeSheet(); toast("Unmarked"); render(); }
        catch (e) { toast(e.message); }
      });
    });
}

// ---------- tracker: budgets, spending, ideas (private) ----------
async function renderTracker() {
  const t = await load("tracker");
  state.tracker = t;
  const v = $("#view");
  const totalBudget = t.people.reduce((n, p) => n + (p.budget_cents || 0), 0);
  const totalSpent = t.people.reduce((n, p) => n + p.spent_cents, 0);
  v.innerHTML = `
    <h2>Tracker</h2>
    <p class="lead">Your budgets, what you've bought, and your gift ideas for ${t.season}. <span class="private">${LOCK} Only you can see this page</span></p>
    ${t.people.length ? `
    <div class="card totals">
      <div><small>Budget</small><strong>${totalBudget ? money(totalBudget) : "None set"}</strong></div>
      <div><small>Spent</small><strong>${money(totalSpent)}</strong></div>
      <div><small>Left</small><strong class="${totalBudget && totalSpent > totalBudget ? "over" : ""}">${totalBudget ? money(totalBudget - totalSpent) : "-"}</strong></div>
    </div>
    <div class="actions" style="margin:12px 0 4px">
      <button class="btn" type="button" id="addIdea">${PLUS} Gift idea</button>
      <button class="btn" type="button" id="exportBtn">Export to Excel</button>
    </div>` : `<div class="empty"><strong>No one to plan for yet</strong>Once family members join, you can set budgets and track gifts for each of them here.</div>`}
    ${t.people.map(personCard).join("")}`;
  $("#addIdea")?.addEventListener("click", () => editIdea(null, null));
  $("#exportBtn")?.addEventListener("click", () => exportExcel(t));
  v.querySelectorAll("[data-budget]").forEach((b) => (b.onclick = () => editBudget(t.people.find((p) => p.id === b.dataset.budget))));
  v.querySelectorAll("[data-for]").forEach((b) => (b.onclick = () => editIdea(null, b.dataset.for)));
  v.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.open)));
  wireIdeaRows(v, t.people.flatMap((p) => p.ideas));
}

function personCard(p) {
  const budget = p.budget_cents;
  const pct = budget ? Math.min(100, Math.round((p.spent_cents / budget) * 100)) : 0;
  const over = budget != null && p.spent_cents > budget;
  return `
    <div class="label" style="margin-top:30px">${avatar(p.name, p.id)} ${esc(p.name)}<span class="spacer" style="flex:1"></span><button class="btn quiet small" type="button" data-open="${esc(p.id)}" style="padding:0">Their list &rarr;</button></div>
    <div class="card">
      <div class="budget-line">
        <div><strong>${money(p.spent_cents)}</strong> <span style="color:var(--muted)">spent${budget != null ? ` of ${money(budget)}` : ""}</span></div>
        <button class="btn small" type="button" data-budget="${esc(p.id)}">${budget != null ? "Edit budget" : "Set budget"}</button>
      </div>
      ${budget != null ? `<div class="meter${over ? " over" : ""}"><i style="width:${over ? 100 : pct}%"></i></div>
        <small style="color:${over ? "var(--err)" : "var(--muted)"}">${over ? `${money(p.spent_cents - budget)} over budget` : `${money(budget - p.spent_cents)} left`}</small>` : ""}
      ${p.purchases.length ? `<ul class="buys">${p.purchases.map((x) => `<li><span>${esc(x.title)}<small>${esc(x.from)}</small></span><b>${money(x.spent_cents)}</b></li>`).join("")}</ul>` : ""}
    </div>
    <div class="stack" style="margin-top:10px">
      ${p.ideas.map(ideaRow).join("")}
      <button class="add soft" type="button" data-for="${esc(p.id)}">${PLUS} Gift idea for ${esc(p.name)}</button>
    </div>`;
}

function editBudget(p) {
  openSheet(`
    <h3>Budget for ${esc(p.name)}</h3>
    <p>${LOCK} Only you can see this.</p>
    <form id="budgetForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Budget for ${state.tracker?.season || "this year"}</span>
        <input class="input" name="amount" inputmode="decimal" value="${esc(priceIn(p.budget_cents))}" placeholder="100"></label>
      <div class="actions">
        ${p.budget_cents != null ? '<button class="btn danger" type="button" id="clearBudget">Clear</button>' : ""}
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>`, (el) => {
      wireForm($("#budgetForm", el), async ({ amount }) => { await api("budget", { subjectId: p.id, amount }); closeSheet(); toast("Budget saved"); render(); });
      $("#clearBudget", el)?.addEventListener("click", async () => {
        try { await api("budget", { subjectId: p.id, amount: "" }); closeSheet(); toast("Budget cleared"); render(); } catch (e) { toast(e.message); }
      });
    });
}

function ideaRow(i) {
  const bought = !!i.claim;
  const who = !bought ? "" : i.claim.mine ? `<span class="tag ok">You bought this${i.claim.price_cents != null ? ` · ${money(i.claim.price_cents)}` : ""}</span>` : `<span class="tag muted">Bought by ${esc(i.claim.buyerName)}</span>`;
  return `<div class="row${bought ? " done" : ""}" role="button" tabindex="0" data-idea="${esc(i.id)}">
    <div class="row-top"><span class="row-title">${esc(i.title)}</span>${i.price_cents != null ? `<span class="price">${money(i.price_cents)}</span>` : ""}</div>
    ${i.note ? `<div class="row-notes">${esc(i.note)}</div>` : ""}
    <div class="row-foot">${i.shared ? '<span class="tag">Shared with family</span>' : '<span class="tag muted">Just for you</span>'}${who}${i.url ? `<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))} ${OUT}</a>` : ""}</div>
  </div>`;
}

function wireIdeaRows(root, ideas) {
  root.querySelectorAll("[data-idea]").forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("a")) editIdea(ideas.find((i) => i.id === el.dataset.idea)); };
  });
}

function editIdea(idea, subjectId) {
  const isNew = !idea;
  idea ||= { subject_id: subjectId };
  const people = others();
  const boughtByOther = idea.claim && !idea.claim.mine;
  openSheet(`
    <h3>${isNew ? "Gift idea" : "Edit idea"}</h3>
    <form id="ideaForm" autocomplete="off">
      <div class="err" hidden></div>
      ${isNew && !subjectId ? `<label class="field"><span>For</span><select class="input" name="subjectId" required>
          <option value="">Choose someone</option>${people.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>`
        : `<p style="color:var(--ink);font-weight:600">For ${esc(personName(idea.subject_id))}</p>`}
      ${linkField(idea.url)}
      <label class="field"><span>Idea</span><input class="input" name="title" maxlength="200" value="${esc(idea.title)}" placeholder="That book she mentioned" required></label>
      <label class="field"><span>Price <em>(optional)</em></span><input class="input" name="price" inputmode="decimal" value="${esc(priceIn(idea.price_cents))}"></label>
      <label class="field"><span>Note <em>(optional)</em></span><textarea class="input" name="note" maxlength="1000">${esc(idea.note)}</textarea></label>
      <label class="check"><input type="checkbox" name="shared" ${idea.shared ? "checked" : ""}> Share with the family</label>
      <p class="hint" id="shareHint"></p>
      ${boughtByOther ? `<p class="hint">Bought by ${esc(idea.claim.buyerName)}.</p>` : `
      <label class="check"><input type="checkbox" name="bought" ${idea.claim?.mine ? "checked" : ""}> I bought this</label>
      <label class="field" id="paidField"><span>What you paid <em>(optional)</em></span><input class="input" name="paid" inputmode="decimal" value="${esc(priceIn(idea.claim?.price_cents ?? idea.price_cents))}"></label>`}
      <div class="actions">
        ${isNew ? "" : '<button class="btn danger" type="button" id="removeIdea">Delete</button>'}
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>`, (el) => {
      const form = $("#ideaForm", el);
      form.noValidate = true;
      wireAutofill(form);
      const sync = () => {
        const shared = form.shared.checked;
        $("#shareHint", el).textContent = shared
          ? `Everyone in the family except ${personName(form.subjectId?.value || idea.subject_id)} can see it and mark it as bought.`
          : "Only you can see this idea.";
        if (form.bought) $("#paidField", el).hidden = !form.bought.checked;
      };
      form.addEventListener("change", sync);
      sync();
      wireForm(form, async (d) => {
        const payload = { id: idea.id, subjectId: d.subjectId || idea.subject_id, title: d.title, url: d.url, price: d.price, note: d.note, shared: d.shared };
        if (!boughtByOther) { payload.bought = d.bought; payload.paid = d.paid; }
        await api("idea/save", payload);
        closeSheet();
        toast("Saved");
        render();
      });
      $("#removeIdea", el)?.addEventListener("click", async () => {
        if (!window.confirm("Delete this idea?")) return;
        try { await api("idea/remove", { id: idea.id }); closeSheet(); toast("Deleted"); render(); }
        catch (e) { toast(e.message); }
      });
    });
}

// ---------- Excel export ----------
function loadXlsx() {
  if (window.buildXlsx) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "/xlsx.js";
    s.onload = ok;
    s.onerror = () => no(new Error("Couldn't load the exporter. Check your connection."));
    document.head.appendChild(s);
  });
}

async function exportExcel(t) {
  try {
    await loadXlsx();
    const dollars = (c) => (c == null ? null : c / 100);
    const day = (iso) => (iso ? iso.slice(0, 10) : null);
    const summary = t.people.map((p) => [p.name, dollars(p.budget_cents), dollars(p.spent_cents), p.budget_cents == null ? null : dollars(p.budget_cents - p.spent_cents), p.purchases.length, p.ideas.length]);
    const tb = t.people.reduce((n, p) => n + (p.budget_cents || 0), 0), ts = t.people.reduce((n, p) => n + p.spent_cents, 0);
    summary.push(["Total", dollars(tb), dollars(ts), dollars(tb - ts), t.people.reduce((n, p) => n + p.purchases.length, 0), t.people.reduce((n, p) => n + p.ideas.length, 0)]);
    const blob = window.buildXlsx([
      { name: "Summary", boldLast: true, columns: [
          { header: "Person", width: 20 }, { header: "Budget", money: true }, { header: "Spent", money: true },
          { header: "Left", money: true }, { header: "Gifts bought", width: 13 }, { header: "Open ideas", width: 12 }],
        rows: summary },
      { name: "Purchases", columns: [
          { header: "Person", width: 18 }, { header: "Gift", width: 36 }, { header: "From", width: 22 }, { header: "Paid", money: true },
          { header: "Listed price", money: true }, { header: "Date", width: 12 }, { header: "Link", width: 40 }],
        rows: t.people.flatMap((p) => p.purchases.map((x) => [p.name, x.title, x.from, dollars(x.spent_cents), dollars(x.list_cents), day(x.date), x.url])) },
      { name: "Ideas", columns: [
          { header: "Person", width: 18 }, { header: "Idea", width: 36 }, { header: "Price", money: true }, { header: "Shared", width: 10 },
          { header: "Note", width: 40 }, { header: "Link", width: 40 }],
        rows: t.people.flatMap((p) => p.ideas.map((i) => [p.name, i.title, dollars(i.price_cents), i.shared ? "Yes" : "No", i.note, i.url])) },
    ]);
    const filename = `Wishlist tracker ${t.season}.xlsx`;
    const file = new File([blob], filename, { type: blob.type });
    // Phones: the share sheet lets you save to Files or send it. Computers: a normal download.
    if (navigator.canShare?.({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { toast(e.message); }
}

// ---------- settings ----------
$("#settingsBtn").onclick = () => {
  const g = group();
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet(`
    <h3>Settings</h3>
    <form id="nameForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Your name</span><input class="input" name="name" maxlength="40" value="${esc(state.me.name)}" required></label>
      <button class="btn wide" type="submit">Save name</button>
    </form>
    <div class="sheet-sec">
      <h4>PIN</h4>
      <p>${state.me.hasPin ? "Your name is PIN protected." : "No PIN yet. Add one so nobody else can sign in as you and see your notes."}</p>
      <form id="pinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>${state.me.hasPin ? "New PIN" : "PIN"}</span><input class="input pin-in" name="pin" inputmode="numeric" pattern="\\d{4}" maxlength="4" required></label>
        <div class="actions">
          ${state.me.hasPin ? '<button class="btn danger" type="button" id="removePin">Remove PIN</button>' : ""}
          <button class="btn" type="submit">${state.me.hasPin ? "Change PIN" : "Set PIN"}</button>
        </div>
      </form>
    </div>
    ${g ? `<div class="sheet-sec"><h4>Family</h4><p>${esc(g.name)}: code <strong style="font-family:var(--mono);color:var(--ink)">${esc(g.code)}</strong></p></div>` : ""}
    <div class="sheet-sec">
      <h4>Add to home screen</h4>
      <p>${iOS ? "In Safari, tap Share, then Add to Home Screen." : "In Chrome, open the menu, then Add to Home screen or Install app."}</p>
    </div>
    <div class="sheet-sec">
      <button class="btn wide danger" type="button" id="signOut">Sign out on this device</button>
    </div>`, (el) => {
      wireForm($("#nameForm", el), async ({ name }) => { await api("profile", { name }); closeSheet(); toast("Name saved"); state.me = null; render(); });
      wireForm($("#pinForm", el), async ({ pin }) => { await api("profile", { pin }); closeSheet(); toast("PIN saved"); state.me = null; render(); });
      $("#removePin", el)?.addEventListener("click", async () => {
        try { await api("profile", { pin: "" }); closeSheet(); toast("PIN removed"); state.me = null; render(); } catch (e) { toast(e.message); }
      });
      $("#signOut", el).onclick = async () => {
        try { await api("signout", {}); } catch {}
        setToken(null);
        try { localStorage.removeItem(CACHE_KEY); } catch {}
        state.me = null;
        closeSheet();
        history.replaceState(null, "", location.pathname);
        render();
      };
    });
};

// Keyboard: Enter/Space on role=button rows.
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.row[role="button"]')) { e.preventDefault(); e.target.click(); }
});
// Refresh when coming back to the app so new wishes and marks show up.
document.addEventListener("visibilitychange", () => { if (!document.hidden && getToken() && !sheet.open) { state.me = null; render(); } });

readHash();
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
