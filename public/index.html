    return `<div class="label fam-label"${n ? "" : ' style="margin-top:0"'}><span>${esc(fam.name)}</span><span class="btns"><button class="btn quiet small" type="button" data-hhs="${esc(fam.id)}">Households</button><button class="btn quiet small" type="button" data-share="${esc(fam.id)}">Invite</button></span></div>
      <div class="stack" style="margin-top:12px">${ppl.length ? peopleHtml(ppl, personBtn) : `<p class="footnote" style="margin:0">Just you so far. Tap Invite to send ${esc(fam.name)} the link.</p>`}</div>`;
  }).join("");
  v.innerHTML = multi() ? `${sections}
    <div class="label">You</div>
    <div class="stack" style="margin-top:12px">
      <button class="member" type="button" id="meRow">${avatar(state.me.name, state.me.id)}<span class="who"><strong>${esc(state.me.name)}</strong><small>Your list</small></span>${CHEV}</button>
    </div>` : `
    ${people.length ? `<div class="label fam-label" style="margin-top:0"><span>Who you're shopping for</span>${g ? `<button class="btn quiet small" type="button" data-hhs="${esc(g.id)}">Households</button>` : ""}</div><div class="stack" style="margin-top:12px">
      ${peopleHtml(people, personBtn)}</div>` : `
      <div class="empty">${giftBox("Invite your people")}<strong>Just you so far</strong><p>Send the invite below and everyone's lists will show up here.</p></div>`}
    <div class="label">You</div>
    <div class="stack" style="margin-top:12px">
      <button class="member" type="button" id="meRow">${avatar(state.me.name, state.me.id)}<span class="who"><strong>${esc(state.me.name)}</strong><small>Your list</small></span>${CHEV}</button>
    </div>
    <div class="label">Invite someone</div>
    <div style="margin-top:12px">${g ? inviteCard(g) : ""}</div>
    <p class="footnote">In another circle too, like friends or your partner's family? Join it from Settings and keep one list for both.</p>`;
  v.querySelectorAll("[data-id]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.id)));
  $("#meRow").onclick = () => setTab("mine");
  if (g && !multi()) wireInviteCard(v, g);
  v.querySelectorAll("[data-share]").forEach((b) => (b.onclick = () => openInvite(state.groups.find((x) => x.id === b.dataset.share))));
  v.querySelectorAll("[data-hhs]").forEach((b) => (b.onclick = () => openHouseholds(b.dataset.hhs)));
  wireGiftBox(v, () => {
    const card = $("[data-ticket]", v);
    if (!card) return openInvite(g);
    card.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "center" });
    setTimeout(() => { card.classList.remove("wiggle"); void card.offsetWidth; card.classList.add("wiggle"); }, 450);
  });
}

// "Households" on a circle: anyone in the circle can group its people into households, rename them,
// and add or take people out. A new household made here is put in this circle.
function openHouseholds(gid) {
  const g = state.groups.find((x) => x.id === gid);
  if (!g) return closeSheet();
  const by = new Map(), loose = [];
  for (const m of g.members) m.householdId ? by.set(m.householdId, [...(by.get(m.householdId) || []), m]) : loose.push(m);
  const nm = (m) => `${esc(m.name)}${m.id === state.me.id ? " <small>(you)</small>" : ""}`;
  const row = (m, extra = "") => `<div class="hh-row">${avatar(m.name, m.id)}<strong>${nm(m)}</strong>${extra}</div>`;
  const back = async (msg) => {
    await refreshMe();
    toast(msg);
    render();
    openHouseholds(gid);
  };
  const showErr = (el, e) => { const err = $(".err", el); err.textContent = e.message; err.hidden = false; };
  openSheet(`<h3>Households in ${esc(g.name)}</h3>
    <p>Group people who live or gift together, like Mom &amp; Dad or Jen, Mike &amp; the kids. Anyone in ${esc(g.name)} can set these up.</p>
    <div class="err" hidden></div>
    ${[...by].map(([id, ppl]) => `<div class="hh" style="margin-bottom:12px">
      <div class="hh-name">${HOME_I} ${esc(householdLabel(id))}<button class="btn quiet small" type="button" data-rename="${esc(id)}">Rename</button></div>
      <div style="background:var(--card);border-radius:14px;padding:4px 12px">${ppl.map((m) => row(m, `<button class="btn small quiet danger" type="button" data-out="${esc(m.id)}" data-hh="${esc(id)}">Remove</button>`)).join("")}</div>
      <button class="btn small wide" type="button" data-addto="${esc(id)}" style="margin-top:8px">${PLUS} Add someone</button></div>`).join("")}
    ${by.size ? "" : `<p class="subtle">No households yet.</p>`}
    ${loose.length ? `<div class="label" style="margin-top:18px">Not in a household</div>
      <div>${loose.map((m) => row(m)).join("")}</div>
      <button class="btn primary wide" type="button" id="newHh" style="margin-top:14px">${PLUS} New household</button>` : ""}`,
  (el) => {
    el.querySelectorAll("[data-out]").forEach((b) => (b.onclick = async () => {
      const name = b.dataset.out === state.me.id ? "yourself" : personName(b.dataset.out);
      if (!window.confirm(`Take ${name} out of ${householdLabel(b.dataset.hh)}?`)) return;
      b.disabled = true;
      try { await api("household/remove", { householdId: b.dataset.hh, memberId: b.dataset.out }); await back(b.dataset.out === state.me.id ? "You left that household" : `${name} is out`); }
      catch (e) { showErr(el, e); b.disabled = false; }
    }));
    el.querySelectorAll("[data-rename]").forEach((b) => (b.onclick = () => {
      const id = b.dataset.rename;
      const h = state.households[id] || {};
      const auto = householdAuto((by.get(id) || []).map((m) => m.name));
      openSheet(`<h3>Name this household</h3>
        <form id="hhRename" autocomplete="off"><div class="err" hidden></div>
          <label class="field"><span>Household name</span><input class="input" name="name" maxlength="40" value="${esc(h.name || "")}" placeholder="${esc(auto)}"></label>
          <p class="hint" style="margin-top:-10px">Leave it empty to use first names.</p>
          <div class="actions"><button class="btn" type="button" id="hhBack">Back</button><button class="btn primary" type="submit">Save</button></div></form>`, (el2) => {
        $("#hhBack", el2).onclick = () => openHouseholds(gid);
        wireForm($("#hhRename", el2), async ({ name }) => { await api("household/rename", { householdId: id, name }); await back("Household name saved"); });
      });
    }));
    // Pick people: one for adding to a household, several for a new one.
    const picker = (title, many, onDone) => openSheet(`<h3>${esc(title)}</h3>
      <div class="err" hidden></div>
      ${many ? `<label class="field"><span>Household name <em style="font-weight:600;color:var(--muted)">(optional)</em></span><input class="input" id="hhNewName" maxlength="40" placeholder="Uses first names if empty"></label>` : ""}
      ${loose.map((m) => `<button class="pick-person" type="button" data-pick="${esc(m.id)}" aria-pressed="false">${avatar(m.name, m.id)}<span>${nm(m)}</span>${many ? `<span class="tick-box">${CHECK}</span>` : ""}</button>`).join("")}
      <div class="actions" style="margin-top:16px"><button class="btn" type="button" id="hhBack">Back</button>${many ? `<button class="btn primary" type="button" id="hhMake">Create</button>` : ""}</div>`, (el2) => {
      $("#hhBack", el2).onclick = () => openHouseholds(gid);
      el2.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = async () => {
        if (many) { b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); buzz(); return; }
        b.disabled = true;
        try { await onDone([b.dataset.pick]); } catch (e) { showErr(el2, e); b.disabled = false; }
      }));
      $("#hhMake", el2)?.addEventListener("click", async (e) => {
        const ids = [...el2.querySelectorAll('[data-pick][aria-pressed="true"]')].map((b) => b.dataset.pick);
        if (!ids.length) return showErr(el2, new Error("Pick who's in the household."));
        e.currentTarget.disabled = true;
        try { await onDone(ids, $("#hhNewName", el2).value); } catch (err) { showErr(el2, err); e.currentTarget.disabled = false; }
      });
    });
    el.querySelectorAll("[data-addto]").forEach((b) => (b.onclick = () => {
      if (!loose.length) return showErr(el, new Error(`Everyone in ${g.name} is already in a household.`));
      const id = b.dataset.addto;
      picker(`Add to ${householdLabel(id)}`, false, async ([memberId]) => {
        await api("household/add", { householdId: id, memberId });
        await back(`Added ${memberId === state.me.id ? "you" : personName(memberId)}`);
      });
    }));
    $("#newHh", el)?.addEventListener("click", () => picker("New household", true, async (memberIds, name) => {
      await api("household/create", { groupId: gid, memberIds, name });
      await back("Household made");
    }));
  });
}

// Budget bar for someone's next occasion (if you set a budget for it).
function budgetMini(p) {
  const o = p?.occasions[0];
  if (!o || o.budget_cents == null) return "";
  const over = o.spent_cents > o.budget_cents;
  const pct = o.budget_cents ? Math.min(100, Math.round((o.spent_cents / o.budget_cents) * 100)) : 100;
  const tag = p.occasions.length > 1 ? `, ${occName(o)}` : "";
  return `<span class="mini${over ? " over" : ""}"><span class="bar"><i style="width:${over ? 100 : pct}%"></i></span>
    <span>${over ? `${money(o.spent_cents - o.budget_cents)} over` : `${money(o.spent_cents)} of ${money(o.budget_cents)}`}${tag}</span></span>`;
}

// ---------- invites ----------
// The link opens a landing page for that family, and `from` lets it say who sent it.
const inviteLink = (g) => `${location.origin}/join/${encodeURIComponent(g.code)}?from=${encodeURIComponent(state.me.id)}`;
const inviteText = (g) => `${state.me.name} invited you to ${g.name} on Wishlist 🎁 Add what you'd love this year, see what everyone's hoping for, and keep gifts a surprise.`;
const COPY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>';
const QR_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';

// A ticket with the code, the link, Copy / Send, and a QR code to show someone in person.
function inviteCard(g) {
  const link = inviteLink(g);
  const canSend = !!navigator.share;
  return `<div class="ticket" data-ticket>
    <div class="ticket-top">${DOODLE}<p>${esc(g.name)}</p>
      <div class="code-big" role="img" aria-label="Invite code ${esc([...g.code].join(" "))}">${[...g.code].map((c, i) => `<span style="animation-delay:${0.1 + i * 0.07}s">${esc(c)}</span>`).join("")}</div>
      <small>${esc(link.replace(/^https?:\/\//, "").replace(/\?.*$/, ""))}</small></div>
    <div class="ticket-mid"></div>
    <div class="ticket-body">
      <div class="ticket-actions">
        <button class="btn${canSend ? "" : " primary"}" type="button" data-copy>${COPY} Copy invite</button>
        ${canSend ? `<button class="btn primary" type="button" data-send>${SEND} Send</button>` : ""}
      </div>
      <div class="qr" hidden></div>
      <button class="btn quiet qr-btn" type="button" data-qr>${QR_ICON} Show QR code</button>
    </div></div>`;
}

let qrLoading;
function loadQr() {
  return (qrLoading ||= new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "/qr.js";
    sc.onload = ok;
    sc.onerror = () => { qrLoading = null; no(new Error("Couldn't load the QR code. Check your connection.")); };
    document.head.appendChild(sc);
  }));
}

function wireInviteCard(root, g) {
  const card = $("[data-ticket]", root);
  if (!card) return;
  const link = inviteLink(g);
  const copyBtn = $("[data-copy]", card);
  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(`${inviteText(g)}\n\nJoin here: ${link}\nInvite code: ${g.code}`);
    } catch { return toast(`Invite code: ${g.code}`); }
    buzz();
    copyBtn.innerHTML = `${CHECK} Copied!`;
    copyBtn.classList.add("copied");
    card.classList.remove("wiggle"); void card.offsetWidth; card.classList.add("wiggle");
    const r = copyBtn.getBoundingClientRect();
    party(r.left + r.width / 2, r.top, 14);
    clearTimeout(copyBtn._t);
    copyBtn._t = setTimeout(() => { copyBtn.innerHTML = `${COPY} Copy invite`; copyBtn.classList.remove("copied"); }, 2400);
  };
  $("[data-send]", card)?.addEventListener("click", async () => {
    try { await navigator.share({ title: `Join ${g.name} on Wishlist`, text: inviteText(g), url: link }); }
    catch (e) { if (e?.name !== "AbortError") copyBtn.click(); }
  });
  const qrBtn = $("[data-qr]", card), qrBox = $(".qr", card);
  qrBtn.onclick = async () => {
    if (!qrBox.hidden) { qrBox.hidden = true; qrBtn.innerHTML = `${QR_ICON} Show QR code`; return; }
    try { await loadQr(); } catch (e) { return toast(e.message); }
    qrBox.innerHTML = window.qrSvg(link, { dark: "#4A0E22", light: "#FFFFFF", label: `QR code to join ${g.name}` }) + "<small>Point a phone camera here to join</small>";
    qrBox.hidden = false;
    qrBtn.innerHTML = `${QR_ICON} Hide QR code`;
  };
}

function openInvite(g) {
  openSheet(`<h3>Invite to ${esc(g.name)}</h3><p>Send this link. It opens right to your circle, no code typing needed.</p>${inviteCard(g)}`, (el) => wireInviteCard(el, g));
}

// "Remind them" on someone's empty list.
async function shareInvite(g, nudgeName) {
  const link = inviteLink(g);
  const text = `Hi ${nudgeName}! Add a few things to your Wishlist so we know what to get you 🎁`;
  try {
    if (navigator.share) return await navigator.share({ title: "Wishlist", text, url: link });
    await navigator.clipboard.writeText(`${text}\n${link}`);
    toast("Reminder copied");
  } catch (e) {
    if (e?.name !== "AbortError") toast(`Code: ${g.code}`);
  }
}

// ---------- someone else's list ----------
// Filters and sort for someone's list. Reset when you open a different person.
const PRICE_BUCKETS = [["u25", "Under $25", 0, 2500], ["25-50", "$25 to $50", 2500, 5000], ["50-100", "$50 to $100", 5000, 10000], ["100", "$100+", 10000, Infinity]];
const SORTS = [["top", "Top picks first"], ["low", "Lowest price"], ["high", "Highest price"], ["new", "Newest"]];
const freshView = () => ({ cat: "all", price: "all", sort: "top", open: false });
const inBucket = (c, k) => { const b = PRICE_BUCKETS.find((x) => x[0] === k); return c != null && c >= b[2] && c < b[3]; };

async function renderPerson(id) {
  const [list, t] = await Promise.all([load(`list?member=${encodeURIComponent(id)}`), loadTracker()]);
  state.tracker = t;
  notePhotos([list.member]);
  state.view ||= freshView();
  const view = state.view;
  const name = list.member.name;
  const plan = t?.people.find((p) => p.id === id);
  const sugg = list.suggestions || [];
  const mine = list.myIdeas || [];
  const all = list.items;

  // Summary numbers.
  const open = all.filter((i) => !i.claim && !i.removed);
  const gettingN = all.filter((i) => i.claim?.mine).length;
  const prices = all.map((i) => i.price_cents).filter((c) => c != null);
  const topN = all.filter((i) => i.priority === "must" && !i.removed).length;
  markSeen(id, all.filter((i) => !i.removed).length);

  // Filter options: only categories and price ranges that are actually on the list.
  const catCount = {};
  for (const i of all) { const k = catOf(i); catCount[k] = (catCount[k] || 0) + 1; }
  const cats = CATS.filter(([k]) => catCount[k]);
  const buckets = PRICE_BUCKETS.filter(([k]) => all.some((i) => inBucket(i.price_cents, k)));
  if (view.cat !== "all" && !catCount[view.cat]) view.cat = "all";
  if (view.price !== "all" && !buckets.some(([k]) => k === view.price)) view.price = "all";

  const rank = (i) => (!i.claim ? 0 : i.claim.mine ? 1 : 2);
  const byPrice = (dir) => (a, b) => (a.price_cents == null) - (b.price_cents == null) || dir * ((a.price_cents ?? 0) - (b.price_cents ?? 0));
  const sorter = {
    top: (a, b) => rank(a) - rank(b) || (b.priority === "must") - (a.priority === "must"),
    low: byPrice(1),
    high: byPrice(-1),
    new: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
  }[view.sort] || (() => 0);
  const items = all
    .filter((i) => view.cat === "all" || catOf(i) === view.cat)
    .filter((i) => view.price === "all" || inBucket(i.price_cents, view.price))
    .filter((i) => !view.open || (!i.claim && !i.removed))
    .slice().sort(sorter);
  const filtering = view.cat !== "all" || view.price !== "all" || view.open;

  // Budget for their next occasion (Christmas or their birthday, whichever comes first).
  let meter = "";
  const next = plan?.occasions[0];
  if (next?.budget_cents != null) {
    const forWhat = next.christmas && !next.birthday ? `${esc(name)} this Christmas` : `${esc(name)}'s ${occName(next)}`;
    const over = next.spent_cents > next.budget_cents;
    const pct = next.budget_cents ? Math.min(100, Math.round((next.spent_cents / next.budget_cents) * 100)) : 100;
    meter = `<div class="hero-meter"><span class="bar"><i style="width:${over ? 100 : pct}%"></i></span>
      <span><b>${money(next.spent_cents)}</b> of ${money(next.budget_cents)} for ${forWhat}</span></div>`;
  }
  setHero(`<button class="back" type="button" id="backBtn">${BACK} Circles</button>
    <div class="hero-row">${avatar(name, id, true)}
      <div class="who-name"><h1>${esc(name)}'s list</h1>${list.member.fullName && list.member.fullName !== name ? `<span class="realname">${esc(list.member.fullName)}</span>` : ""}</div>
      <button class="hero-edit" type="button" id="editBtn" aria-label="Edit nickname and budget for ${esc(name)}">${PENCIL}<span>Edit</span></button></div>${meter}`);

  const chip = (group, k, label, count, icon = "") =>
    `<button class="chip" type="button" data-${group}="${k}" aria-pressed="${view[group] === k}">${icon}${esc(label)}${count != null ? `<span class="chip-n">${count}</span>` : ""}</button>`;
  const toolbar = all.length < 2 ? "" : `
    <div class="toolbar">
      ${cats.length > 1 ? `<div class="chips" role="group" aria-label="Filter by category">
        ${chip("cat", "all", "All", all.length)}${cats.map(([k, label]) => chip("cat", k, label, catCount[k], catIcon(k))).join("")}</div>` : ""}
      ${buckets.length > 1 || (buckets.length && prices.length < all.length) ? `<div class="chips" role="group" aria-label="Filter by price">
        ${chip("price", "all", "Any price")}${buckets.map(([k, label]) => chip("price", k, label)).join("")}</div>` : ""}
      <div class="toolbar-row">
        <label class="toggle"><input type="checkbox" id="openOnly" ${view.open ? "checked" : ""}><span>Still available only</span></label>
        <span class="spacer"></span>
        <label class="sort"><span class="vh">Sort by</span>
          <select id="sortSel">${SORTS.map(([k, l]) => `<option value="${k}"${view.sort === k ? " selected" : ""}>${l}</option>`).join("")}</select>${CHEV_D}</label>
      </div>
      ${filtering ? `<p class="showing">Showing ${items.length} of ${plural(all.length, "wish", "wishes")} <button class="linkbtn" type="button" id="clearFilters">Clear filters</button></p>` : ""}
    </div>`;

  const v = $("#view");
  v.innerHTML = `
    ${knowCard(list.member.profile)}
    ${all.length ? `<div class="stats">
      <div class="stat"><b>${all.length}</b><span>${all.length === 1 ? "wish" : "wishes"}</span></div>
      <div class="stat"><b>${open.length}</b><span>still available</span></div>
      ${gettingN ? `<div class="stat ok"><b>${gettingN}</b><span>you're getting</span></div>`
        : `<div class="stat${topN ? " gold" : ""}"><b>${topN}</b><span>${topN === 1 ? "top pick" : "top picks"}</span></div>`}
    </div>` : ""}
    ${toolbar}
    ${all.length ? `<div class="stack">${items.length ? items.map((i, n) => personRow(i, "item", n)).join("")
      : `<div class="nomatch"><strong>Nothing matches</strong><p>Try another category or price.</p><button class="btn small" type="button" id="clearFilters2">Show everything</button></div>`}</div>` : `
      <div class="empty">
        ${giftBox(`Add your own idea for ${name}`)}
        <strong>${esc(name)} hasn't added any wishes yet</strong>
        <p>Give ${esc(name)} a little nudge, or jot down your own idea. ${esc(name)} will never see your ideas.</p>
        <div class="stack"><button class="add" type="button" id="nudge">${MSG} Send ${esc(name)} a reminder</button></div>
      </div>`}
    ${theirGiftCards(list.giftCards, name, id)}
    ${sugg.length ? `<div class="label">Ideas from others</div><p class="subtle">Hidden from ${esc(name)}.</p>
      <div class="stack">${sugg.map((i, n) => personRow(i, "idea", n)).join("")}</div>` : ""}
    <div class="label">Your ideas for ${esc(name)}</div>
    <p class="subtle">Just for you, unless you share one.</p>
    <div class="stack">
      ${mine.map(ideaRow).join("")}
      <button class="add soft" type="button" id="addIdea">${PLUS} Add your own idea for ${esc(name)}</button>
    </div>`;
  $("#backBtn").onclick = () => setTab("family");
  $("#editBtn").onclick = () => editPerson(list.member, plan);
  $("#addIdea").onclick = () => addThing(id);
  $("#nudge")?.addEventListener("click", () => shareInvite(group(), name));
  wireGiftBox(v, () => addThing(id));
  const redo = () => render();
  v.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { view.cat = b.dataset.cat; redo(); }));
  v.querySelectorAll("[data-price]").forEach((b) => (b.onclick = () => { view.price = b.dataset.price; redo(); }));
  $("#sortSel")?.addEventListener("change", (e) => { view.sort = e.target.value; redo(); });
  $("#openOnly")?.addEventListener("change", (e) => { view.open = e.target.checked; redo(); });
  for (const b of v.querySelectorAll("#clearFilters, #clearFilters2")) b.onclick = () => { Object.assign(view, freshView(), { sort: view.sort }); redo(); };
  // Keep the chosen chip in view when the row scrolls sideways.
  v.querySelectorAll('.chip[aria-pressed="true"]').forEach((c) => c.scrollIntoView({ block: "nearest", inline: "nearest" }));
  wireIdeaRows(v, mine);
  v.querySelectorAll("[data-give]").forEach((b) => (b.onclick = () => giveGiftCard(list.giftCards.find((c) => c.brand === b.dataset.give), list.member, name, id)));
  const byKind = { item: all, idea: sugg };
  v.querySelectorAll("[data-mark]").forEach((b) => (b.onclick = () => {
    const [kind, itemId] = b.dataset.mark.split(":");
    markPurchased(kind, byKind[kind].find((x) => x.id === itemId), name, id);
  }));
}

// Edit someone: your own name for them ("Grandma" instead of "Jane Doe") and your budget for them. Both only for you.
function editPerson(member, plan) {
  const real = member.fullName || member.name;
  const next = plan?.occasions[0];
  const forWhat = !next ? "" : next.christmas && !next.birthday ? `Christmas ${occParts(next)[0]}` : `${member.name}'s ${occName(next)} (${occDay(next)})`;
  const hasNick = member.name !== real;
  openSheet(`
    <h3>Edit ${esc(member.name)}</h3>
    <form id="personForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Nickname</span>
        <input class="input" name="nickname" maxlength="40" value="${hasNick ? esc(member.name) : ""}" placeholder="${esc(real)}"></label>
      ${next ? `<label class="field"><span>Budget for ${esc(forWhat)}</span>
        <div class="input money-in"><span>$</span><input name="amount" inputmode="decimal" value="${esc(priceIn(next.budget_cents))}" placeholder="100" aria-label="Budget amount"></div></label>` : ""}
      <p class="hint">${LOCK} Just for you. Everyone else still sees ${esc(real)}, and nobody sees your budget.</p>
      <button class="btn primary wide" type="submit">Save</button>
    </form>`, (el) => {
      wireForm($("#personForm", el), async ({ nickname, amount }) => {
        const nick = nickname.trim();
        const jobs = [];
        if (nick !== (hasNick ? member.name : "")) jobs.push(api("nickname", { subjectId: member.id, nickname: nick }));
        if (next && amount !== undefined && amount.trim() !== priceIn(next.budget_cents)) jobs.push(api("budget", { subjectId: member.id, amount: amount.trim(), occasion: next.code }));
        await Promise.all(jobs);
        closeSheet();
        if (jobs.length) { toast("Saved"); state.stale = true; render(); }
      });
    });
}

function personRow(i, kind, n = 0) {
  const key = `${kind}:${i.id}`;
  const fresh = state.burst === key;
  let foot = "", cls = "";
  const visit = i.url ? `<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">View at ${esc(host(i.url))} ${OUT}</a>` : "";
  if (i.claim?.mine) {
    cls = " mine";
    foot = `<span class="mine-line"><span class="chk${fresh ? " new" : ""}">${CHECK}</span>You're getting this${occTag(state.person, i.claim.occasion) || " one"}</span><span class="spacer"></span>
      <button class="btn small quiet" type="button" data-mark="${key}">Edit</button>`;
  } else if (i.claim) {
    cls = " taken";
    foot = `<span class="taken-line">${esc(i.claim.buyerName)} is getting this${occTag(state.person, i.claim.occasion)}</span>`;
  } else {
    foot = `${visit}<span class="spacer"></span>
      <button class="btn small primary" type="button" data-mark="${key}">${GIFT_SM} I'll get this</button>`;
  }
  if (i.removed) foot = `<span class="taken-line">Removed by ${esc(personName(state.person))}</span><span class="spacer"></span>` + foot;
  const top = kind === "item" && i.priority === "must" && !i.claim;
  const cat = catOf(i);
  const notes = kind === "idea" ? i.note : i.notes;
  const paid = i.claim?.mine && i.claim.price_cents != null ? i.claim.price_cents : i.price_cents;
  const lookingUp = paid == null && i.url && !i.price_checked;
  const price = paid != null ? `<span class="wish-price">${money(paid)}</span>`
    : `<span class="wish-price none"${lookingUp ? ` data-price-slot="${esc(key)}"` : ""}>No price listed</span>`;
  const meta = [
    `<span class="cat-tag">${catIcon(cat, 14)}${esc(CAT[cat].label)}</span>`,
    kind === "idea" ? `<span>Idea from ${esc(i.author_name)}</span>` : i.created_at ? `<span>${addedOn(i.created_at)}</span>` : "",
    (i.claim || i.removed) && i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))}</a>` : "",
  ].filter(Boolean).join('<span class="dot" aria-hidden="true"></span>');
  const whose = kind === "idea" ? `${esc(i.author_name)}'s note` : `${esc(personName(state.person))}'s note`;
  return `<article class="row wish${cls}${top ? " is-top" : ""} ${fresh ? "" : "slide"}" style="animation-delay:${n * 0.05}s">
    ${top ? `<span class="top-ribbon">${STAR} Top pick</span>` : ""}
    <div class="row-top">${tile(i, kind)}
      <div class="row-main">
        <span class="row-title">${esc(i.title)}</span>
        ${price}
        <div class="wish-meta">${meta}</div>
      </div>
    </div>
    ${notes ? `<div class="wish-note"><span>${whose}</span>${esc(notes)}</div>` : ""}
    <div class="row-foot">${foot}</div>
    ${fresh && !reduceMotion() ? `<span class="burst" aria-hidden="true">${CONFETTI}</span>` : ""}
  </article>`;
}

// "I'll get this" (or edit what you paid / take it back) for a list item or a shared idea.
function markPurchased(kind, x, name, personId) {
  const path = kind === "item" ? "claim" : "idea/claim";
  const occ = occasionsOf(personId);
  const key = kind === "item" ? "itemId" : "ideaId";
  const editing = !!x.claim?.mine;
  const paid = editing ? x.claim.price_cents ?? x.price_cents : x.price_cents;
  const who = name || "them";
  openSheet(`
    <h3>${editing ? "Your gift" : "Getting this one?"}</h3>
    <p class="what">${esc(x.title)}</p>
    <form id="markForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>${editing ? "Price you paid" : "Price"}</span>
        <div class="input money-in"><span>$</span><input name="price" inputmode="decimal" value="${esc(priceIn(paid))}" placeholder="0" aria-label="Price"></div></label>
      ${occPicker(personId, x.claim?.occasion)}
      <p class="hint">${occ.length > 1 ? "This goes toward your budget for the one you pick." : `This goes toward your budget for ${esc(who)}.`}${editing ? "" : " Not bought yet? Mark it anyway so nobody doubles up. You can fix the price later."}</p>
      ${editing ? `<div class="actions"><button class="btn danger" type="button" id="unmark">Not getting it</button><button class="btn primary" type="submit">Save</button></div>`
        : `<button class="btn primary wide" type="submit">Yes, I'm getting it</button><button class="btn quiet wide" type="button" id="cancelMark" style="margin-top:6px">Cancel</button>`}
    </form>`, (el) => {
      $("#cancelMark", el)?.addEventListener("click", closeSheet);
      const occasion = wireOccPicker(el);
      wireForm($("#markForm", el), async ({ price }) => {
        await api(path, { [key]: x.id, on: true, price, occasion: occasion() });
        closeSheet();
        if (editing) { toast("Saved"); return render(); }
        buzz();
        const amount = price && parseFloat(price) > 0 ? money(Math.round(parseFloat(price) * 100)) : "";
        toast(amount ? `Added ${amount} to ${who}'s budget` : "It's yours. Nobody else will get it.",
          () => api(path, { [key]: x.id, on: false }).then(render, (e) => toast(e.message)));
        state.burst = `${kind}:${x.id}`;
        render();
      });
      $("#unmark", el)?.addEventListener("click", async () => {
        try { await api(path, { [key]: x.id, on: false }); closeSheet(); toast("Taken back"); render(); }
        catch (e) { toast(e.message); }
      });
    });
}

// ---------- budget: per person budgets, spending, ideas (private) ----------
// Two views: Christmas (everyone) and Birthdays (people who added one, soonest first).
const BUDGET_VIEW_KEY = "wishlist-budget-view";
function budgetView() { try { return localStorage.getItem(BUDGET_VIEW_KEY) === "birthday" ? "birthday" : "christmas"; } catch { return "christmas"; } }
function setBudgetView(v) { try { v === "birthday" ? localStorage.setItem(BUDGET_VIEW_KEY, v) : localStorage.removeItem(BUDGET_VIEW_KEY); } catch {} }
// The occasion a person's card shows in a view (null: no birthday yet).
const viewOcc = (p, view) => p.occasions.find((o) => (view === "birthday" ? o.birthday : o.christmas)) || null;
const xmasYear = (t) => { const o = t.people[0] && viewOcc(t.people[0], "christmas"); return o ? occParts(o)[0] : ""; };

async function renderTracker() {
  const t = await load("tracker");
  notePhotos(t.people);
  state.tracker = t;
  const view = budgetView();
  const rows = t.people.map((p) => ({ p, o: viewOcc(p, view) }));
  const shownRows = rows.filter((r) => r.o);
  if (view === "birthday") shownRows.sort((a, b) => a.o.code - b.o.code);
  const noBday = rows.filter((r) => !r.o);
  const totalBudget = shownRows.reduce((n, r) => n + (r.o.budget_cents || 0), 0);
  const totalSpent = shownRows.reduce((n, r) => n + r.o.spent_cents, 0);
  const left = totalBudget - totalSpent;
  const hasBudget = totalBudget > 0;
  const shown = hasBudget ? Math.abs(left) : totalSpent;
  const pct = hasBudget ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;
  const what = view === "birthday" ? "upcoming birthdays" : `Christmas ${xmasYear(t)}`;
  // How long until the next occasion in this view, and who doesn't have anything yet.
  const soonest = shownRows.reduce((a, r) => (!a || r.o.code < a.code ? r.o : a), null);
  const daysLeft = soonest ? daysUntil(soonest) : null;
  const countdown = daysLeft == null ? "" : view === "birthday"
    ? `Next birthday ${inDays(soonest)}`
    : daysLeft <= 0 ? "Merry Christmas!" : `${plural(daysLeft, "day", "days")} until Christmas`;
  const needGift = shownRows.filter((r) => !r.o.purchases.length);
  setHero(`
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><h1>Budget</h1><span class="lockline">${LOCK} just for you</span></div>
    <div class="hero-stat">
      <p class="kicker">${hasBudget ? (left < 0 ? `Over budget for ${esc(what)} by` : `Left to spend for ${esc(what)}`) : `Spent so far for ${esc(what)}`}</p>
      <span class="big-num" id="bigNum">${money(shown)}</span>
      <p class="hero-sub">${hasBudget ? `of ${money(totalBudget)}, ${money(totalSpent)} spent so far` : "Set a budget for anyone below to see what's left."}</p>
      ${hasBudget ? `<div class="hero-meter" style="margin-top:12px"><span class="bar"><i style="width:${pct}%"></i></span></div>` : ""}
      ${countdown ? `<p class="hero-sub" style="margin-top:10px;font-weight:700">${esc(countdown)}</p>` : ""}
    </div>`);
  const from = state.lastLeft ?? (hasBudget ? totalBudget : 0);
  countUp($("#bigNum"), from, shown);
  state.lastLeft = shown;

  const v = $("#view");
  const segHtml = seg("Which budget", [["christmas", `Christmas ${xmasYear(t)}`], ["birthday", "Birthdays"]], view, "two");
  v.innerHTML = t.people.length ? `
    <div id="viewSeg">${segHtml}</div>
    ${needGift.length && needGift.length < shownRows.length ? `<div class="label" style="margin-top:18px">Still need a gift for</div>
      <div class="still-need">${needGift.map((r) => `<button class="chip" type="button" data-need="${esc(r.p.id)}">${avatar(r.p.name, r.p.id, "sm")}${esc(r.p.name)}</button>`).join("")}</div>` : ""}
    ${shownRows.length ? `<div class="label" style="margin-top:18px">${view === "birthday" ? "Coming up" : "By person"}</div>
    <div class="stack" style="margin-top:12px">${shownRows.map((r, n) => personCard(r.p, r.o, view, n)).join("")}</div>`
      : `<div class="empty" style="margin-top:18px"><strong>No birthdays yet</strong><p>When people add their birthday in Settings, you can plan and budget for it here.</p></div>`}
    ${view === "birthday" && noBday.length ? `<div class="label">No birthday added yet</div>
      <p class="subtle">They can add it in Settings.</p>
      <div class="stack">${noBday.map((r) => `<button class="member" type="button" data-open="${esc(r.p.id)}">${avatar(r.p.name, r.p.id)}<span class="who"><strong>${esc(r.p.name)}</strong><small>${esc(r.p.name)}'s list</small></span>${CHEV}</button>`).join("")}</div>` : ""}
    <div class="stack" style="margin-top:18px">
      <button class="add" type="button" id="addPurchase">${PLUS} Add a purchase</button>
      <button class="btn wide" type="button" id="addIdea">${PLUS} Gift idea</button>
      ${shownRows.length ? `<button class="btn quiet wide" type="button" id="exportBtn">${DOWN} Download as Excel</button>` : ""}
    </div>` : `<div class="empty">${giftBox("Invite your people")}<strong>No one to plan for yet</strong><p>Once people join, you can set budgets and track gifts for each of them here.</p></div>`;
  $("#viewSeg") && wireSeg($("#viewSeg .seg"), (val) => { setBudgetView(val); state.lastLeft = null; renderTracker(); });
  $("#addPurchase")?.addEventListener("click", () => editIdea(null, null, { purchase: true, view }));
  $("#addIdea")?.addEventListener("click", () => addThing(null));
  $("#exportBtn")?.addEventListener("click", () => exportExcel(t, view));
  v.querySelectorAll(".stack > [data-open]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.open)));
  v.querySelectorAll("[data-need]").forEach((b) => (b.onclick = () => setTab("family", b.dataset.need)));
  wireGiftBox(v, () => setTab("family"));
  v.querySelectorAll(".pcard").forEach((c) => wireTrackerCard(c, t, view));
}

function wireTrackerCard(card, t, view) {
  if (!card) return;
  const p = t.people.find((x) => x.id === card.dataset.person);
  const o = viewOcc(p, view);
  card.querySelector("[data-toggle]").onclick = () => {
    const id = card.dataset.person;
    if (state.openPeople.has(id)) state.openPeople.delete(id); else state.openPeople.add(id);
    card.outerHTML = personCard(p, o, view, 0, true);
    wireTrackerCard($(`.pcard[data-person="${CSS.escape(id)}"]`), t, view);
  };
  card.querySelector("[data-budget]")?.addEventListener("click", () => editBudget(p, o));
  card.querySelector("[data-for]")?.addEventListener("click", () => addThing(card.dataset.person));
  card.querySelector("[data-open]")?.addEventListener("click", () => setTab("family", card.dataset.person));
  wireIdeaRows(card, t.people.flatMap((x) => x.ideas));
}

function personCard(p, o, view, n = 0, still = false) {
  const budget = o.budget_cents;
  const isOpen = state.openPeople.has(p.id);
  const over = budget != null && o.spent_cents > budget;
  const pct = budget ? Math.min(100, Math.round((o.spent_cents / budget) * 100)) : 100;
  const pill = budget == null ? '<span class="pill none">No budget</span>'
    : over ? `<span class="pill over">${money(o.spent_cents - budget)} over</span>` : `<span class="pill">${money(budget - o.spent_cents)} left</span>`;
  const when = view === "birthday" ? `<small class="occ-when">${occDay(o)}, ${inDays(o)}${o.turning ? ` · turning ${o.turning}` : ""}</small>` : "";
  return `<div class="pcard${isOpen ? " is-open" : ""}${still ? "" : " slide"}" style="animation-delay:${n * 0.06}s" data-person="${esc(p.id)}">
    <button class="pcard-head" type="button" data-toggle="${esc(p.id)}" aria-expanded="${isOpen}">
      <span class="pcard-top">${avatar(p.name, p.id)}
        <span class="pcard-who"><strong>${esc(p.name)}</strong>${when}<small>${money(o.spent_cents)}${budget != null ? ` of ${money(budget)}` : " spent"}</small></span>
        ${pill}${CHEV_D}</span>
      ${budget != null ? `<span class="meter${over ? " over" : ""}"><i style="width:${over ? 100 : pct}%${still ? ";animation:none" : ""}"></i></span>` : ""}
    </button>
    ${isOpen ? `<div class="pcard-body">
      ${o.purchases.length ? `<ul class="buys">${o.purchases.map((x) => `<li><span>${esc(x.title)}<small>${esc(x.from)}</small></span><b>${money(x.spent_cents)}</b></li>`).join("")}</ul>`
        : '<p class="subtle">Nothing bought yet.</p>'}
      ${p.ideas.length ? `<div class="stack">${p.ideas.map(ideaRow).join("")}</div>` : ""}
      <div class="pcard-actions">
        <button class="btn small" type="button" data-budget="${esc(p.id)}">${budget != null ? "Change budget" : "Set a budget"}</button>
        <button class="btn small" type="button" data-for="${esc(p.id)}">${PLUS} Gift idea</button>
        <button class="btn small quiet" type="button" data-open="${esc(p.id)}">${esc(p.name)}'s list</button>
      </div>
    </div>` : ""}
  </div>`;
}

// p: a tracker person, o: the occasion the budget is for.
function editBudget(p, o) {
  const forWhat = o.christmas && !o.birthday ? `Christmas ${occParts(o)[0]}` : `${p.name}'s ${occName(o)} (${occDay(o)})`;
  openSheet(`
    <h3>Budget for ${esc(p.name)}</h3>
    <form id="budgetForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>How much for ${esc(forWhat)}?</span>
        <div class="input money-in"><span>$</span><input name="amount" inputmode="decimal" value="${esc(priceIn(o.budget_cents))}" placeholder="100" aria-label="Budget amount"></div></label>
      <p class="hint">${LOCK} Just for you. It starts fresh after ${o.christmas && !o.birthday ? "Christmas" : "the big day"}.</p>
      <div class="actions">
        ${o.budget_cents != null ? '<button class="btn danger" type="button" id="clearBudget">Clear</button>' : ""}
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>`, (el) => {
      wireForm($("#budgetForm", el), async ({ amount }) => { await api("budget", { subjectId: p.id, amount, occasion: o.code }); closeSheet(); toast("Budget saved"); render(); });
      $("#clearBudget", el)?.addEventListener("click", async () => {
        try { await api("budget", { subjectId: p.id, amount: "", occasion: o.code }); closeSheet(); toast("Budget cleared"); render(); } catch (e) { toast(e.message); }
      });
    });
}

function ideaRow(i) {
  const bought = !!i.claim;
  const status = !bought ? (i.shared ? "Shared with others" : "Just for you")
    : i.claim.mine ? `You're getting this${occTag(i.subject_id, i.claim.occasion) || " one"}` : `${i.claim.buyerName} is getting this${occTag(i.subject_id, i.claim.occasion)}`;
  return `<div class="row${bought ? (i.claim.mine ? " mine" : " taken") : ""}" role="button" tabindex="0" data-idea="${esc(i.id)}" aria-label="Edit idea ${esc(i.title)}">
    <div class="row-top">${tile(i, "idea")}
      <div class="row-main">
        <div class="row-head"><span class="row-title">${esc(i.title)}</span>${i.price_cents != null ? `<span class="row-price">${money(i.price_cents)}</span>` : ""}</div>
        ${i.note ? `<span class="row-notes">${esc(i.note)}</span>` : ""}
        <span class="from">${esc(status)}${i.url ? ` · <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(host(i.url))}</a>` : ""}</span>
      </div>
    </div>
  </div>`;
}

function wireIdeaRows(root, ideas) {
  root.querySelectorAll("[data-idea]").forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("a")) editIdea(ideas.find((i) => i.id === el.dataset.idea)); };
  });
}

// A gift idea for someone. With { purchase: true } it's "Add a purchase": an idea already marked bought.
function editIdea(idea, subjectId, opts = {}) {
  const isNew = !idea;
  const purchase = isNew && opts.purchase;
  const c = opts.carry;
  idea ||= { subject_id: subjectId, ...(c ? { title: c.title, url: c.url, price_cents: toCents(c.price), note: c.notes } : {}) };
  const chips = isNew && opts.chooser && !purchase ? whoChips(subjectId) : "";
  const people = others();
  const boughtByOther = idea.claim && !idea.claim.mine;
  openSheet(`
    <h3>${purchase ? "Add a purchase" : isNew ? "Gift idea" : "Edit idea"}</h3>
    ${chips}
    <form id="ideaForm" autocomplete="off">
      <div class="err" hidden></div>
      ${chips ? (subjectId ? `<p class="what">${LOCK} ${esc(personName(subjectId))} never sees this</p>` : "") : isNew && !subjectId ? `<label class="field"><span>Who's it for?</span><select class="input" name="subjectId" required>
          <option value="">Choose someone</option>${people.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>`
        : `<p class="what">For ${esc(personName(idea.subject_id))}</p>`}
      <label class="field"><span>${purchase ? "What did you get?" : "Idea"}</span><input class="input" name="title" maxlength="200" value="${esc(idea.title)}" placeholder="${purchase ? "A candle" : "That book she mentioned"}" required></label>
      ${linkField(idea.url)}
      <label class="field"><span>Price</span><input class="input" name="price" inputmode="decimal" value="${esc(priceIn(idea.price_cents))}"></label>
      <label class="field"><span>Note</span><textarea class="input" name="note" maxlength="1000">${esc(idea.note)}</textarea></label>
      <label class="check"><span>Let others see this idea<small id="shareHint"></small></span><input type="checkbox" name="shared" ${idea.shared ? "checked" : ""}></label>
      ${boughtByOther ? `<p class="hint">${esc(idea.claim.buyerName)} is getting this.</p>` : `
      <label class="check"${purchase ? " hidden" : ""}><span>I'm getting this</span><input type="checkbox" name="bought" ${idea.claim?.mine || purchase ? "checked" : ""}></label>
      <div id="occField"></div>
      <label class="field" id="paidField"><span>Price you paid</span><input class="input" name="paid" inputmode="decimal" value="${esc(priceIn(idea.claim?.price_cents ?? idea.price_cents))}"></label>`}
      <div class="actions">
        ${isNew ? "" : '<button class="btn danger" type="button" id="removeIdea">Delete</button>'}
        <button class="btn primary" type="submit">${purchase ? "Save purchase" : "Save"}</button>
      </div>
    </form>`, (el) => {
      const form = $("#ideaForm", el);
      form.noValidate = true;
      wireAutofill(form);
      wireWhoChips(el);
      restoreImage(form, c);
      // Which occasion it's for: shown when you're getting it and the person has a birthday too.
      let occSubject = null, occasion = () => undefined;
      const syncOcc = () => {
        const box = $("#occField", el);
        if (!box) return;
        const who = form.subjectId?.value || idea.subject_id;
        box.hidden = !form.bought?.checked;
        if (who === occSubject) return;
        occSubject = who;
        const occ = occasionsOf(who);
        const want = idea.claim?.occasion ?? (opts.view === "birthday" ? occ.find((o) => o.birthday)?.code : occ.find((o) => o.christmas)?.code);
        box.innerHTML = who ? occPicker(who, want) : "";
        occasion = wireOccPicker(box);
      };
      const sync = () => {
        syncOcc();
        const shared = form.shared.checked;
        $("#shareHint", el).textContent = shared
          ? `Everyone except ${personName(form.subjectId?.value || idea.subject_id)} can see it and get it.`
          : "Only you can see it.";
        if (form.bought) $("#paidField", el).hidden = !form.bought.checked;
        // When adding a purchase, the price you type is what you paid.
        if (purchase && form.paid && document.activeElement === form.price) form.paid.value = form.price.value;
      };
      form.addEventListener("change", sync);
      form.addEventListener("input", sync);
      sync();
      wireForm(form, async (d) => {
        const payload = { id: idea.id, subjectId: d.subjectId || idea.subject_id, title: d.title, url: d.url, price: d.price, note: d.note, shared: d.shared, image: imageFor(form) };
        if (!boughtByOther) { payload.bought = d.bought; payload.paid = d.paid; if (d.bought) payload.occasion = occasion(); }
        if (!payload.subjectId) throw new Error("Choose who it's for.");
        await api("idea/save", payload);
        closeSheet();
        // Saved for someone whose page you're not on: offer a shortcut there.

function giftCard(g, extra = "") {

// Pick gift cards: tap stores on and off, then save. Replaces the whole set.
function pickGiftCards(current = []) {
  const before = new Set(current.map((c) => c.brand).filter((k) => GC[k]));
  const chosen = new Set(before);
  const card = (g) => `<button class="gc-item" type="button" data-pick="${g.key}" aria-pressed="${chosen.has(g.key)}" aria-label="${esc(g.name)}">${giftCard(g, `<span class="gc-check">${CHECK}</span>`)}</button>`;
  openSheet(`
    <h3>Gift cards you'd love</h3>
    <p class="subtle">Tap as many as you like. No details needed, and they stay on your list every year.</p>
    <input class="input gc-search" type="search" placeholder="Search stores" aria-label="Search stores" autocomplete="off">
    ${GC_GROUPS.map((grp) => `<section data-group><div class="gc-group">${esc(grp)}</div>
      <div class="gc-pick">${GIFT_LIST.filter((g) => g.group === grp).map(card).join("")}</div></section>`).join("")}
    <p class="subtle" id="gcNone" hidden style="margin-top:14px">No stores match. Try another name.</p>
    <div class="gc-pick-foot"><div class="err" hidden></div><button class="btn primary wide" type="button" id="gcSave"></button></div>`, (el) => {
      const save = $("#gcSave", el);
      const label = () => {
        const same = chosen.size === before.size && [...chosen].every((k) => before.has(k));
        save.textContent = same ? "Done" : chosen.size ? `Save ${plural(chosen.size, "gift card", "gift cards")}` : "Remove all gift cards";
      };
      label();
      el.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
        const k = b.dataset.pick;
        if (chosen.has(k)) chosen.delete(k); else chosen.add(k);
        b.setAttribute("aria-pressed", String(chosen.has(k)));
        buzz();
        label();
      }));
      const search = $(".gc-search", el);
      search.oninput = () => {
        const q = squash(search.value);
        let any = false;
        el.querySelectorAll("[data-group]").forEach((sec) => {
          let shown = 0;
          sec.querySelectorAll("[data-pick]").forEach((b) => {
            const ok = !q || squash(GC[b.dataset.pick].name).includes(q) || squash(GC[b.dataset.pick].group).includes(q);
            b.hidden = !ok;
            if (ok) shown++;
          });
          sec.hidden = !shown;
          if (shown) any = true;
        });
        $("#gcNone", el).hidden = any;
      };
      save.onclick = async () => {
        const added = [...chosen].filter((k) => !before.has(k));
        const removed = [...before].filter((k) => !chosen.has(k));
        if (!added.length && !removed.length) return closeSheet();
        const err = $(".err", el);
        err.hidden = true;
        save.disabled = true;
        try {
          await api("giftcards/save", { brands: [...chosen] });
          closeSheet();
          buzz();
          toast(added.length ? `Added ${plural(added.length, "gift card", "gift cards")} to your list` : "Gift cards saved");
          state.stale = true;
          state.gcNew = new Set(added);
          if (added.length) setTimeout(() => party(innerWidth / 2, innerHeight / 2.4, 26), 350);
          if (state.tab !== "mine" || state.person) return setTab("mine");
          render();
        } catch (e) {
          err.textContent = e.message;
          err.hidden = false;
          save.disabled = false;
        }
      };
    });
}

// "I'm giving one" for one of their occasions (Christmas, or their birthday if they added one), with an

function giveGiftCard(c, member, name, personId) {

    </form>`, (el) => {

      // The amount and buttons follow the picked occasion: your gift for it, or a new one.
      const paint = () => {
        const have = mineAt(occasion() ?? first ?? occ[0]?.code);
        form.elements.amount.value = have ? priceIn(have.amount_cents) : "";
        $("#giveActions", el).innerHTML = have
          ? `<div class="actions"><button class="btn danger" type="button" id="ungive">Not giving it</button><button class="btn primary" type="submit">Save</button></div>`
          : `<button class="btn primary wide" type="submit">${GIFT_SM} Yes, I'm giving one</button>`;
        $("#ungive", el)?.addEventListener("click", async () => {
          try { await send(false, undefined, have.occasion); closeSheet(); toast("Taken back"); render(); }
          catch (e) { toast(e.message); }

      el.querySelectorAll("[data-occ] button").forEach((b) => b.addEventListener("click", paint));

        if (editing) { toast("Saved"); return render(); }
        buzz();
        const n = parseFloat(String(amount).replace(/[$,\s]/g, ""));
        const filed = code ?? occ[0]?.code;
        toast(n > 0 ? `Added ${money(Math.round(n * 100))} to ${who}'s budget` : `You're giving ${who} a ${g.name} gift card`,
          () => send(false, undefined, filed).then(render, (e) => toast(e.message)));
        state.burst = `gc:${c.brand}`;
        render();
      });
    });
}

// ---------- Excel export ----------
function loadXlsx() {
  if (window.buildXlsx) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "/xlsx.js";
    s.onload = ok;
    s.onerror = () => no(new Error("Couldn't load the exporter. Check your connection."));
    document.head.appendChild(s);
  });
}

// Exports the view you're looking at (Christmas or Birthdays).
async function exportExcel(t, view) {
  try {
    await loadXlsx();
    const dollars = (c) => (c == null ? null : c / 100);
    const day = (iso) => (iso ? iso.slice(0, 10) : null);
    const rows = t.people.map((p) => ({ p, o: viewOcc(p, view) })).filter((r) => r.o);
    if (view === "birthday") rows.sort((a, b) => a.o.code - b.o.code);
    const summary = rows.map(({ p, o }) => [p.name, o.date, dollars(o.budget_cents), dollars(o.spent_cents), o.budget_cents == null ? null : dollars(o.budget_cents - o.spent_cents), o.purchases.length, p.ideas.length]);
    const tb = rows.reduce((n, r) => n + (r.o.budget_cents || 0), 0), ts = rows.reduce((n, r) => n + r.o.spent_cents, 0);
    summary.push(["Total", null, dollars(tb), dollars(ts), dollars(tb - ts), rows.reduce((n, r) => n + r.o.purchases.length, 0), rows.reduce((n, r) => n + r.p.ideas.length, 0)]);
    const blob = window.buildXlsx([
      { name: "Summary", boldLast: true, columns: [
          { header: "Person", width: 20 }, { header: view === "birthday" ? "Birthday" : "Date", width: 12 }, { header: "Budget", money: true }, { header: "Spent", money: true },
          { header: "Left", money: true }, { header: "Gifts bought", width: 13 }, { header: "Open ideas", width: 12 }],
        rows: summary },
      { name: "Purchases", columns: [
          { header: "Person", width: 18 }, { header: "Gift", width: 36 }, { header: "From", width: 22 }, { header: "Paid", money: true },
          { header: "Listed price", money: true }, { header: "Date", width: 12 }, { header: "Link", width: 40 }],
        rows: rows.flatMap(({ p, o }) => o.purchases.map((x) => [p.name, x.title, x.from, dollars(x.spent_cents), dollars(x.list_cents), day(x.date), x.url])) },
      { name: "Ideas", columns: [
          { header: "Person", width: 18 }, { header: "Idea", width: 36 }, { header: "Price", money: true }, { header: "Shared", width: 10 },
          { header: "Note", width: 40 }, { header: "Link", width: 40 }],
        rows: rows.flatMap(({ p }) => p.ideas.map((i) => [p.name, i.title, dollars(i.price_cents), i.shared ? "Yes" : "No", i.note, i.url])) },
    ]);
    const filename = view === "birthday" ? `Wishlist birthdays ${state.today ? String(state.today).slice(0, 4) : ""}.xlsx`.replace(" .", ".") : `Wishlist budget Christmas ${xmasYear(t)}.xlsx`;
    const file = new File([blob], filename, { type: blob.type });
    // Phones: the share sheet lets you save to Files or send it. Computers: a normal download.
    if (navigator.canShare?.({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { toast(e.message); }
}

// ---------- profile (birthday, sizes, please no) ----------
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const SIZE_LABELS = [["shirt", "Shirt / top"], ["pants", "Pants"], ["shoe", "Shoe"], ["ring", "Ring"]];
function bdayText(b) {
  const [m, d] = b.split("-").map(Number);
  return `${MONTHS[m - 1]} ${d}`;
}
// Days until the next birthday (0 = today).
function bdayIn(b) {
  const [m, d] = b.split("-").map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let next = new Date(t.getFullYear(), m - 1, d);
  if (next < t) next = new Date(t.getFullYear() + 1, m - 1, d);
  return Math.round((next - t) / 86400000);
}
// Fun profile extras. Keys must match GIFT_STYLES and FAV_COLORS in src/wishlist.js (never rename one).
const GIFT_STYLES = [["surprise", "🎁 Surprise me"], ["experiences", "🎟️ Experiences over things"], ["practical", "🧰 Practical please"],
  ["homemade", "🧶 Homemade melts my heart"], ["consumable", "🍫 No clutter, treats please"], ["books", "📚 Books, always"],
  ["together", "☕ Time together"], ["giftcards", "💳 Gift cards are great"]];
const FAV_COLORS = [["red", "Red", "#C62E2E"], ["pink", "Pink", "#F08AB0"], ["orange", "Orange", "#EE8A2E"], ["yellow", "Yellow", "#F2C94C"],
  ["green", "Green", "#4E9A5A"], ["teal", "Teal", "#2A9D8F"], ["blue", "Blue", "#4A8FD8"], ["navy", "Navy", "#1F3263"], ["purple", "Purple", "#8A5CC2"],
  ["brown", "Brown", "#8B5E3C"], ["black", "Black", "#1C1C1C"], ["white", "White", "#FFFFFF"], ["gray", "Gray", "#9A9A9A"], ["gold", "Gold", "#C9A227"], ["silver", "Silver", "#C4C8CC"]];
const STYLE_LABEL = Object.fromEntries(GIFT_STYLES), COLOR_OF = Object.fromEntries(FAV_COLORS.map(([k, l, c]) => [k, { l, c }]));
const colorDots = (keys) => `<span class="cdots">${keys.filter((k) => COLOR_OF[k]).map((k) => `<span class="cdot"><i style="--c:${COLOR_OF[k].c}"></i>${COLOR_OF[k].l}</span>`).join("")}</span>`;
const hasProfile = (p) => !!p && !!(p.birthday || p.avoid || p.brands?.length || p.giftStyle?.length || p.colors?.length || p.loves || Object.values(p.sizes || {}).some(Boolean));
const brandChips = (brands, edit) => `<span class="brand-chips${edit ? " edit" : ""}">${brands.map((b, k) => `<span class="brand-chip">${esc(b)}${edit
  ? `<button type="button" data-unbrand="${k}" aria-label="Remove ${esc(b)}">&times;</button>` : ""}</span>`).join("")}</span>`;
function knowCard(p) {
  if (!hasProfile(p)) return "";
  const rows = [];
  if (p.birthday) {
    const n = bdayIn(p.birthday);
    const soon = n === 0 ? "Today!" : n === 1 ? "Tomorrow" : n <= 45 ? `In ${n} days` : "";
    // Age at the next birthday (only if they shared the year).
    const turning = p.birthYear ? new Date(Date.now() + n * 86400000).getFullYear() - p.birthYear : null;
    rows.push(["Birthday", `${esc(bdayText(p.birthday))}${turning ? `, turning ${turning}` : ""}${soon ? `<span class="soon">${soon}</span>` : ""}`]);
  }
  for (const [k, l] of SIZE_LABELS) if (p.sizes?.[k]) rows.push([l.replace(" / top", ""), esc(p.sizes[k])]);
  if (p.giftStyle?.length) rows.push(["Gift style", brandChips(p.giftStyle.filter((k) => STYLE_LABEL[k]).map((k) => STYLE_LABEL[k])).replace(/(<span class="brand-chip">)(\S+) /g, '$1<span aria-hidden="true">$2</span>')]);
  if (p.brands?.length) rows.push(["Favorite brands", brandChips(p.brands)]);
  if (p.colors?.length) rows.push(["Favorite colors", colorDots(p.colors)]);
  if (p.loves) rows.push(["Little loves", esc(p.loves)]);
  if (p.avoid) rows.push(["Avoid", `<span class="no">${esc(p.avoid)}</span>`]);
  return `<div class="know"><div class="know-h">Good to know</div><dl>${rows.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl></div>`;
}

      <p class="sub" style="margin:10px 0 0">Your circles see your profile on your list.</p>
      <hr class="set-div">
      <form id="profileForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>Your name</span><input class="input" name="name" maxlength="40" value="${esc(state.me.name)}" required></label>
        <span class="flabel">Birthday</span>
        <div class="bday">
          <select class="input" name="bmonth" aria-label="Birthday month"><option value="">Month</option>${MONTHS.map((m, k) => `<option value="${k + 1}"${bm === k + 1 ? " selected" : ""}>${m}</option>`).join("")}</select>
          <select class="input" name="bday" aria-label="Birthday day"><option value="">Day</option>${Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${bd === k + 1 ? " selected" : ""}>${k + 1}</option>`).join("")}</select>
          <input class="input" name="byear" inputmode="numeric" maxlength="4" placeholder="Year" aria-label="Birth year (optional)" value="${esc(prof.birthYear || "")}">
        </div>
        <span class="flabel">Sizes</span>
        <div class="two">${SIZE_LABELS.map(([k, l]) => `<label class="field"><span style="font-size:14px;color:var(--muted);margin-bottom:4px">${l}</span><input class="input" name="size_${k}" maxlength="30" value="${esc(prof.sizes?.[k] || "")}" placeholder="${SIZE_EG[k]}"></label>`).join("")}</div>
        <span class="flabel" style="margin-top:4px">Favorite brands</span>
        <div id="brandChips">${brandChips(prof.brands || [], true)}</div>
        <div class="brand-add">
          <input class="input" id="brandIn" maxlength="40" list="brandList" placeholder="Lululemon, Trader Joe's" autocomplete="off" enterkeyhint="done" aria-label="Add a favorite brand">
          <button class="btn small" type="button" id="brandAdd">${PLUS} Add</button>
        </div>
        <datalist id="brandList">${GIFT_LIST.map((g) => `<option value="${esc(g.name)}">`).join("")}</datalist>
        <div class="fun-h">✨ Just for fun</div>
        <p class="sub" style="margin:0 0 12px">Small things that help people pick something you'll love.</p>
        <span class="flabel">Gift style <em>(up to 3)</em></span>
        <div class="pick-chips" id="styleChips">${GIFT_STYLES.map(([k, l]) => `<button class="chip" type="button" data-style="${k}" aria-pressed="${(prof.giftStyle || []).includes(k)}">${esc(l).replace(/^(\S+) /, '<span aria-hidden="true">$1</span>')}</button>`).join("")}</div>
        <span class="flabel">Favorite colors <em>(up to 3)</em></span>
        <div class="swatches" id="colorPick">${FAV_COLORS.map(([k, l, c]) => `<button class="swatch" type="button" data-color="${k}" aria-pressed="${(prof.colors || []).includes(k)}" aria-label="${l}" title="${l}" style="--c:${c};${["white", "yellow", "silver"].includes(k) ? "--tick:#2A1E22" : ""}"></button>`).join("")}</div>
        <label class="field"><span>Little things I love</span>
          <input class="input" name="loves" maxlength="200" value="${esc(prof.loves || "")}" placeholder="Oat lattes, sour gummies, anything lavender"></label>
        <p class="hint" style="margin-top:-10px">Great for stocking stuffers.</p>
        <label class="field" style="margin-top:4px"><span>Dislikes and allergies</span>
          <textarea class="input" name="avoid" maxlength="300" placeholder="No scented candles, allergic to wool">${esc(prof.avoid || "")}</textarea></label>
        <button class="btn primary wide" type="submit">Save profile</button>
      </form>
    </div>

    <div class="label">Look and feel</div>
    <div class="set-card">
      <h4>Light or dark</h4>
      <div class="modes" role="radiogroup" aria-label="Light or dark" id="modes">
        ${[["light", "Light", SUN_I], ["dark", "Dark", MOON_I]].map(([m, l, ic]) => `
          <button class="mode" type="button" role="radio" data-mode="${m}" aria-checked="false">
            <span class="pv ${m}" aria-hidden="true"><i></i><i></i><i style="width:75%"></i></span>
            <span class="nm">${ic} ${l}<span class="tick">${TICK_I}</span></span>
          </button>`).join("")}
      </div>
      ${swRow("autoTheme", "Match my phone", "Switches with your phone's light and dark setting", themeAuto())}
      <hr class="set-div">
      <h4>Text size</h4>
      <div id="textSeg">${seg("Text size", TEXT_SIZES.map(([k, l, px]) => [k, `<b style="font-size:${px}px">Aa</b>${l}`]), root.dataset.text || "md", "four")}</div>
      <div class="ts-preview"><small>Preview</small>Cozy socks, size medium. Any color but orange!</div>
      <hr class="set-div">
      <h4>App color</h4>
      <div class="accents" role="radiogroup" aria-label="App color" id="accents">${ACCENTS.map(([k, l, a, h]) => `<button class="accent" type="button" role="radio" data-accent="${k}" aria-checked="${(root.dataset.accent || "wine") === k}"><i style="--a:${a};--h:${h}"></i>${l}</button>`).join("")}</div>
      <p class="sub" style="margin:8px 0 0">Just on this device.</p>
      <hr class="set-div">
      ${swRow("motionSw", "Animations", "", root.dataset.motion !== "off")}
    </div>

    <div class="label">Sign-in PIN</div>
    <div class="set-card">
      <p class="sub">${state.me.hasPin ? "Your name is PIN protected." : "No PIN yet. Add one so nobody else can sign in as you and see your notes."}</p>
      <form id="pinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>${state.me.hasPin ? "New PIN" : "PIN"}</span><input class="input pin-in" name="pin" inputmode="numeric" pattern="\\d{4}" maxlength="4" required></label>
        <div class="actions">
          ${state.me.hasPin ? '<button class="btn danger" type="button" id="removePin">Remove PIN</button>' : ""}
          <button class="btn" type="submit">${state.me.hasPin ? "Change PIN" : "Set PIN"}</button>
        </div>
      </form>
    </div>

    <div class="label" id="famSec">${multi() ? "Your circles" : "Your circle"}</div>
    <div class="set-card">
      ${state.groups.map((g) => `<div class="fam">
          <span class="who"><strong>${esc(g.name)}</strong><small>Code <span class="code-sm">${esc(g.code)}</span> · ${plural(g.members.length, "person", "people")}</small></span>
          <button class="btn small" type="button" data-share="${esc(g.id)}">Invite</button>
          ${multi() ? `<button class="btn small quiet danger" type="button" data-leave="${esc(g.id)}">Leave</button>` : ""}
        </div>`).join("")}
      <p class="sub" style="margin-top:8px">${multi()
        ? "Every circle sees the same list. To hide a wish from one circle, open it and turn that circle off."
        : "Also do gifts with friends, coworkers or your partner's family? Join their circle here and keep one list for all of them."}</p>
      <form id="joinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>Join another circle</span>
          <input class="input code-in" name="code" maxlength="8" placeholder="ABC234" autocapitalize="characters" required></label>
        <div class="actions">
          <button class="btn" type="button" id="startFam">Start a new one</button>
          <button class="btn primary" type="submit">Join</button>
        </div>
      </form>
    </div>

    <div class="label" id="hhSec">Your household</div>
    <div class="set-card">${householdCard()}</div>

    <div class="label">The app</div>
    <div class="set-card">
      ${standalone ? "" : `<h4>Add to home screen</h4>
      <p class="sub">Open Wishlist in one tap, full screen, like any other app.</p>
      <button class="btn primary wide" type="button" id="installSettings" style="margin-bottom:10px">${iOS ? "Show me how" : installPrompt ? "Install" : "Show me how"}</button>`}
      <button class="btn wide" type="button" id="replayTour">Replay the welcome tour</button>
    </div>

    <div class="set-card" style="margin-top:26px">
      <button class="btn wide danger" type="button" id="signOut">Sign out on this device</button>
    </div>
`;

  // Light or dark: the two tiles always show what you're seeing now. Picking one turns "Match my phone" off.
  const paintTheme = () => {
    const dark = isDark();
    v.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-checked", String((b.dataset.mode === "dark") === dark)));
    $("#autoTheme", v).setAttribute("aria-checked", String(themeAuto()));
  };
  paintTheme();
  v.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { setTheme(b.dataset.mode); paintTheme(); buzz(); }));
  $("#autoTheme", v).onclick = () => { setTheme(themeAuto() ? (isDark() ? "dark" : "light") : "auto"); paintTheme(); buzz(); };
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.onchange = () => { if (state.tab === "settings" && $("#modes")) paintTheme(); };

  wireSeg($("#textSeg", v), setTextSize);
  v.querySelectorAll("[data-accent]").forEach((b) => (b.onclick = () => {
    setAccent(b.dataset.accent);
    v.querySelectorAll("[data-accent]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
    buzz();
  }));
  $("#motionSw", v).onclick = (e) => {
    const on = e.currentTarget.getAttribute("aria-checked") !== "true";
    setMotion(on);
    e.currentTarget.setAttribute("aria-checked", String(on));
  };

  const reload = (msg) => { closeSheet(); toast(msg); state.stale = true; render(); };
  v.querySelectorAll("[data-share]").forEach((b) => (b.onclick = () => openInvite(state.groups.find((g) => g.id === b.dataset.share))));
  $("#replayTour", v).onclick = () => { state.welcome = null; openTour(); };
  $("#installSettings", v)?.addEventListener("click", () => startInstall());
  v.querySelectorAll("[data-leave]").forEach((b) => (b.onclick = async () => {
    const name = groupName(b.dataset.leave);
    if (!window.confirm(`Leave ${name}? They won't see your list anymore. Your list stays the same for your other circles.`)) return;
    try { await api("family/leave", { groupId: b.dataset.leave }); reload(`Left ${name}`); } catch (e) { toast(e.message); }
  }));
  wireForm($("#joinForm", v), async ({ code }) => { const { group: g } = await api("family/join", { code }); reload(`Joined ${g.name}`); });
  $("#startFam", v).onclick = () => openSheet(`
    <h3>Start a new circle</h3>
    <p>You'll get a code to share. Your list comes with you.</p>
    <form id="startForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Circle name</span><input class="input" name="groupName" maxlength="60" placeholder="Family Christmas, Book club" required></label>
      <button class="btn primary wide" type="submit">Create circle</button>
    </form>`, (el2) => wireForm($("#startForm", el2), async ({ groupName: n }) => {
      const { group: g } = await api("family/start", { groupName: n });
      reload(`Started ${g.name}. Code: ${g.code}`);
    }));
  wireHousehold(v, reload);
  const file = $("#photoFile", v);
  $("#pickPhoto", v).onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    const btn = $("#pickPhoto", v);
    btn.disabled = true;
    try { await api("profile", { photo: await squarePhoto(f) }); reload("Photo saved"); }
    catch (e) { toast(e.message); btn.disabled = false; }
  };
  $("#removePhoto", v)?.addEventListener("click", async () => {
    try { await api("profile", { photo: "" }); PHOTOS.delete(state.me.id); reload("Photo removed"); } catch (e) { toast(e.message); }
  });
  // Favorite brands: typed or picked from the list, shown as chips. Saved with the rest of the profile.
  const brands = [...(prof.brands || [])];
  const brandIn = $("#brandIn", v);
  const paintBrands = () => {
    $("#brandChips", v).innerHTML = brandChips(brands, true);
    v.querySelectorAll("[data-unbrand]").forEach((b) => (b.onclick = () => { brands.splice(+b.dataset.unbrand, 1); paintBrands(); }));
  };
  const addBrand = () => {
    const name = brandIn.value.replace(/\s+/g, " ").trim();
    brandIn.value = "";
    if (!name) return;
    if (brands.some((b) => b.toLowerCase() === name.toLowerCase())) return toast(`${name} is already on there`);
    if (brands.length >= 20) return toast("That's a lot of brands. Keep it to 20.");
    brands.push(name);
    paintBrands();
  };
  paintBrands();
  $("#brandAdd", v).onclick = () => { addBrand(); brandIn.focus(); };
  brandIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addBrand(); } });
  // Picking a suggestion from the list adds it right away.
  brandIn.addEventListener("input", (e) => { if (e.inputType === "insertReplacementText" || (!e.inputType && GIFT_LIST.some((g) => g.name === brandIn.value))) addBrand(); });
  // Gift style and favorite colors: tap on and off, up to 3 each. Saved with the rest of the profile.
  const picked = (attr) => [...v.querySelectorAll(`[${attr}][aria-pressed="true"]`)].map((b) => b.getAttribute(attr));
  for (const [attr, what] of [["data-style", "gift styles"], ["data-color", "colors"]]) {
    v.querySelectorAll(`[${attr}]`).forEach((b) => (b.onclick = () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      if (on && picked(attr).length >= 3) return toast(`Pick up to 3 ${what}`);
      b.setAttribute("aria-pressed", String(on));
      buzz();
    }));
  }
  wireForm($("#profileForm", v), async (f) => {
    if (!!f.bmonth !== !!f.bday) throw new Error("Pick both a month and a day for your birthday, or leave both empty.");
    if (brandIn.value.trim()) addBrand();
    const pad = (n) => String(n).padStart(2, "0");
    await api("profile", {
      name: f.name,
      birthday: f.bmonth ? `${pad(f.bmonth)}-${pad(f.bday)}` : "",
      birthYear: f.bmonth ? f.byear.trim() : "",
      sizes: Object.fromEntries(SIZE_LABELS.map(([k]) => [k, f[`size_${k}`]])),
      avoid: f.avoid,
      brands,
      giftStyle: picked("data-style"),
      colors: picked("data-color"),
      loves: f.loves,
    });
    reload("Profile saved");
  });
  wireForm($("#pinForm", v), async ({ pin }) => { await api("profile", { pin }); reload("PIN saved"); });
  $("#removePin", v)?.addEventListener("click", async () => {
    try { await api("profile", { pin: "" }); reload("PIN removed"); } catch (e) { toast(e.message); }
  });
  $("#signOut", v).onclick = async () => {
    try { await api("signout", {}); } catch {}
    setToken(null);
    try { localStorage.removeItem(CACHE_KEY); } catch {}
    state.me = null;
    state.tab = "mine";
    history.replaceState(null, "", location.pathname);
    render();
  };
}

// Settings > Your household. Optional: people who live or gift together. Turning a circle on puts the
// whole household in it, including people added later.
function householdCard() {
  const hh = state.me.household;
  if (!hh) return `<p class="sub">Optional. Group the people you live or gift with, like you and your partner or you and the kids. Then add your whole household to a circle in one tap, and anyone you add later comes along.</p>
    <button class="btn wide" type="button" id="hhAdd">${PLUS} Add someone to your household</button>`;
  const auto = householdAuto(hh.members.map((m) => m.name));
  return `<h4>${HOME_I} ${esc(hh.label)}</h4>
    <div style="margin-top:6px">${hh.members.map((m) => `<div class="hh-row">${avatar(m.name, m.id)}<strong>${esc(m.name)}${m.id === state.me.id ? " <small>(you)</small>" : ""}</strong>
      ${m.id === state.me.id ? "" : `<button class="btn small quiet danger" type="button" data-hh-out="${esc(m.id)}">Remove</button>`}</div>`).join("")}</div>
    <button class="btn wide" type="button" id="hhAdd" style="margin-top:8px">${PLUS} Add someone</button>
    <hr class="set-div">
    <form id="hhNameForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Household name <em style="font-weight:600;color:var(--muted)">(optional)</em></span>
        <input class="input" name="name" maxlength="40" value="${esc(hh.name || "")}" placeholder="${esc(auto)}"></label>
      <p class="hint" style="margin-top:-10px">Leave it empty to use your first names.</p>
      <button class="btn wide" type="submit">Save name</button>
    </form>
    <hr class="set-div">
    <h4>Bring the whole household</h4>
    <p class="sub">On: everyone in your household is in that circle, even people you add later. Off: only people who joined it themselves.</p>
    ${state.groups.map((g, i) => swRow(`hhc${i}`, g.name, "", hh.circles.includes(g.id)).replace('type="button"', `type="button" data-hh-circle="${esc(g.id)}"`)).join("")}
    <hr class="set-div">
    <button class="btn wide quiet danger" type="button" id="hhLeave">Leave household</button>`;
}

function wireHousehold(v, reload) {
  const hh = state.me.household;
  $("#hhAdd", v)?.addEventListener("click", () => {
    const mine = new Set((hh?.members || []).map((m) => m.id));
    const ppl = others().filter((m) => !mine.has(m.id));
    const free = ppl.filter((m) => !m.householdId);
    const taken = ppl.filter((m) => m.householdId);
    openSheet(`<h3>Add to your household</h3>
      <p>Pick someone you share a circle with. ${hh?.circles.length ? `They'll join ${hh.circles.map(groupName).join(", ")} with your household.` : "You can add your household to circles after."}</p>
      <div class="err" hidden></div>
      ${free.length ? free.map((m) => `<button class="pick-person" type="button" data-hh-in="${esc(m.id)}">${avatar(m.name, m.id)}<span>${esc(m.name)}</span></button>`).join("")
        : `<p class="subtle">Nobody to add yet. Invite them to one of your circles first.</p>`}
      ${taken.length ? `<p class="subtle" style="margin-top:16px">Already in a household</p>${taken.map((m) => `<button class="pick-person" type="button" disabled>${avatar(m.name, m.id)}<span>${esc(m.name)}<small>${esc(householdLabel(m.householdId))}</small></span></button>`).join("")}` : ""}`,
    (el) => el.querySelectorAll("[data-hh-in]").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try { await api("household/add", { memberId: b.dataset.hhIn }); buzz(); reload(`Added ${personName(b.dataset.hhIn)} to your household`); }
      catch (e) { const err = $(".err", el); err.textContent = e.message; err.hidden = false; b.disabled = false; }
    })));
  });
  if (!hh) return;
  v.querySelectorAll("[data-hh-out]").forEach((b) => (b.onclick = async () => {
    const name = hh.members.find((m) => m.id === b.dataset.hhOut)?.name || "them";
    if (!window.confirm(`Take ${name} out of your household? They'll leave any circle they were only in through it.`)) return;
    try { await api("household/remove", { memberId: b.dataset.hhOut }); reload(`${name} is out of your household`); } catch (e) { toast(e.message); }
  }));
  wireForm($("#hhNameForm", v), async ({ name }) => { await api("household/rename", { name }); reload("Household name saved"); });
  v.querySelectorAll("[data-hh-circle]").forEach((b) => (b.onclick = async () => {
    const on = b.getAttribute("aria-checked") !== "true";
    const g = groupName(b.dataset.hhCircle);
    if (!on && !window.confirm(`Take your household out of ${g}? Anyone who's only in ${g} through your household will leave it.`)) return;
    b.disabled = true;
    try { await api("household/circle", { groupId: b.dataset.hhCircle, on }); buzz(); reload(on ? `Your household is in ${g}` : `Your household is out of ${g}`); }
    catch (e) { toast(e.message); b.disabled = false; }
  }));
  $("#hhLeave", v).onclick = async () => {
    if (!window.confirm("Leave your household? You'll leave any circle you were only in through it. Your list stays the same.")) return;
    try { await api("household/remove", { memberId: state.me.id }); reload("You left your household"); } catch (e) { toast(e.message); }
  };
}

// Keyboard: Enter/Space on role=button rows.
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.row[role="button"]')) { e.preventDefault(); e.target.click(); }
});
// Refresh when coming back to the app so new wishes and marks show up.
document.addEventListener("visibilitychange", () => { if (!document.hidden && getToken() && !sheet.open) { state.stale = true; render(); } });

readHash();
// An invite link opened while signed in: offer to join that family once you're loaded.
const signedInInvite = getToken() ? invite : null;
if (signedInInvite) { invite = null; history.replaceState(null, "", "/" + location.hash); }
render().then(() => { if (signedInInvite && state.me) offerJoin(signedInInvite); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
