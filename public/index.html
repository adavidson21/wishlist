      <div id="textSeg">${seg("Text size", TEXT_SIZES.map(([k, l, px]) => [k, `<b style="font-size:${px}px">Aa</b>${l}`]), root.dataset.text || "md", "four")}</div>
      <div class="ts-preview"><small>Preview</small>Cozy socks, size medium. Any color but orange!</div>
      <hr class="set-div">
      ${swRow("motionSw", "Animations", "", root.dataset.motion !== "off")}
    </div>

    <div class="label">Sign-in PIN${tip("Stops anyone else signing in as you and seeing your notes.")}</div>
    <div class="set-card">
      <p class="sub">${state.me.hasPin ? "PIN is on." : "No PIN yet."}</p>
      <form id="pinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>${state.me.hasPin ? "New PIN" : "PIN"}</span><input class="input pin-in" name="pin" inputmode="numeric" pattern="\\d{4}" maxlength="4" required></label>
        <div class="actions">
          ${state.me.hasPin ? '<button class="btn danger" type="button" id="removePin">Remove PIN</button>' : ""}
          <button class="btn" type="submit">${state.me.hasPin ? "Change PIN" : "Set PIN"}</button>
        </div>
      </form>
    </div>

    <div class="label" id="famSec">${multi() ? "Your circles" : "Your circle"}${tip(multi() ? "Every circle sees the same list. To hide a wish from one, open it and turn that circle off." : "Do gifts with another group too? Join their circle and keep one list for all of them.")}</div>
    <div class="set-card">
      ${state.groups.map((g) => `<div class="fam">
          ${tileAvatar(g.name, `g:${g.id}`)}
          <span class="who"><strong>${esc(g.name)}</strong><small>Code <span class="code-sm">${esc(g.code)}</span> · ${plural(g.members.length, "person", "people")}${g.createdBy && g.createdBy !== state.me.id && g.members.some((m) => m.id === g.createdBy) ? ` · Started by ${esc(personName(g.createdBy))}` : ""}</small></span>
          ${g.createdBy === state.me.id ? `<button class="btn small quiet" type="button" data-edit-circle="${esc(g.id)}">Edit</button>` : ""}
          <button class="btn small" type="button" data-share="${esc(g.id)}">Invite</button>
          ${multi() ? `<button class="btn small quiet danger" type="button" data-leave="${esc(g.id)}">Leave</button>` : ""}
        </div>`).join("")}
      <p class="sub" style="margin-top:8px">${multi()
        ? "Every circle sees the same list. To hide a wish from one circle, open it and turn that circle off."
        : "Also do gifts with friends, coworkers or your partner's family? Join their circle here and keep one list for all of them."}</p>
      <form id="joinForm" autocomplete="off">
        <div class="err" hidden></div>
        <label class="field"><span>Join another circle</span>
          <input class="input code-in" name="code" maxlength="8" placeholder="ABC234" autocapitalize="characters" required></label>
        <div class="actions">
          <button class="btn" type="button" id="startFam">Start a new one</button>
          <button class="btn primary" type="submit">Join</button>

    <div class="label">The app</div>
    <div class="set-card">
      ${standalone ? "" : `<h4>Add to home screen</h4>
      <button class="btn primary wide" type="button" id="installSettings" style="margin-bottom:10px">${iOS ? "Show me how" : installPrompt ? "Install" : "Show me how"}</button>`}
      <button class="btn wide" type="button" id="replayTour">Replay the welcome tour</button>
    </div>

    <div class="set-card" style="margin-top:26px">
      <button class="btn wide danger" type="button" id="signOut">Sign out on this device</button>
    </div>
`;

  // Light or dark: the two tiles always show what you're seeing now. Picking one turns "Match my phone" off.
  const paintTheme = () => {
    const dark = isDark();
    v.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-checked", String((b.dataset.mode === "dark") === dark)));
    $("#autoTheme", v).setAttribute("aria-checked", String(themeAuto()));
  };
  paintTheme();
  v.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { setTheme(b.dataset.mode); paintTheme(); buzz(); }));
  $("#autoTheme", v).onclick = () => { setTheme(themeAuto() ? (isDark() ? "dark" : "light") : "auto"); paintTheme(); buzz(); };
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.onchange = () => { if (state.tab === "settings" && $("#modes")) paintTheme(); };

  wireSeg($("#textSeg", v), setTextSize);
  $("#motionSw", v).onclick = (e) => {
    const on = e.currentTarget.getAttribute("aria-checked") !== "true";
    setMotion(on);
    e.currentTarget.setAttribute("aria-checked", String(on));
  };

  $("#backBtn").onclick = () => setTab("profile");
  const reload = (msg) => { closeSheet(); toast(msg); state.stale = true; render(); };
  v.querySelectorAll("[data-share]").forEach((b) => (b.onclick = () => openInvite(state.groups.find((g) => g.id === b.dataset.share))));
  $("#replayTour", v).onclick = () => { state.welcome = null; openTour(); };

  }));
  wireForm($("#joinForm", v), async ({ code }) => { const { group: g } = await api("family/join", { code }); reload(`Joined ${g.name}`); });
  $("#startFam", v).onclick = () => openSheet(`
    <h3>Start a new circle</h3>
    <form id="startForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Circle name</span><input class="input" name="groupName" maxlength="60" placeholder="Family Christmas, Book club" required></label>
      <button class="btn primary wide" type="submit">Create circle</button>
    </form>`, (el2) => wireForm($("#startForm", el2), async ({ groupName: n }) => {
      const { group: g } = await api("family/start", { groupName: n });
      reload(`Started ${g.name}. Code: ${g.code}`);
    }));
  wireHousehold(v, reload);
  v.querySelectorAll("[data-edit-circle]").forEach((b) => (b.onclick = () => openCircleEdit(b.dataset.editCircle, reload)));
  wireForm($("#pinForm", v), async ({ pin }) => { await api("profile", { pin }); reload("PIN saved"); });
  $("#removePin", v)?.addEventListener("click", async () => {
    try { await api("profile", { pin: "" }); reload("PIN removed"); } catch (e) { toast(e.message); }
  });
  $("#signOut", v).onclick = async () => {
    try { await api("signout", {}); } catch {}
    setToken(null);
    try { localStorage.removeItem(CACHE_KEY); } catch {}
    state.me = null;
    state.tab = "mine";
    history.replaceState(null, "", location.pathname);
    render();
  };
}

// Edit a circle: its photo and name. Only the person who started it sees the Edit button (the API checks too).
function openCircleEdit(gid, reload) {
  const g = state.groups.find((x) => x.id === gid);
  if (!g) return;
  openSheet(`<h3>Edit circle</h3>
    ${photoRowHtml(g.name, `g:${g.id}`)}
    <hr class="set-div">
    <form id="circleForm" autocomplete="off"><div class="err" hidden></div>
      <label class="field"><span>Circle name</span><input class="input" name="name" maxlength="60" value="${esc(g.name)}" required></label>
      <button class="btn primary wide" type="submit">Save name</button>
    </form>`, (el) => {
    wirePhotoRow(el, async (photo) => { await api("family/edit", { groupId: gid, photo }); reload(photo ? "Circle photo saved" : "Circle photo removed"); });
    wireForm($("#circleForm", el), async ({ name }) => { await api("family/edit", { groupId: gid, name }); reload("Circle renamed"); });
  });
}

// Settings > Your household. Optional: people who live or gift together. Turning a circle on puts the
// whole household in it, including people added later.
function householdCard() {
  const hh = state.me.household;
  if (!hh) return `<button class="btn wide" type="button" id="hhAdd">${PLUS} Add someone to your household</button>`;
  const auto = householdAuto(hh.members.map((m) => m.name));
  return `<div id="hhPhoto">${photoRowHtml(hh.label, `h:${hh.id}`)}</div>
    <h4 style="margin-top:14px">${esc(hh.label)}</h4>
    <div style="margin-top:6px">${hh.members.map((m) => `<div class="hh-row">${avatar(m.name, m.id)}<strong>${esc(m.name)}${m.id === state.me.id ? " <small>(you)</small>" : ""}</strong>
      ${m.id === state.me.id ? "" : `<button class="btn small quiet danger" type="button" data-hh-out="${esc(m.id)}">Remove</button>`}</div>`).join("")}</div>
    <button class="btn wide" type="button" id="hhAdd" style="margin-top:8px">${PLUS} Add someone</button>
    <hr class="set-div">
    <form id="hhNameForm" autocomplete="off">
      <div class="err" hidden></div>
      <label class="field"><span>Household name <em style="font-weight:600;color:var(--muted)">(optional)</em></span>
        <input class="input" name="name" maxlength="40" value="${esc(hh.name || "")}" placeholder="${esc(auto)}"></label>
      <button class="btn wide" type="submit">Save name</button>
    </form>
    <hr class="set-div">
    <h4>Bring the whole household${tip("On: everyone in your household is in that circle, including people you add later.")}</h4>
    ${state.groups.map((g, i) => swRow(`hhc${i}`, g.name, "", hh.circles.includes(g.id)).replace('type="button"', `type="button" data-hh-circle="${esc(g.id)}"`)).join("")}
    <hr class="set-div">
    <button class="btn wide quiet danger" type="button" id="hhLeave">Leave household</button>`;
}

function wireHousehold(v, reload) {
  const hh = state.me.household;
  if (hh) wirePhotoRow($("#hhPhoto", v), async (photo) => { await api("household/photo", { photo }); reload(photo ? "Photo saved" : "Photo removed"); });
  $("#hhAdd", v)?.addEventListener("click", () => {
    const mine = new Set((hh?.members || []).map((m) => m.id));
    const ppl = others().filter((m) => !mine.has(m.id));
    const free = ppl.filter((m) => !m.householdId);
    const taken = ppl.filter((m) => m.householdId);
    openSheet(`<h3>Add to your household</h3>
      <p class="subtle">${hh?.circles.length ? `They'll join ${hh.circles.map(groupName).join(", ")} with your household.` : ""}</p>
      <div class="err" hidden></div>
      ${free.length ? free.map((m) => `<button class="pick-person" type="button" data-hh-in="${esc(m.id)}">${avatar(m.name, m.id)}<span>${esc(m.name)}</span></button>`).join("")
        : `<p class="subtle">Nobody to add yet. Invite them to a circle first.</p>`}
      ${taken.length ? `<p class="subtle" style="margin-top:16px">Already in a household</p>${taken.map((m) => `<button class="pick-person" type="button" disabled>${avatar(m.name, m.id)}<span>${esc(m.name)}<small>${esc(householdLabel(m.householdId))}</small></span></button>`).join("")}` : ""}`,
    (el) => el.querySelectorAll("[data-hh-in]").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try { await api("household/add", { memberId: b.dataset.hhIn }); buzz(); reload(`Added ${personName(b.dataset.hhIn)} to your household`); }
      catch (e) { const err = $(".err", el); err.textContent = e.message; err.hidden = false; b.disabled = false; }
    })));
  });
  if (!hh) return;
  v.querySelectorAll("[data-hh-out]").forEach((b) => (b.onclick = async () => {
    const name = hh.members.find((m) => m.id === b.dataset.hhOut)?.name || "them";
    if (!window.confirm(`Take ${name} out of your household? They'll leave any circle they were only in through it.`)) return;
    try { await api("household/remove", { memberId: b.dataset.hhOut }); reload(`${name} is out of your household`); } catch (e) { toast(e.message); }
  }));
  wireForm($("#hhNameForm", v), async ({ name }) => { await api("household/rename", { name }); reload("Household name saved"); });
  v.querySelectorAll("[data-hh-circle]").forEach((b) => (b.onclick = async () => {
    const on = b.getAttribute("aria-checked") !== "true";
    const g = groupName(b.dataset.hhCircle);
    if (!on && !window.confirm(`Take your household out of ${g}? Anyone who's only in ${g} through your household will leave it.`)) return;
    b.disabled = true;
    try { await api("household/circle", { groupId: b.dataset.hhCircle, on }); buzz(); reload(on ? `Your household is in ${g}` : `Your household is out of ${g}`); }
    catch (e) { toast(e.message); b.disabled = false; }
  }));
  $("#hhLeave", v).onclick = async () => {
    if (!window.confirm("Leave your household? You'll leave any circle you were only in through it. Your list stays the same.")) return;
    try { await api("household/remove", { memberId: state.me.id }); reload("You left your household"); } catch (e) { toast(e.message); }
  };
}

// Keyboard: Enter/Space on role=button rows.
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.row[role="button"]')) { e.preventDefault(); e.target.click(); }
});
// Refresh when coming back to the app so new wishes and marks show up.
document.addEventListener("visibilitychange", () => { if (!document.hidden && getToken() && !sheet.open) { state.stale = true; render(); } });

readHash();
// An invite link opened while signed in: offer to join that family once you're loaded.
const signedInInvite = getToken() ? invite : null;
if (signedInInvite) { invite = null; history.replaceState(null, "", "/" + location.hash); }
render().then(() => { if (signedInInvite && state.me) offerJoin(signedInInvite); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
