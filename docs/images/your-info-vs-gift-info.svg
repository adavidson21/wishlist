<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="560" rx="24" fill="#FAF6F1"/>
<text x="44" y="64" font-size="32" font-weight="800" fill="#2A1E22">Your info vs. gift info</text>
<text x="44" y="98" font-size="19" fill="#6E5A60">Hints keeps two kinds of things, and treats them differently.</text>
<rect x="40" y="128" width="545" height="396" rx="22" fill="#fff" stroke="#2F5D4A" stroke-width="3"/>
<rect x="40" y="128" width="545" height="78" rx="22" fill="#2F5D4A"/><rect x="40" y="178" width="545" height="28" fill="#2F5D4A"/>
<text x="68" y="178" font-size="25" font-weight="800" fill="#fff">🙂  About you</text>
<circle cx="80" cy="244" r="5" fill="#2F5D4A"/><text x="98" y="250" font-size="19" fill="#2A1E22">Your profile photo (your face)</text>
<circle cx="80" cy="284" r="5" fill="#2F5D4A"/><text x="98" y="290" font-size="19" fill="#2A1E22">Your name and birthday</text>
<circle cx="80" cy="324" r="5" fill="#2F5D4A"/><text x="98" y="330" font-size="19" fill="#2A1E22">Sizes, loves, nopes, allergies</text>
<circle cx="80" cy="364" r="5" fill="#2F5D4A"/><text x="98" y="370" font-size="19" fill="#2A1E22">Pet and household photos</text>
<circle cx="80" cy="404" r="5" fill="#2F5D4A"/><text x="98" y="410" font-size="19" fill="#2A1E22">Your PIN and which circles you're in</text>
<rect x="64" y="432" width="497" height="68" rx="14" fill="#E3EFE8"/>
<text x="84" y="472" font-size="21" font-weight="800" fill="#2F5D4A">🚫🤖  Never sent to any AI. Ever.</text>
<rect x="615" y="128" width="545" height="396" rx="22" fill="#fff" stroke="#D9A94A" stroke-width="3"/>
<rect x="615" y="128" width="545" height="78" rx="22" fill="#D9A94A"/><rect x="615" y="178" width="545" height="28" fill="#D9A94A"/>
<text x="643" y="178" font-size="25" font-weight="800" fill="#2A1E22">🎁  About gifts</text>
<circle cx="655" cy="244" r="5" fill="#D9A94A"/>
<text x="673" y="250" font-size="19" fill="#2A1E22">A wish’s name, store link and brand</text>
<circle cx="655" cy="284" r="5" fill="#D9A94A"/>
<text x="673" y="290" font-size="19" fill="#2A1E22">The size or color picked on a wish</text>
<circle cx="655" cy="324" r="5" fill="#D9A94A"/>
<text x="673" y="330" font-size="19" fill="#2A1E22">A photo of a product you search for</text>
<text x="673" y="370" font-size="19" fill="#6E5A60">(Never who it’s for, or anyone’s face)</text>
<rect x="639" y="404" width="497" height="96" rx="14" fill="#FBF1DC"/>
<text x="659" y="444" font-size="19" font-weight="800" fill="#7A5410">✨  Can go to Google Gemini to find</text>
<text x="659" y="472" font-size="19" font-weight="800" fill="#7A5410">the product. Not used to train AI.</text>
</svg>
