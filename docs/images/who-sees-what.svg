<text x="52" y="250" font-size="20" font-weight="700" fill="#2A1E22">Wishes still in “Maybe”</text>
<text x="52" y="273" font-size="15.5" fill="#6E5A60">Drafts, just for you</text>
<circle cx="720" cy="253.0" r="17" fill="#E3EFE8"/><path d="M713 253.0 l5 5 9-10" fill="none" stroke="#2F5D4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
