<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" width="1200" height="652" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="652" rx="24" fill="#FAF6F1"/>
<text x="44" y="64" font-size="32" font-weight="800" fill="#2A1E22">Who sees what</text>
<text x="44" y="98" font-size="19" fill="#6E5A60">Hints enforces this behind the scenes, not just by hiding things on screen. The person a gift is for can never see it.</text>
<text x="720" y="136" font-size="17" font-weight="800" fill="#2A1E22" text-anchor="middle">You</text>
