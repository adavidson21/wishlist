<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1200" height="330" rx="24" fill="#FAF6F1"/>
<rect x="40" y="36" width="258" height="258" rx="20" fill="#fff" stroke="#E8DED6" stroke-width="2"/>
<circle cx="80" cy="76" r="20" fill="#82263C"/><text x="80" y="83" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="264" y="92" font-size="40" text-anchor="middle">✉️</text>
<text x="64" y="148" font-size="27" font-weight="800" fill="#2A1E22">Join</text>
<text x="64" y="190" font-size="18" fill="#6E5A60">Open the invite link</text>
<text x="64" y="218" font-size="18" fill="#6E5A60">from your family and</text>
<text x="64" y="246" font-size="18" fill="#6E5A60">tap your name.</text>
<path d="M303.0 157 l8 8 -8 8" fill="none" stroke="#D9A94A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="36" width="258" height="258" rx="20" fill="#fff" stroke="#E8DED6" stroke-width="2"/>
<circle cx="360" cy="76" r="20" fill="#82263C"/><text x="360" y="83" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="544" y="92" font-size="40" text-anchor="middle">📝</text>
<text x="344" y="148" font-size="27" font-weight="800" fill="#2A1E22">Add wishes</text>
<text x="344" y="190" font-size="18" fill="#6E5A60">Paste a store link.</text>
<text x="344" y="218" font-size="18" fill="#6E5A60">The name, photo and</text>
<text x="344" y="246" font-size="18" fill="#6E5A60">price fill themselves.</text>
<path d="M583.0 157 l8 8 -8 8" fill="none" stroke="#D9A94A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="36" width="258" height="258" rx="20" fill="#fff" stroke="#E8DED6" stroke-width="2"/>
<circle cx="640" cy="76" r="20" fill="#82263C"/><text x="640" y="83" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="824" y="92" font-size="40" text-anchor="middle">👀</text>
<text x="624" y="148" font-size="27" font-weight="800" fill="#2A1E22">Peek at lists</text>
<text x="624" y="190" font-size="18" fill="#6E5A60">See what everyone</text>
<text x="624" y="218" font-size="18" fill="#6E5A60">is hoping for, sorted</text>
<text x="624" y="246" font-size="18" fill="#6E5A60">by person.</text>
<path d="M863.0 157 l8 8 -8 8" fill="none" stroke="#D9A94A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="880" y="36" width="258" height="258" rx="20" fill="#fff" stroke="#E8DED6" stroke-width="2"/>
<circle cx="920" cy="76" r="20" fill="#82263C"/><text x="920" y="83" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="1104" y="92" font-size="40" text-anchor="middle">🎁</text>
<text x="904" y="148" font-size="27" font-weight="800" fill="#2A1E22">Claim a gift</text>
<text x="904" y="190" font-size="18" fill="#6E5A60">Tap “I’ll get this.”</text>
<text x="904" y="218" font-size="18" fill="#6E5A60">Everyone else sees it’s</text>
<text x="904" y="246" font-size="18" fill="#6E5A60">taken. They never do.</text>
</svg>
